/* ═══════════════════════════════════════════════════
   SURVIVAL — one mistake and the run is over
═══════════════════════════════════════════════════ */
let isSurv = false;

function startSurvival() {
  isSurv = true; isDaily = false; isMil = false; _seed = null; runSeed = null;
  diffKey = 'moderado';
  cat = buildGame('moderado');
  cat.name = 'Mata-mata';
  // a long queue; the run ends on the first mistake, not on length
  const extra = buildGame('dificil');
  cat.qs = cat.qs.concat(extra.qs);
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = []; runNew = 0; runNewIds = []; runPulls = []; runPackOpened = false; gameN++;
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = getDisp(cat.qs[0]);
  startTmr();
  go();
}

/* ═══════════════════════════════════════════════════
   RUMO AO MILHÃO — the prize ladder

   The headline mode. Sixteen questions, one per rung, each worth
   more than the last and each drawn from a harder pool with a shorter
   clock and nastier distractors. Two rungs are checkpoints: clear one
   and that money is yours whatever happens afterwards. Miss a question
   and the run ends at your last checkpoint — so every rung above one is
   a bet, and "PARAR" is always on the table.
═══════════════════════════════════════════════════ */
/* Sixteen rungs across five tiers, so the climb is a climb. The two safe
   rungs sit at the top of a tier — you bank at the end of a plateau, then the
   questions step up. */
const LADDER = [
  { v:      1000, tier: 1, time: 45 },
  { v:      2000, tier: 1, time: 45 },
  { v:      3000, tier: 1, time: 42 },
  { v:      5000, tier: 1, time: 40, safe: true },
  { v:     10000, tier: 2, time: 38 },
  { v:     15000, tier: 2, time: 36 },
  { v:     20000, tier: 2, time: 34 },
  { v:     30000, tier: 3, time: 32 },
  { v:     50000, tier: 3, time: 30, safe: true },
  { v:     75000, tier: 3, time: 30 },
  { v:    100000, tier: 4, time: 28 },
  { v:    150000, tier: 4, time: 26 },
  { v:    250000, tier: 4, time: 24 },
  { v:    400000, tier: 5, time: 22 },
  { v:    600000, tier: 5, time: 20 },
  { v:   1000000, tier: 5, time: 20 },
];

let isMil  = false;
let rung   = 0;       // index into LADDER — the question being played for
let banked = 0;       // guaranteed by the last checkpoint cleared
let cashed = false;   // player pressed PARAR instead of falling
let ladderOpen = false;   // the ladder sheet is up; the clock waits

const RUNG    = () => LADDER[Math.min(rung, LADDER.length - 1)];
const isFinal = () => rung === LADDER.length - 1;

/* R$ 1.000.000 — pt-BR grouping without leaning on Intl in old WebViews */
function money(v) {
  return 'R$ ' + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

/* the money you walk away with if you get this one wrong */
function safetyNet() {
  let v = 0;
  for (let i = 0; i < rung; i++) if (LADDER[i].safe) v = LADDER[i].v;
  return v;
}

/* seconds on the clock and distractor strictness for the current question */
/* Seconds on the clock. A carta especial is read, not skimmed — four clues,
   or four events to put in order — so it gets a floor instead of the squeeze
   its tier would normally apply. R$ 600.000 is a hard enough thing to ask
   without twenty seconds to sort four decades in. */
function qTime() {
  if (!isMil) return DCFG().time;
  const q = cat && cat.qs && cat.qs[qi];
  if (q && q._special) return Math.max(RUNG().time, q.order ? 50 : 45);
  return RUNG().time;
}
function qStrict() { return isMil ? Math.min(1, rung / (LADDER.length - 1) * 1.15) : DCFG().strict; }

/* One question per rung, each matched to that rung's tier. Built in one pass
   so a question can never repeat inside a run. */
function buildMilhao() {
  let all = CATS.flatMap(c => c.qs.map(q => ({ ...q, _cat: c })));
  if (typeof GEN_QS === 'function') {
    all = all.concat(GEN_QS(1)).concat(GEN_QS(2)).concat(GEN_QS(3));
  }
  all.forEach(q => { q._d = qTier(q); });

  const seen = new Set();
  const pool = shuf(all).filter(q => { if (seen.has(q.t)) return false; seen.add(q.t); return true; });

  const used = new Set();
  const usedA = new Set();
  const byCat = {}, byShape = {};
  let prevCat = null, prevShape = null;
  const genTarget = Math.round(LADDER.length * 0.3);
  let genN = 0;

  /* ── Why the same climb twice ──────────────────────────────────
     The weights below were deterministic apart from a ±3 jitter, and the tier
     term is ±10 per step, so among the dozens of questions that fit a rung the
     same one won every single time. Rung one was always "de que estado é este
     clube?", rung two was always the goalkeeper question. Sixteen right
     answers in the same order is still a recipe.

     Two things change that, and neither touches the ramp. A standing
     preference per shape family, drawn once per climb, so this climb likes
     what the last one passed over. And the pick is made at random from
     everything scoring within a hair of the best rather than from the best
     alone — the margin is under the tier step, so a question from the wrong
     tier can never win it. */
  const bias = {};
  const biasOf = k => (bias[k] !== undefined ? bias[k] : (bias[k] = (rnd() - 0.5) * 9));
  const PICK_MARGIN = 7;

  const qs = LADDER.map(step => {
    /* The shortlist is kept as we go and pruned whenever the bar rises, rather
       than scoring the whole pool into an array and filtering it afterwards:
       that was a couple of thousand throwaway objects per rung, and a climb is
       built sixteen times over. */
    let bestW = -1e9;
    let near = [];
    for (let i = 0; i < pool.length; i++) {
      if (used.has(i) || usedA.has(ansKey(pool[i]))) continue;
      const cid   = (pool[i]._cat && pool[i]._cat.id) || '?';
      const shape = qShape(pool[i]);
      const w = -Math.abs(pool[i]._d - step.tier) * 10 + rnd() * 3
              + (String(cid).startsWith('g_') ? 0 : 5)   // prefer a written question
              + biasOf(shape)
              - (byCat[cid] || 0) * 5
              - (byShape[shape] || 0) * 12
              - (cid === prevCat ? 8 : 0)
              - (shape === prevShape ? 14 : 0)
              + (String(cid).startsWith('g_') && genN < genTarget ? 16 : 0);
      if (w > bestW) {
        bestW = w;
        near = near.filter(c => c.w >= bestW - PICK_MARGIN);
        near.push({ i, w });
      } else if (w >= bestW - PICK_MARGIN) {
        near.push({ i, w });
      }
    }
    if (!near.length) return null;
    const best = near[Math.floor(rnd() * near.length)].i;
    used.add(best);
    const q = pool[best];
    usedA.add(ansKey(q));
    const cid = (q._cat && q._cat.id) || '?';
    byCat[cid] = (byCat[cid] || 0) + 1;
    byShape[qShape(q)] = (byShape[qShape(q)] || 0) + 1;
    if (String(cid).startsWith('g_')) genN++;
    prevCat = cid; prevShape = qShape(q);
    return q;
  }).filter(Boolean);

  /* Four of the sixteen rungs stop being a written question here and become
     a card dealt from the album's own data. It is the same climb; it just
     stops being sixteen of the same shape. */
  dealSpecials(qs);

  return { id:'milhao', name:'Rumo ao Milhão', emoji:'💰',
           tag:'Uma pergunta por degrau', col:'#FFD700', diff:'Show', qs };
}

function startMilhao() {

/* ═══════════════════════════════════════════════════
   EMBLEMS — every polity's brasão, drawn
   No state of the ancient world left a flag to photograph, and the ones
   that did are public domain only in spirit. Each is therefore a shield in
   its own two colours with one device on it — a crown, a sun, an eagle —
   the way a schoolbook marks an empire on its map.
═══════════════════════════════════════════════════ */
function _lum(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
function _dist(a, b) {
  const p = hex => {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h.split('').map(x => x + x).join('');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  return Math.sqrt((r1 - r2) ** 2 + (g1 - g2) ** 2 + (b1 - b2) ** 2);
}

function genericCrest(id) {
  const c = CL.find(x => x.id === id);
  if (!c) return '';
  const uid  = 'c' + id.replace(/\W/g, '');
  const base = c.c1;
  const alt  = _dist(c.c1, c.c2) > 70 ? c.c2 : (_lum(base) < 0.5 ? '#ececec' : '#1a1a1a');
  const ink  = _lum(base) < 0.55 ? (_lum(alt) > 0.6 ? alt : '#ffffff') : '#141414';
  const edge = _lum(base) < 0.5 ? '#f0f0f0' : '#1a1a1a';
  const SHIELD = 'M30 2 L55.8 10.4 L55.8 31.2 C55.8 45.6 43.8 55.2 30 59.1 '
               + 'C16.2 55.2 4.2 45.6 4.2 31.2 L4.2 10.4 Z';
  const dev = (EMBLEM[c.em] || EMBLEM.star)(ink);
  return `
    <defs><clipPath id="${uid}s"><path d="${SHIELD}"/></clipPath></defs>
    <g clip-path="url(#${uid}s)">
      <path d="${SHIELD}" fill="${base}"/>
      <rect x="0" y="45" width="60" height="16" fill="${alt}" opacity=".9"/>
    </g>
    <path d="${SHIELD}" fill="none" stroke="${edge}" stroke-width="2.2" stroke-linejoin="round"/>
    ${dev}
    <text x="30" y="52.6" text-anchor="middle"
      font-family="'Archivo','Arial Black',Impact,sans-serif"
      font-size="8.4" font-weight="800" letter-spacing=".5" fill="${_lum(alt) < .5 ? '#fff' : '#141414'}">${c.a}</text>`;
}

function clubArt(id, style, label) {
  const name = clubName(id);
  const inner = LOGOS[id]
    ? `<img src="${LOGOS[id]}" alt="" aria-hidden="true" onerror="clubFallback(this,'${id}')" />`
    : `<svg viewBox="0 0 60 60" class="fill" aria-hidden="true">${genericCrest(id)}</svg>`;
  return `<span class="crest-disc" style="${style || ''}"
    ${label ? `role="img" aria-label="${name}"` : 'aria-hidden="true"'}>${inner}</span>`;
}
function clubFallback(img, id) {
  try { img.outerHTML = `<svg viewBox="0 0 60 60" class="fill" aria-hidden="true">${genericCrest(id)}</svg>`; }
  catch (e) { img.style.opacity = '.3'; }
}

/* ═══════════════════════════════════════════════════
   ANSWER TILES — every written choice carries a picture

   A choice that names a figure, a polity, a country or a monument wears that
   face, emblem, flag or photograph when most of the board does. Any other
   board — years, centuries, rivers, scripts, treaties, battles — is drawn:
   each answer gets a little engraving of the kind of thing it is, the same
   kind on every slip of the board, so the pictures say what the question is
   about and never which slip is right.
═══════════════════════════════════════════════════ */
let _optIdx = null;
function optIndex() {
  if (_optIdx) return _optIdx;
  const club = {}, flag = {}, face = {}, stad = {};
  CL.forEach(c => { club[_fold(c.n)] = c.id; });
  Object.entries(CTRY_NAME).forEach(([c, n]) => { if (FLAGS[c]) flag[_fold(n)] = c; });
  /* a name two figures share is nobody's in particular; a surname or a first
     name the album holds once ("Bonaparte", "Napoleão") is that figure's */
  const seen = {}, part = {};
  PL.forEach(p => {
    if (!p.img || !p.n) return;
    const n = _fold(p.n); seen[n] = (seen[n] || 0) + 1; face[n] = p;
    const w = n.replace(/[(),]/g, ' ').split(/\s+/).filter(x => x.length >= 4 && !/^(the|von|van|der|dos|das|del|della)$/.test(x));
    if (w.length > 1) w.forEach(x => { part[x] = part[x] === undefined ? p : null; });
  });
  Object.keys(seen).forEach(n => { if (seen[n] > 1) delete face[n]; });
  Object.keys(part).forEach(x => { if (part[x] && !(x in face) && !club[x] && !flag[x]) face[x] = part[x]; });
  Object.keys(STAD).forEach(k => { if (STAD_IMGS[k]) stad[_fold(STAD[k].name)] = k; });
  return (_optIdx = { club, flag, face, stad });
}

/* What one written choice is a picture of, if anything. */
function optResolve(text) {
  const raw = _fold(text).trim(), X = optIndex();
  /* "Luxor (antiga Tebas)": the name before the brackets is the thing */
  const f = raw.replace(/\s*\(.*\)\s*$/, '').trim();
  for (const k of [raw, f]) {
    if (X.club[k]) return { k: 'club', id: X.club[k] };
    if (X.flag[k]) return { k: 'ctry', iso: [X.flag[k]] };
    if (X.face[k]) return { k: 'face', img: X.face[k].img, id: X.face[k].id };
    if (X.stad[k]) return { k: 'stad', id: X.stad[k], img: STAD_IMGS[X.stad[k]] };
  }
  /* "Gregos e romanos": two peoples, two flags */
  const two = f.split(/\s+e\s+/);
  if (two.length === 2 && X.flag[two[0]] && X.flag[two[1]]) return { k: 'ctry', iso: [X.flag[two[0]], X.flag[two[1]]] };
  return null;
}

/* asked about the look of the thing: its picture would be the answer */
const OPT_LOOKS = /\b(bandeira|brasao|emblema|simbolo|cores?|retrato|rosto|foto|fotografia|imagem|aparencia)\b/;

/* ── What kind of thing an answer is ──
   Read from the question first ("qual rio…", "em que século…"), then from
   the answer itself (a year is a year whatever the question says). */
const ROMAN_RX = /^(s[eé]c(ulo|\.)?\s*)?([ivxlc]+)(\s*a\.?\s?c\.?)?$/i;
const OPT_TOPIC_Q = [
  ['century', /\bem que seculo\b|\bqual seculo\b|\bseculo em que\b/],
  ['year',    /\bem que ano\b|\bqual ano\b|\bano em que\b|\bque data\b|\bem que data\b/],
  ['date',    /\bem que (data|dia|mes)\b|\bque dia\b|\bqual (data|dia|mes)\b/],
  ['river',   /\b(rio|rios|afluente|delta|nascente)\b/],
  ['sea',     /\b(mar|mares|oceano|oceanos|golfo|estreito|canal|baia)\b/],
  ['build',   /\b(cidadela|ruinas?|sitio arqueologico|fortaleza|castelo|muralha|piramide|palacio|aqueduto|maravilhas?|colosso|farol|mausoleu)\b/],
  ['road',    /\b(estrada|estradas|via|vias|caminho|rota da seda|rota terrestre)\b/],
  ['mount',   /\b(montanha|monte|cordilheira|vulcao|serra|pico|alpes|andes)\b/],
  ['land',    /\b(vale|planicie|planalto|deserto|regiao|territorio|estepe|floresta|selva|savana|colonia)\b/],
  ['island',  /\b(ilha|ilhas|arquipelago|peninsula)\b/],
  ['script',  /\b(escrita|alfabeto|hieroglif\w*|cuneiform\w*|idioma|lingua|linguas|letras)\b/],
  ['battle',  /\b(batalha|batalhas|guerra|guerras|revolta|cerco|invasao|conflito|exercito|derrota|vitoria)\b/],
  ['treaty',  /\b(tratado|acordo|lei|leis|codigo|constituicao|decreto|carta|edito|bula|manifesto|declaracao|pacto|documento|conferencia|congresso|concilio|assembleia|cupula|conven[cç]ao)\b/],
  ['book',    /\b(livro|obra|romance|poema|epopeia|peca|poesia|escreveu|escrito|publicou)\b/],
  ['art',     /\b(pintura|quadro|tela|escultura|estatua|afresco|mural|pintou|esculpiu|estilo|movimento artistico)\b/],
  ['music',   /\b(sinfonia|opera|musica|compos|compositor|cancao|hino)\b/],
  ['temple',  /\b(religiao|religioes|deus|deusa|deuses|templo|igreja|catedral|mesquita|crenca|culto|profeta|santo|papa|ordem religiosa|heresia)\b/],
  ['build',   /\b(construiu|construcao|monumento|palacio|piramide|muralha|castelo|fortaleza|ponte|aqueduto|arquitet\w*)\b/],
  ['invent',  /\b(invent\w*|descobr\w*|maquina|tecnologia|cientific\w*|teoria|vacina|experiment\w*|elemento quimico|ferramenta|instrumento|aparelho|criad[oa]|criou|tecnica|motor)\b/],
  ['plague',  /\b(peste|epidemia|pandemia|doenca|praga|gripe|varicela|variola)\b/],
  ['crop',    /\b(cultivo|cultura|plantacao|lavoura|cafe|acucar|algodao|borracha|trigo|cana|planta|alimento|fruta|cereal)\b/],
  ['weapon',  /\b(arma|armas|canhao|polvora|espada|lanca|arco|catapulta|bomba)\b/],
  ['ship',    /\b(navio|navios|caravela|nau|frota|esquadra|navega\w*|viagem|expedicao|rota)\b/],
  ['coin',    /\b(moeda|dinheiro|comercio|imposto|tributo|ouro|prata|especiaria|mercadoria|produto|exportava)\b/],
  ['city',    /\b(cidade|cidades|capital|capitais|porto|vila|sede|local|lugar|bairro|onde (fica|ficava|foi|nasceu|morreu|aconteceu))\b/],
  ['people',  /\b(povo|povos|tribo|tribos|civilizacao|civilizacoes|dinastia|cla|casta|classe|grupo)\b/],
  ['idea',    /\b(ideologia|doutrina|filosofia|movimento|regime|sistema|corrente|escola|reforma)\b/],
  ['person',  /^quem\b|\bquem (foi|era|liderou|fundou|governou|escreveu|pintou|descobriu|inventou)\b|\b(rei|rainha|imperador|imperatriz|farao|papa|presidente|general|lider|governante|filosofo|cientista|pintor|escritor|navegador|explorador|personagem|sultao|czar|califa)\b/],
  ['title',   /\b(titulo|cargo|apelido|epiteto|conhecid[oa] como|chamad[oa])\b/],
];
function optTopic(choice, tq) {
  const c = _fold(choice).trim();
  if (/^-?\d{1,4}(\s*a\.?\s?c\.?)?$/.test(c)) return 'year';
  if (/^\d{1,2}(º|o)? de [a-z]+( de -?\d{1,4}( a\.?\s?c\.?)?)?$/.test(c) || /^(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)( de \d{1,4})?$/.test(c)) return 'date';
  if (ROMAN_RX.test(c) && /[ivxlc]/.test(c) && c.length <= 14) return 'century';
  if (/^[\d.,]+(\s+[a-z]+)?$/.test(c)) return 'number';
  for (const [k, rx] of OPT_TOPIC_Q) if (rx.test(tq)) return k;
  if (/^(o|a|os|as) /.test(c) && c.split(/\s+/).length >= 3) return 'title';
  return '';
}

const _hh = s => { let h = 0; for (const ch of String(s)) h = (h * 33 + ch.charCodeAt(0)) >>> 0; return h; };
const G_INK = '#2A1D10', G_GOLD = '#B08A3E', G_PAPER = '#F1E7CF';
const G_DYES = ['#7B1E3A', '#2F5D62', '#8A5A2B', '#3F4F7A', '#5E6B3A', '#7A4F86', '#9A5B1E'];
/* the era a board belongs to, so a person drawn on it wears its clothes */
function optEra(q) {
  const y = (typeof qCues === 'function' ? qCues(q).year : null);
  if (y !== null && y !== undefined) return y < 500 ? 'ant' : y < 1500 ? 'med' : y < 1800 ? 'mod' : 'new';
  const cid = (q._cat && q._cat.id) || '';
  if (/egito|grecia|roma|antig/.test(cid)) return 'ant';
  if (/medieval|oriente/.test(cid)) return 'med';
  if (/renasc|absolut|descobr|colonia/.test(cid)) return 'mod';

}

    ? `<span class="opt-art opt-crest opt-ink">${shieldGlyph(r.n)}</span>`
    : `<span class="opt-art opt-face opt-ink opt-glyph">${r.topic === 'person' ? bustGlyph(r.n, r.era) : topicGlyph(r.topic, r.n, r.era)}</span>`;
  return '';
}

/* ═══════════════════════════════════════════════════
   POCKET — one answer tile

   Ten of these make the board. Each is a pocket in the album page with
   a numbered tab in the corner, and can carry the audience vote, the
   guest's pick, or the lock-in dimming, depending on what the player
   has spent.
═══════════════════════════════════════════════════ */
function badge(item, idx) {
  const isPlayer = 'img' in item;
  const isSel   = sel.has(item.id);
  const live    = sc === 'quiz' || sc === 'ask' || sc === 'lock';
  const isAns   = (sc === 'reveal') && cat.qs[qi].a.includes(item.id);
  const isWrong = (sc === 'reveal') && isSel && !isAns;
  const curQ    = (cat && cat.qs && cat.qs[qi]) || {};
  const delay   = `animation-delay:${Math.min(9, idx || 0) * 28}ms;`;

  if (hidden.has(item.id) && live) {
    return `<div class="b-gone" style="${delay}${isTextQ(curQ) ? 'min-height:44px' : 'aspect-ratio:1/1.22'}"></div>`;
  }

  let cls = 'b';
  if (sc === 'reveal') {
    if (isAns)        cls += ' b-correct';
    else if (isWrong) cls += ' b-wrong';
  } else if (sc === 'ask' || sc === 'lock') {
    cls += isSel ? ' b-locked' : ' b-faded';       // the board holds its breath
  } else if (isSel) {
    cls += ' b-sel';
  } else if (expert && expert.id === item.id) {
    cls += ' expert-ring';
  }

  /* ── a card to be placed in order: its number is the place you gave it ── */
  if (curQ.order) {
    const at = [...sel].indexOf(item.id);
    let oc = 'b b-ord' + (at >= 0 ? ' b-ord-on' : '');
    if (sc === 'reveal') oc += curQ.a[at] === item.id ? ' b-correct' : ' b-wrong';
    return `<div class="${oc}" data-id="${item.id}" style="${delay}">
      <span class="ord-n">${at >= 0 ? at + 1 : ''}</span>
      ${item.crest ? `<span class="ord-art crest-box">${clubArt(item.crest, '', false)}</span>`
        : item.face && PL.find(p => p.id === item.face) ? `<span class="ord-art ord-face"><img src="${PL.find(p => p.id === item.face).img}" alt="" aria-hidden="true" /></span>`
        : item.flag ? `<span class="ord-art ord-flag"><svg viewBox="0 0 9 6" preserveAspectRatio="none" aria-hidden="true">${FLAGS[item.flag] || ''}</svg></span>`
        : `<span class="ord-art ord-photo">${ART.hourglass(60)}</span>`}
      <span class="ord-t">${item.label}${item.sub ? `<em>${item.sub}</em>` : ''}</span>
      ${sc === 'reveal' ? `<span class="ord-y num">${yearTxt(item.y)}</span>` : ''}
    </div>`;
  }

  const tab = `<span class="tab">${NUM(idx)}</span>`;
  const votePct = poll && poll[item.id] !== undefined ? poll[item.id] : null;
  if (votePct !== null) {
    cls += ' b-voted';
    if (poll && votePct === Math.max(...Object.values(poll))) cls += ' b-top-vote';
  }
  const voteEl  = votePct === null ? '' :
    `<span class="vote-pct">${votePct}%</span>
     <span class="vote"><i style="width:${votePct}%;animation-delay:${(idx || 0) * 45}ms;"></i></span>`;
  const longCls = item.n.length > 15 ? ' tile-name-long' : '';

  if (isTextQ(curQ)) {
    const oa = optArtFor(curQ), art = oa ? optArtHtml(oa[item.id]) : '';
    return `<div class="${cls} b-text${art ? ' b-art' : ''}${curQ.myth ? ' b-myth' : ''}" data-id="${item.id}" style="${delay}">
      ${tab}${voteEl}${art}<span class="tile-name${longCls}">${item.n}</span></div>`;
  }

  if (isPlayer) {
    return `<div class="${cls} b-fig" data-id="${item.id}" style="${delay}">
      ${tab}${voteEl}
      ${figurinha(item, 'sm', { decorative: true, sub: '', noFlag: curQ._noFlag,
                                hideCtry: curQ._hideCtry, hideEra: curQ._hideEra })}
    </div>`;
  }

  // ── Polity pocket ──
  return `<div class="${cls} b-crest" data-id="${item.id}" style="${delay}">
    ${tab}${voteEl}
    <div class="crest-box">${clubArt(item.id, '', false)}</div>
    <span class="tile-name tile-club${longCls}">${item.n}</span>
  </div>`;
}

/* ═══════════════════════════════════════════════════
   THE PICTURE ON A QUESTION CARD
   Every question carries one: a figure's face, a polity's emblem, a flag, a
   monument, or the drawn vignette of its subject. None of them may be the
   answer — merge_questions.py refuses a row that does that, and the
   generated ones are checked here.
═══════════════════════════════════════════════════ */
function _answerIsFace(q, id) { return (q.a || []).includes(id); }
function _answerNames(q, name) {
  const F = _fold, n = F(name || '');
  return !!n && (q.a || []).some(a => F(a) === n || F((optResolve(a) || {}).id || '') === F(name));
}
function faceHtml(img) {
  return `<div class="qart qart-face print"><img src="${img}" alt="" aria-hidden="true"
        onerror="this.parentElement.style.display='none'" /></div>`;
}
function questionArtRaw(q) {
  if (q.order) return '';   // the cards themselves are the question
  if (q.stad) {
    return STAD_IMGS[q.stad]
      ? `<div class="qart qart-wide print"><img src="${STAD_IMGS[q.stad]}" alt="" aria-hidden="true"
          onerror="this.parentElement.outerHTML='<div class=\\'qart qart-wide qart-draw\\'>' + ART.column(104) + '</div>'" /></div>`
      : `<div class="qart qart-wide print qart-ink">${ART.column(104)}</div>`;
  }
  if (q.face) {
    const fp = PL.find(x => x.img === q.face);
    if (!fp || !_answerIsFace(q, fp.id)) return faceHtml(q.face);
  }
  if (q.who) {
    const w = PL.find(p => p.id === q.who);
    if (w && w.img && !_answerIsFace(q, w.id)) return faceHtml(w.img);
  }
  if (q.crest && !(q.a || []).includes(q.crest) && !_answerNames(q, clubName(q.crest)))
    return `<div class="qart qart-crest${q._crestIsQ ? ' qart-hero' : ''}">${
      clubArt(q.crest, 'max-width:100%;max-height:100%;object-fit:contain;', true)}</div>`;
  if (q.flag && FLAGS[q.flag] && (q._flagIsQ || !_answerNames(q, CTRY_NAME[q.flag])) &&
      (q._flagIsQ || !(q.type === 'player' && (q.a || []).some(id => (PL.find(p => p.id === id) || {}).ctry === q.flag))))
    return `<div class="qart qart-flag" role="img" aria-label="${CTRY_NAME[q.flag] || q.flag}">${qFlagInner(q.flag)}</div>`;
  if (q.path && q.path.length) {
    const shown = q.path.filter(c => CL.some(x => x.id === c)).slice(0, 4);
    if (shown.length >= 2)
      return `<div class="qart qart-path" role="img" aria-label="Estados da trajetória">
        ${shown.map((c, i) => `<span class="qp crest-box" style="animation-delay:${i * 90}ms">${
          clubArt(c, '', false)}</span>`).join('')}</div>`;
    return `<div class="qart qart-wide print qart-ink">${ART.map(104)}</div>`;
  }
  if (q.clues || /\bquem sou eu\b/i.test(q.t || ''))
    return `<div class="qart qart-wide print qart-ink" role="img" aria-label="Busto misterioso">${ART.bust(104)}</div>`;
  const key = q.icon || CAT_ART[(q._cat && q._cat.id) || ''] || 'scroll';
  return `<div class="qart qart-wide print qart-ink" role="img" aria-label="Ilustração">${(QICON[key] || QICON.scroll)(104)}</div>`;
}

/* The frame is the era, never the picture: a cream mat with a sepia rule for
   the ancient and medieval world, the cream card of the printed schoolbook
   up to the Great War, and a clean modern mount after it. */
function qEra(q) {
  const m = /(^|\D)(\d{3,4})(\s*a\.?\s?C\.?)?(\D|$)/.exec(q.t || '');
  if (!m) return '';
  const y = m[3] ? -(+m[2]) : +m[2];
  return y < 1500 ? 'era-vintage' : y < 1914 ? 'era-retro' : 'era-modern';
}
function questionArt(q) {
  const html = questionArtRaw(q);
  const era = qEra(q);
  return era ? html.replace('class="qart', `class="qart ${era}`) : html;
}

/* A polity's brasão as a standalone picture: the share card draws it on a canvas. */
function crestURI(id) {
  return 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">${genericCrest(id)}</svg>`);
}

/*@@/art@@*/
/* ═══════════════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════════════ */
const topbar = (label, id) => `
  <div class="topbar">
    <button id="${id || 'bhome'}" class="btn btn-ghost btn-icon" aria-label="Voltar">${ICON.back('currentColor', 13)}</button>
    <span class="crumb">${label}</span>
  </div>`;

const runlogEl = () => `<div class="runlog" aria-hidden="true">${
  runLog.map(p => `<i class="${p === 3 ? 'rl-3' : p === 1 ? 'rl-1' : p === 0 ? 'rl-0' : ''}"></i>`).join('')}</div>`;

/* What the run actually earned you, as the objects themselves. A chip saying
   "3 figurinhas novas" is a receipt; the stickers are the reward, and the end
   of a run is the one moment the player wants to look at them. Capped at six
   so a long Milhão run does not turn the screen into a second album page. */
const newStickerStrip = () => {
  if (!runNewIds.length) return '';
  const got  = runNewIds.map(id => PL.find(p => p.id === id)).filter(Boolean);
  if (!got.length) return '';
  const show = got.slice(0, 6), rest = got.length - show.length;
  return `
    <div class="newfigs">
      <div class="eyebrow" style="color:var(--brass);">${
        got.length === 1 ? 'Nova figurinha' : `${got.length} figurinhas novas`}</div>
      <div class="newfigs-row">
        ${show.map((p, i) => `<span class="newfig" style="animation-delay:${i * 70}ms;">${
          figurinha(p, 'sm', { decorative: true, sub: '' })}</span>`).join('')}
        ${rest > 0 ? `<span class="newfig-more">+${rest}</span>` : ''}
      </div>
    </div>`;
};

const medalChips = () => (window._newMedals || []).length ? `
  <div style="display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:4px;">
    ${window._newMedals.map(m => `<span class="chip chip-brass" style="text-transform:none;letter-spacing:.02em;font-size:11px;">
      ${(ICON[m.ic] || ICON.medal)('currentColor', 12)} Nova figurinha: ${m.n}</span>`).join('')}
  </div>` : '';

/* ── Which printing a player belongs to ─────────────────────
   The album was collected over fifty years, so it has two kinds of page
   in it. A career that started before the Premier League is on the old
   stock; anything since is on the current one. */
/* 2000, not 1992: Ronaldo, Ronaldinho and Rivaldo belong to the old
   pages in every way that matters, and putting them on mint stock looked
   like a filing error. */
const MODERN_FROM = 1850;
const figEra = p => (p.era && p.era[0] < MODERN_FROM) ? 'retro' : 'modern';

/* The two shapes behind a modern figurinha take the player's own
   national colours, the way the real ones do. */
/*@@ctry-colors@@*/
const CTRY_COLORS = {
  BRA:['#FEDF00','#009B3A'], ARG:['#74ACDF','#F6B40E'], POR:['#DA291C','#046A38'],
  FRA:['#002395','#ED2939'], NED:['#AE1C28','#21468B'], GER:['#DD0000','#FFCE00'],
  ITA:['#008C45','#CD212A'], ENG:['#CE1124','#0A2C6B'], ESP:['#AA151B','#F1BF00'],
  URU:['#0038A8','#F6B40E'], BEL:['#FAE042','#ED2939'], CRO:['#FF0000','#171796'],
  COL:['#FCD116','#003893'], SWE:['#FECC00','#006AA7'], POL:['#DC143C','#EEEEEE'],
  EGY:['#CE1126','#111111'], CMR:['#007A5E','#FCD116'], NOR:['#BA0C2F','#00205B'],
  UKR:['#FFDD00','#0057B7'], HUN:['#CE2939','#477050'], CZE:['#D7141A','#11457E'],
  DEN:['#C8102E','#EEEEEE'], RUS:['#0039A6','#D52B1E'], MEX:['#006847','#CE1126'],
  CHI:['#D52B1E','#0039A6'], GHA:['#CE1126','#006B3F'], SCO:['#0065BD','#EEEEEE'],
  WAL:['#C8102E','#00AB39'], SEN:['#00853F','#FDEF42'], NGA:['#008751','#EEEEEE'],
  BUL:['#00966E','#D62612'], CIV:['#F77F00','#009E60'], LBR:['#BF0A30','#002868'],
  USA:['#B22234','#3C3B6E'], GRC:['#0D5EAF','#EEEEEE'], TUR:['#E30A17','#EEEEEE'], IRN:['#239F40','#DA0000'],
  IRQ:['#CE1126','#111111'], ISR:['#0038B8','#EEEEEE'], IND:['#FF9933','#138808'], CHN:['#DE2910','#FFDE00'],
  MNG:['#C4272F','#015197'], TUN:['#E70013','#EEEEEE'], AUT:['#ED2939','#EEEEEE'], CUB:['#002A8F','#CF142B'],
  VEN:['#FFCC00','#00247D'], HAI:['#00209F','#D21034'], ZAF:['#007749','#FFB81C'], MLI:['#14B53A','#FCD116'],
  MAR:['#C1272D','#006233'], UZB:['#0099B5','#1EB53A'], NPL:['#DC143C','#003893'], VNM:['#DA251D','#FFFF00'],
  CHE:['#DA291C','#EEEEEE'], SRB:['#C6363C','#0C4076'], MKD:['#D20000','#FFE600'], ETH:['#078930','#DA121D'],
  AGO:['#CC092F','#111111'], JPN:['#BC002D','#EEEEEE'], PER:['#D91023','#EEEEEE'], PAR:['#D52B1E','#0038A8'],
  IRL:['#169B62','#FF883E'], ROU:['#002B7F','#FCD116'], KOR:['#CD2E3A','#0047A0'], ALG:['#006233','#D21034'],
};
/*@@/ctry-colors@@*/
const ctryColors = c => CTRY_COLORS[c] || ['#7B1E3A', '#B8860B'];

/* A photo that fails to arrive (a flaky connection, or the first load after
   an update) is asked for once more before the card gives up on it; it used
   to go straight to a blank frame for the rest of the game. */
function imgRetry(img) {
  if (img.dataset.retry) { img.style.opacity = '.2'; return; }
  img.dataset.retry = '1';
  setTimeout(() => { img.src = img.src.split('?')[0] + '?r=1'; }, 700);
}

/* A band that has lost its country to the question ("which of these played
   for Norway?") said a bare "00" or "90", which read as a number. It says
   the decade in words instead: ANOS 90, ANOS 2000. */
const bandDec = yr => 'SÉC. ' + centTxt(yr).slice(7).toUpperCase();

/* One figurinha. `size` is lg (album page), sm (a tile on the board) or
   hero (the cover). */
function figurinha(p, size, opts) {
  opts = opts || {};
  /* hideEra also flattens the two printings into one. The retro/modern split
     is itself an era clue — one mint card among nine tea-coloured ones answers
     "who is the intruder" before a single name is read. */
  const era  = opts.hideEra ? 'retro' : figEra(p);
  const yr   = p.era ? p.era[0] : '';
  /* What the header band is allowed to say on this board. */
  const bandTxt = [
    opts.hideCtry ? '' : bandCtry(p.ctry),
    /* `noYear` drops the decade without touching the printing, which is what
       `hideEra` would also do. On an album spread already titled "Anos 70",
       every card repeating "70" is redundancy that costs the country's name
       its room — "ARGÉLIA 70" truncated to "ARGÉLIA…". A merged spread keeps
       the year, because there it is the thing that tells the cards apart. */
    (opts.hideEra || opts.noYear || !yr) ? ''
      : opts.hideCtry ? bandDec(yr) : '',
  ].filter(Boolean).join(' ');
  const sub  = opts.sub !== undefined ? opts.sub
             : `${POS_NAME[p.pos]} · ${p.era ? eraTxt(p.era) : ''}`;
  const alt  = opts.decorative ? 'alt="" aria-hidden="true"' : `alt="${p.n}"`;
  const nmCls = 'fig-nm' + (p.n.length > 13 ? ' fig-nm-long' : '');
  /* the printed copy, when this card is one: its stock, its variant, its
     serial — see A TIRAGEM */
  const c = opts.copy || null, sid = opts.sid || p.id;
  const cc = copyCls(sid, c);
  const fr = FIG_FRAME[p.img];
  const shot = `<div class="fig-shot"><img src="${p.img}" ${alt}${fr ? ` style="transform:scale(${fr[2]});transform-origin:${fr[0]}% ${fr[1]}%"` : ''}
      onerror="imgRetry(this)" />${c && c.v === 'erro'
        ? `<span class="fig-misreg" aria-hidden="true" style="background-image:url('${p.img}')"></span>` : ''}</div>`;
  const band = opts.band || bandTxt;

  if (era === 'retro') {
    /* the header band carries the country and the decade, the way the old
       albums carried the tournament — unless this board must not say so */
    return `<span class="fig fig-retro fig-${size}${cc}">
      <span class="fig-band${band ? '' : ' fig-band-mute'}">${band || ''}</span>
      <span class="fig-art">${shot}${artLayers(c, p.n)}</span>
      <span class="fig-cap"><span class="${nmCls}">${p.n}</span>
      ${sub ? `<span class="fig-sub">${sub}</span>` : ''}</span>
      ${foilLayers(sid, c)}
    </span>`;
  }

  const [c1, c2] = ctryColors(p.ctry);
  /* The new stock carries the country alone — it already shows the flag and
     the club underneath, and "BRASIL 2001" ran out of band whatever the font.
     (A board that must hide the era renders everyone on retro stock, so this
     branch is never the one asked to drop a decade.) */
  /* Country alone normally — "BRASIL 2001" ran out of band whatever the font.
     When the country is being hidden the decade takes its place, so a modern
     card does not sit blank-headed in a row of cards showing one. */
  const mBand = opts.band || (opts.hideCtry
    ? (opts.hideEra || !yr ? '' : bandDec(yr))
    : bandCtry(p.ctry));
  return `<span class="fig fig-modern fig-${size}${cc}">
    <span class="fig-band${mBand ? '' : ' fig-band-mute'}">${mBand}</span>
    <span class="fig-art"${opts.hideCtry ? '' : ` style="--c1:${c1};--c2:${c2};"`}>
      ${shot}
      ${(opts.noFlag || opts.hideCtry) ? '' : `<span class="fig-flag">${flagSVG(p.ctry, size === 'hero' ? 15 : size === 'lg' ? 9.5 : 7)}</span>`}
      ${artLayers(c, p.n)}
    </span>
    <span class="fig-cap"><span class="${nmCls}">${p.n}</span>
    ${sub ? `<span class="fig-sub">${sub}</span>` : ''}</span>
    ${foilLayers(sid, c)}
  </span>`;
}

/* ═══════════════════════════════════════════════════
   THE ALBUM AS A BOOK

   A Panini album is not a scroll. It is a section per country and a spread per
   era, and you turn the page. This builds that: for one country, the decades
   its players debuted in, oldest first, printed twenty to a page. Every page
   of every section is the same size: a decade that runs past the end of a
   page carries on over the next one under the same name, rather than the
   page growing or shrinking to fit it.
═══════════════════════════════════════════════════ */
const ALB_PER  = 20;        // pockets on every page of the album
const ALB_COLS = 4;         // four across, five down

/* The escudos, the seleções and the mascotes have no decade to be sorted by,
   so they are paged the same way, in the order they are printed. */
function extraPages(items, label) {
  const out = [];
  for (let i = 0; i < items.length; i += ALB_PER) {
    out.push({ label: items.length > ALB_PER
                 ? `${label} · ${out.length + 1}` : label,
               items: items.slice(i, i + ALB_PER) });
  }
  return out;
}

/* The reverse of an escudo, a seleção or a mascote. A player's back prints his
   career; these print what the sticker is and where it came from. */
function figExtraBack(sid, num) {
  const st = stk(sid);
  if (!st) return '';
/*@@extraback@@*/
  const lines = [];
  if (st.kind === 'escudo') {
    const cl = CL.find(c => c.id === st.id);
    if (cl) lines.push(`${REGION[cl.s]} · ${yearTxt(cl.f)} – ${cl.e ? yearTxt(cl.e) : 'hoje'}`);
    const men = PL.filter(x => (x.clubs || []).includes(st.id));
    if (men.length) lines.push(men.slice(0, 4).map(x => x.n).join(' · '));
  } else if (st.kind === 'selecao') {
    const men = PL.filter(x => x.ctry === st.id);
    lines.push(`${men.length} ${men.length === 1 ? 'figurinha' : 'figurinhas'} no álbum`);
    const nb = men.reduce((a, x) => a + (x.nb || 0), 0);
    if (nb) lines.push(`Prêmios Nobel: ${nb}`);
    lines.push(men.slice(0, 4).map(x => x.n).join(' · '));
  } else {
    const m = MASCOTS[st.id] || {};
    lines.push(`Monumento · ${m.city || ''}`);
    if (m.p) lines.push(`Ligado ${toClub(m.p)}`);
  }
/*@@/extraback@@*/
  const c = copyOf(sid);
  return `
    <span class="figback${c ? ' has-cert fin-' + c.f : ''}">
      ${backPaper(sid, c)}
      <span class="figback-h">
        <span class="figback-n">Nº ${String(num).padStart(3, '0')}</span>
      </span>
      <span class="figback-nm">${st.n}</span>
      <span class="figback-rule"></span>
      ${lines.filter(Boolean).map(l => `<span class="figback-l">${l}</span>`).join('')}
      ${certBack(sid, c)}
    </span>`;
}

/*@@album-pages@@*/
function albumPages(items) {
  if (!items.length) return [];
  const dec = g => g.p.era ? g.p.era[0] : 1800;
  const sorted = items.slice().sort((a, b) => dec(a) - dec(b) || a.n - b.n);
  const pages = [];
  for (let i = 0; i < sorted.length; i += ALB_PER) {
    const its = sorted.slice(i, i + ALB_PER);
    const ds = its.map(dec);
    /* the page is printed on the paper of the age most of it belongs to */
    const tally = {};
    ds.forEach(d => { const k = decStyle(d); tally[k] = (tally[k] || 0) + 1; });
    const main = ds[Math.floor(ds.length / 2)];
    pages.push({ from: ds[0], to: ds[ds.length - 1], main, items: its });
  }
  return pages;
}

/* What a spread is called: the age its cards were born in, then the span. */
const AGES = [[-Infinity, 476, 'Antiguidade'], [476, 1450, 'Idade Média'], [1450, 1789, 'Idade Moderna'],
              [1789, 1914, 'Século XIX'], [1914, Infinity, 'Século XX']];

    if (best >= 3 && !still) burst(30);
    done();
  };
  const close = to => {
    if (!z.isConnected) return;
    document.removeEventListener('keydown', onKey);
    z.classList.add('is-closing');
    setTimeout(() => z.remove(), still ? 0 : 260);
    if (meta.onClose) meta.onClose(to);
  };
  const onKey = e => {
    if (e.key === 'Escape') { e.preventDefault(); phase === 'done' ? close() : openAll(); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); phase === 'sealed' ? tear() : step(); }
  };
  document.addEventListener('keydown', onKey);
  z.querySelector('.pack-stage').addEventListener('click', e => {
    if (phase === 'reveal') step();
    else if (phase === 'done') {
      const it = e.target.closest && e.target.closest('.pk-sum-it');
      if (it) zoomCopy(it.querySelector('.figx'), it.dataset.sid);
    }
  });
  z.querySelector('.pack-all').addEventListener('click', openAll);
  z.querySelector('.pack-x').addEventListener('click', () => { if (phase !== 'done') openAll(); else close(); });
}

/* ── A picture of the card, to send ──
   Drawn on a canvas at 1080×1350, the shape a phone's gallery and every
   messenger shows whole: the card, its stock caught in the light, and the
   certificate under it. */
function loadImg(src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = src;
  });
}
const svgUrl = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  svg.includes('xmlns=') ? svg : svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"'));
function rrect(x, ctx, a, b, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(a + r, b); ctx.arcTo(a + w, b, a + w, b + h, r); ctx.arcTo(a + w, b + h, a, b + h, r);
  ctx.arcTo(a, b + h, a, b, r); ctx.arcTo(a, b, a + w, b, r); ctx.closePath();
}
async function shareFig(sid) {
  const c = anyCopy(sid);
  if (!c) return;
  /* a font only loads once something on screen uses it; the canvas has to

  try { await Promise.all(['92px "Mr Dafoe"', '700 30px "Archivo Narrow"', '600 24px Archivo', 'italic 600 34px Fraunces']
    .map(f => document.fonts.load(f))); await document.fonts.ready; } catch (e) {}
  const W = 1080, H = 1350;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  /* the room: a dark green velvet with a light over the card */
  let g = x.createRadialGradient(W / 2, 520, 60, W / 2, 620, 900);
  g.addColorStop(0, '#24503a'); g.addColorStop(.55, '#10261b'); g.addColorStop(1, '#070d09');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,255,255,.035)';
  for (let i = 0; i < 1400; i++) x.fillRect(Math.random() * W, Math.random() * H, 1.4, 1.4);

  const p = sid.startsWith('b:') ? bdayPlayer(sid) : (stk(sid) || {}).p;
  const st = stk(sid), set = sid.startsWith('t:') ? setById(sid.slice(2)) : null;
  const modern = p && !sid.startsWith('t:') && figEra(p) === 'modern';
  const card = modern ? '#8FA9B5' : '#EFE2C4', band = modern ? '#3F5F73' : '#B23A2E',
        ink = modern ? '#12232E' : '#2B2116';
  const cw = 480, ch = Math.round(cw * 50 / 29), cx = (W - cw) / 2, cy = 110;
  const bh = 58, caph = 150;
  /* shadow and body */
  x.save(); x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 60; x.shadowOffsetY = 26;
  rrect(0, x, cx, cy, cw, ch, 14); x.fillStyle = card; x.fill(); x.restore();
  x.save(); rrect(0, x, cx, cy, cw, ch, 14); x.clip();
  /* the band */
  const fin = c.f;
  const bandFill = () => {
    if (fin === 0) return band;
    const lg = x.createLinearGradient(cx, cy, cx + cw, cy + bh);
    const stops = fin === 1 ? ['#7d848b', '#e9edf0', '#9aa1a8', '#d7dce0']
                : fin === 2 ? ['#9fd8ff', '#e6a8ff', '#ffe28a', '#a8ffcf']
                : ['#8a6116', '#f7e08a', '#b88422', '#fff1c1'];
    stops.forEach((s, i) => lg.addColorStop(i / (stops.length - 1), s));
    return lg;
  };
  x.fillStyle = bandFill(); x.fillRect(cx, cy, cw, bh);
  x.fillStyle = fin === 0 ? '#F6EBD8' : '#1b1609';
  x.font = '700 26px "Archivo Narrow", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const bandText = sid.startsWith('b:') ? `PARABÉNS · ${BDAYS[p.id][1]} ${MES[BDAYS[p.id][0] - 1]}`.toUpperCase()
    : set ? set.t.toUpperCase() : p ? bandCtry(p.ctry) : st.kind === 'escudo' ? 'BRASÃO' : st.kind === 'selecao' ? 'NAÇÃO' : 'MONUMENTO';
  x.fillText(bandText.split('').join(' '), W / 2, cy + bh / 2 + 1);
  /* the picture */
  const px = cx + 34, py = cy + bh + 26, pw = cw - 68, ph = ch - bh - caph - 44;
  x.fillStyle = modern ? 'rgba(255,255,255,.18)' : '#E4D4AE'; x.fillRect(px, py, pw, ph);
  const drawCover = (im, fit) => {
    if (!im) return;
    const r = fit ? Math.min(pw / im.width, ph / im.height) * .78 : Math.max(pw / im.width, ph / im.height);
    const w = im.width * r, h = im.height * r;
    x.drawImage(im, px + (pw - w) / 2, fit ? py + (ph - h) / 2 : py, w, h);
  };
  x.save(); x.beginPath(); x.rect(px, py, pw, ph); x.clip();
  if (p) drawCover(await loadImg(p.img));
  else if (set) {
    const men = set.ids.map(id => PL.find(q => q.id === id)).filter(Boolean).slice(0, 12);
    const rows = [men.slice(0, Math.ceil(men.length / 2)), men.slice(Math.ceil(men.length / 2))];
    x.fillStyle = '#2f6b45'; x.fillRect(px, py, pw, ph);
    for (let ri = 0; ri < 2; ri++) {
      const row = rows[ri], s = Math.min(92, pw / Math.max(1, row.length) - 8);
      for (let k = 0; k < row.length; k++) {
        const im = await loadImg(row[k].img);
        const fx = px + (pw - row.length * (s + 8)) / 2 + k * (s + 8) + 4, fy = py + ph * (ri ? .52 : .16);
        x.save(); x.beginPath(); x.arc(fx + s / 2, fy + s / 2, s / 2, 0, 7); x.clip();
        if (im) { const r = s / Math.min(im.width, im.height); x.drawImage(im, fx, fy, im.width * r, im.height * r); }
        x.restore();
        x.strokeStyle = '#f3e7c4'; x.lineWidth = 3; x.beginPath(); x.arc(fx + s / 2, fy + s / 2, s / 2, 0, 7); x.stroke();
      }
    }
  } else if (st.kind === 'escudo') drawCover(await loadImg(crestURI(st.id)), true);
  else if (st.kind === 'selecao') drawCover(await loadImg(svgUrl(flagSVG(st.id, 300))), true);
  else {
    const br = CL.find(q => q.id === st.id), m = MASCOTS[st.id] || {};
    /* an SVG drawn into a canvas cannot fetch the photograph inside it, so
       a mascot with a photograph is drawn from the photograph itself */
    if (MSC_PAINTED.has(st.id)) drawCover(await loadImg(`img/msc-club/${st.id}.webp`));
    else if (MSC_PHOTO.has(m.art)) drawCover(await loadImg(`img/msc-pic/${m.art}.webp`));
    else drawCover(await loadImg(svgUrl((MASC_ART[m.art] || (() => '<svg/>'))(br && br.c1, br && br.c2, m.v))), true);
  }
  if (c.v === 'assin') {
    x.save(); x.translate(px + pw / 2, py + ph - 70); x.rotate(-.16);
    x.font = '92px "Mr Dafoe", cursive'; x.fillStyle = '#f4f6ff';
    x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 6; x.shadowOffsetY = 2;
    x.fillText(sigName((p || st).n), 0, 0); x.restore();
  }
  if (c.pr) {
    x.font = '700 22px "Archivo Narrow", sans-serif';
    const t = serialTxt(c), tw = x.measureText(t).width + 22;
    x.fillStyle = fin === 3 ? '#e9c768' : 'rgba(12,12,12,.62)';
    rrect(0, x, px + 12, py + ph - 44, tw, 32, 5); x.fill();
    x.fillStyle = fin === 3 ? '#2a1d05' : '#fff'; x.textAlign = 'left';
    x.fillText(t, px + 23, py + ph - 27);
  }
  x.restore();
  /* the caption */
  x.fillStyle = ink; x.textAlign = 'center';
  const name = (set ? set.n : (p || st).n).toUpperCase();
  let fs = 50; x.font = `700 ${fs}px "Archivo Narrow", sans-serif`;
  while (x.measureText(name).width > cw - 50 && fs > 26) { fs -= 2; x.font = `700 ${fs}px "Archivo Narrow", sans-serif`; }
  x.fillText(name, W / 2, cy + ch - caph / 2 - 16);
  x.font = '600 24px Archivo, sans-serif'; x.globalAlpha = .8;
  x.fillText(set ? 'Foto oficial' : p ? (p.clubs && p.clubs[0] ? clubName(p.clubs[0]) : POS_NAME[p.pos]) : st.sub, W / 2, cy + ch - caph / 2 + 30);
  x.globalAlpha = 1;
  /* the foil over all of it */
  if (fin > 0) {
    x.globalCompositeOperation = 'overlay';
    const lg = x.createLinearGradient(cx, cy, cx + cw, cy + ch);
    const rainbow = ['#ff8a8a', '#ffe57a', '#9dff8a', '#7ff5ff', '#8aa6ff', '#e08aff', '#ff8a8a'];
    const stops = fin === 1 ? ['rgba(255,255,255,0)', 'rgba(255,255,255,.55)', 'rgba(255,255,255,0)']
                : fin === 2 ? rainbow : ['#fff1b8', '#ffd36b', '#fff9e0', '#e0a93a', '#fff1b8'];
    stops.forEach((s, i) => lg.addColorStop(i / (stops.length - 1), s));
    x.globalAlpha = fin === 1 ? .7 : .45; x.fillStyle = lg; x.fillRect(cx, cy, cw, ch);
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    if (fin === 3) {
      for (let i = 0; i < 260; i++) {
        x.fillStyle = `rgba(255,255,240,${Math.random() * .8})`;
        const s = Math.random() * 2.6;
        x.beginPath(); x.arc(cx + Math.random() * cw, cy + Math.random() * ch, s, 0, 7); x.fill();
      }
    }
  }
  x.restore();
  if (fin > 0) {
    const lg = x.createLinearGradient(cx, cy, cx + cw, cy + ch);
    const stops = fin === 1 ? ['#8d949a', '#f4f6f8', '#9ea5ab', '#e8ecef'] : fin === 2

    stops.forEach((s, i) => lg.addColorStop(i / (stops.length - 1), s));
    x.strokeStyle = lg; x.lineWidth = fin === 3 ? 16 : 11;

  }

  x.fillStyle = fin === 3 ? '#f1d27c' : fin === 2 ? '#cfe6ff' : fin === 1 ? '#e3e7ea' : '#E9DFC6';
  x.font = '700 30px "Archivo Narrow", sans-serif';
  const line = [c.v ? VAR_NAME[c.v] : FIN_NAME[c.f], c.pr ? 'Nº ' + serialTxt(c) : '', 'Estado ' + gradeTxt(c.g)].filter(Boolean).join('  ·  ').toUpperCase();
  x.fillText(line.split('').join(' '), W / 2, cy + ch + 70);
  x.fillStyle = 'rgba(233,223,198,.72)'; x.font = '600 25px Archivo, sans-serif';
  x.fillText(`${copyCode(c)}  ·  ${c.o ? 'Série fundadora' : c.p1 ? '1ª edição' : 'Temporada'} ${c.ed}`, W / 2, cy + ch + 112);
  x.font = 'italic 600 34px Fraunces, serif'; x.fillStyle = '#E9DFC6';
  x.fillText('History Quiz', W / 2, H - 58);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  if (!blob) return;
  const nm = (set ? set.n : (p || st).n);
  const file = new File([blob], `figurinha-${sid.replace(/[^a-z0-9]+/gi, '-')}.png`, { type: 'image/png' });
  const text = `Minha figurinha ${FIN_NAME[c.f].toLowerCase()}${c.pr ? ' Nº ' + serialTxt(c) : ''}: ${nm} · History Quiz`;
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ═══════════════════════════════════════════════════
   A VITRINE — the cabinet

   The album keeps every sticker in its pocket; the vitrine is where the good
   ones are shown. Six on the shelf, chosen by the player; the team sets and
   how far along each is; the birthday editions; and every copy that is
   better than common paper, best first.
═══════════════════════════════════════════════════ */
function vitrineHtml() {
  const v = V();

  const Wd = Math.min(window.innerWidth, 480) - 36;
  const pwS = Math.floor((Wd - 28 - 2 * 12) / 3);

  const fav = v.fav.filter(sid => anyCopy(sid) && (album.has(sid) || sid.includes(':') && !stk(sid))).slice(0, 6);
  const rares = all.filter(sid => v.c[sid].f > 0 || v.c[sid].v).sort((a, b) => copyRank(v.c[b]) - copyRank(v.c[a]));
  const lims = Object.keys(v.lim).map(k => 'b:' + k);
  const today = todaysBdays().filter(id => !v.lim[`${id}:${new Date().getFullYear()}`]);
  const next = nextBdays(3);
  const card = (sid, pw) => `<button class="vit-card" data-sid="${sid}" type="button"
      aria-label="${(stk(sid) || bdayPlayer(sid) || setById(sid.slice(2)) || {}).n || ''}${copyAria(anyCopy(sid))}">${
      figx(figAny(sid, anyCopy(sid), 'lg'), pw)}</button>`;
  const chip = (k, n, t) => `<span class="vit-chip"><i class="vit-sw vit-f${k}"></i><b>${n}</b>${t}</span>`;
  return `
  <div class="pg vit-pg scroll-y" style="gap:12px;">
    ${topbar('Vitrine')}

      <h1 class="display vit-title">A <em class="brass">vitrine</em></h1>
      <p class="vit-dek">${all.length} ${all.length === 1 ? 'figurinha colada' : 'figurinhas coladas'}, cada uma uma cópia única — e ${rares.length} ${rares.length === 1 ? 'rara' : 'raras'}.</p>
    </div>
    <div class="vit-chips">
      ${chip(0, cnt[0], 'Comuns')}${chip(1, cnt[1], 'Prata')}${chip(2, cnt[2], 'Holo')}${chip(3, cnt[3], 'Ouro')}
    </div>
    <div class="vit-meta">${signed} ${signed === 1 ? 'autografada' : 'autografadas'} · ${errs} ${errs === 1 ? 'erro' : 'erros'} de impressão · ${dups} ${dups === 1 ? 'repetida' : 'repetidas'}</div>

function wireVitrine() {
  const pg = document.querySelector('.vit-pg');
  if (!pg) return;
  const openIt = el => {
    const b = el.closest && (el.closest('.vit-card') || el.closest('.vit-set.is-done'));
    if (!b) return;
    const sid = b.dataset.sid;
    const src = b.classList.contains('vit-card') ? b.querySelector('.figx') : null;
    if (src) zoomCopy(src, sid);
    else {
      /* a set row has no card on it: the photograph rises from the row */
      const tmp = document.createElement('div');
      tmp.innerHTML = figx(figAny(sid, anyCopy(sid), 'lg'), 96);
      const fx = tmp.firstElementChild;
      fx.style.cssText += ';position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;';
      document.body.appendChild(fx);
      zoomCopy(fx, sid);
      setTimeout(() => fx.remove(), 50);
    }
  };
  pg.addEventListener('click', e => openIt(e.target));
  pg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openIt(e.target); } });
}
