/* Every card the timeline can deal: a dated event, a figure's birth, a polity's
   rise — all from tables the app already tests. */
function tlEvents() {
  const ev = [];
  TL_DATES.forEach(([id, y, label, sub, pic]) => {
    const e = { id: 'd' + id, y, label, sub };
    if (pic.face && PL.find(p => p.id === pic.face)) e.face = pic.face;
    else if (pic.crest && CL.find(c => c.id === pic.crest)) e.crest = pic.crest;
    else if (pic.flag && FLAGS[pic.flag]) e.flag = pic.flag;
    else return;
    ev.push(e);
  });
  /* the birth of a figure — only where the year is not in dispute */
  PL.filter(p => p.era[0] >= 1300 && p.id !== 'tamerlao').forEach(p =>
    ev.push({ id: 'b' + p.id, y: p.era[0], label: p.n, sub: 'Nascimento', face: p.id }));
  PL.filter(p => p.era[1] >= 1300).forEach(p =>
    ev.push({ id: 'm' + p.id, y: p.era[1], label: p.n, sub: 'Morte', face: p.id }));
  /* and the rise of a state */
  CL.filter(c => c.f > -3000 && c.f !== 0).forEach(c =>
    ev.push({ id: 'f' + c.id, y: c.f, label: `Surgimento ${ofClub(c.id)}`, sub: REGION[c.s], crest: c.id }));
  return ev;
}
function buildTimeline(n) {
  const all = tlEvents(), used = new Set(), qs = [];
  for (let guard = 0; qs.length < n && guard < 400; guard++) {
    const four = pickN(all.filter(e => !used.has(e.id)), 4);
    if (four.length < 4) break;
    /* the same person twice on one board gives the order away */
    const who = four.map(e => e.face).filter(Boolean);
    if (new Set(who).size !== who.length) continue;
    const ys = four.map(e => e.y).sort((a, b) => a - b);
    if (ys.some((y, i) => i && y - ys[i - 1] < Math.max(6, Math.abs(y) * 0.03))) continue;   // too close to be fair
    four.forEach(e => used.add(e.id));
    qs.push({ t: 'Coloque em ordem, do mais antigo para o mais recente', type: 'order',
              order: shuf(four), a: four.slice().sort((a, b) => a.y - b.y).map(e => e.id), _cat: GC_TL });
  }
  return { id:'tl', name:'Linha do tempo', emoji:'⏳', tag:'Do mais antigo ao mais novo',
           col:'#0F7B6C', diff:'Variado', qs };
}

/*@@/specials@@*/
/* ── Where these two are actually played ──────────────────────
   Neither is a mode of its own any more. They were two more buttons on a
   cover that already had a queue of them, and a player who came for the
   ladder never saw either one. They are dealt inside the ladder instead,
   four rungs out of sixteen, which is the only place they were ever worth
   playing: the climb gets the variety and they get the stakes.

   None of them lands on a checkpoint — the rung you bank on should be the
   plain kind — and the two hardest sit high, where a timeline is genuinely
   worth R$ 600.000. */
const SPECIAL_RUNGS = { 5: 'who', 9: 'tl', 12: 'who', 14: 'tl' };

/* What each card says on its face. The colours are not here: they belong to
   .spcard-who / .spcard-tl, which is the only way they can change with the
   theme the way everything else on screen does. */
const SPECIAL = {
  who: { n: 'Quem sou eu?',   tag: 'Quatro pistas, uma de cada vez', ic: ICON.target },
  tl:  { n: 'Linha do tempo', tag: 'Do mais antigo ao mais novo',    ic: ICON.clock },
};

/* Seconds a clue costs the clock — the whole price of the card. */
const CLUE_COST = 5;

/* Deals the cartas especiais into a ladder that is already built, replacing
   the written question on those rungs. A face that is already the answer to
   another question in the run is passed over: the same man twice in sixteen
   would give the second one away. */
function dealSpecials(qs) {
  const spare = { who: buildWho(4).qs, tl: buildTimeline(4).qs };
  const answered = new Set();
  qs.forEach(q => (q.a || []).forEach(a => answered.add(a)));
  Object.keys(SPECIAL_RUNGS).forEach(k => {
    const i = +k;
    if (i >= qs.length) return;
    const kind = SPECIAL_RUNGS[k];
    let card = null;
    while (spare[kind].length) {
      const c = spare[kind].pop();
      if ((c.a || []).some(a => answered.has(a))) continue;
      card = c; break;
    }
    if (!card) return;                       // no clean card left: leave the question
    (card.a || []).forEach(a => answered.add(a));
    qs[i] = Object.assign({}, card, { _special: kind });
  });
  return qs;
}

/*@@noscore@@*/
/* (the scoreboard and the lineup were football's; history asks in its own ways: */
/*@@formats@@*/
/* ═══════════════════════════════════════════════════
   HISTORY'S OWN WAYS TO ASK

   Futebol Quiz had two pictures that were the question itself: a scoreboard
   with one side hidden and a team-sheet with one name missing. History has
   its own, and each is the picture on its card, in place of the vignette:

     · a citação  — a sentence written out on a sheet; name who said it
     · a batalha  — two banners and the crossed swords, one side hidden
     · a linhagem — a dynasty, a succession or a council, one link missing
     · a manchete — the front page of the day it happened
     · o duelo    — only two cards on the board: which came first?
     · fato ou mito — something everybody repeats, stamped true or false

   Every one of them arrives with its own little moment (the ink writing the
   sentence, the swords crossing, the paper spinning in, the stamp coming
   down) and plays it once, when the question is dealt — never on a repaint.
═══════════════════════════════════════════════════ */

/* the strip a question carries, if any: it is the question's picture */
const hasStrip = q => !!(q && (q.quote || q.battle || q.line || q.news));
function qStrip(q) {
  if (!q) return '';
  if (q.quote)  return quoteStrip(q.quote, q);
  if (q.battle) return battleStrip(q.battle, q);
  if (q.line)   return lineStrip(q.line, q);
  if (q.news)   return newsStrip(q.news, q);
  return '';
}

/* Words a strip prints under its picture must not name the answer while the
   question is open: they are masked until the reveal. */
function maskAnswer(text, q) {
  let x = String(text || '');
  if (!x || !q || sc === 'reveal') return x;
  (q.a || []).forEach(a => {
    const nm = q.type === 'player' ? (PL.find(p => p.id === a) || {}).n : q.type === 'txt' ? a : clubName(a);
    if (!nm) return;
    const parts = [nm].concat(String(nm).split(/\s+/).filter(w => w.length >= 5));
    parts.forEach(w => { x = x.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '???'); });
  });
  return x;
}

/* What fills the hidden '?' once the answer is shown: the answer's own id
   (a state, a figure) or its words. */
function revealedSlot(q) {
  if (!q || sc !== 'reveal' || !(q.a || []).length) return null;
  const a = q.a[0];
  if (q.type === 'player') { const p = PL.find(x => x.id === a); return p ? p.n : a; }
  return a;   // a polity id (stripMark draws its brasão) or the text answer
}

/* One side of a battle, one link of a line: a state's brasão, a country's
   flag, a figure's face — or a drawn shield with its initials. */
function stripMark(name) {
  if (!name || name === '?') return `<span class="hs-mark hs-q">?</span>`;
  const c = CL.find(x => x.id === name);
  if (c) return `<span class="hs-mark hs-crest">${clubArt(c.id, '', false)}</span>`;
  if (FLAGS[name] && CTRY_NAME[name]) return `<span class="hs-mark hs-flag"><svg viewBox="0 0 9 6" preserveAspectRatio="none" aria-hidden="true">${FLAGS[name]}</svg></span>`;
  const r = optResolve(name);
  if (r && r.k === 'club') return `<span class="hs-mark hs-crest">${clubArt(r.id, '', false)}</span>`;
  if (r && r.k === 'ctry') return `<span class="hs-mark hs-flag"><svg viewBox="0 0 9 6" preserveAspectRatio="none" aria-hidden="true">${FLAGS[r.iso[0]] || ''}</svg></span>`;
  if (r && r.k === 'face') return `<span class="hs-mark hs-face"><img src="${r.img}" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'" /></span>`;
  return `<span class="hs-mark hs-ink">${shieldGlyph(name)}</span>`;
}
const stripName = n => {
  if (!n || n === '?') return '???';
  const c = CL.find(x => x.id === n);
  if (c) return c.n;
  if (CTRY_NAME[n]) return CTRY_NAME[n];
  return n;
};

/* ── a citação ── the sentence is inked in word by word */
const QUILL = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M33 4C22 7 13 17 9.4 31l2 1C16 20 24 12 33 4Z" fill="#F4ECD8" stroke="#2A1D10" stroke-width=".9" stroke-linejoin="round"/>
  <path d="M33 4c-4 7-9 11-15 13M30 8c-3 4-7 7-11 8.6M26 12c-2 3-5 5-8 6" fill="none" stroke="#2A1D10" stroke-width=".6" opacity=".6"/>
  <path d="M9.4 31 7 37" stroke="#2A1D10" stroke-width="1.4" stroke-linecap="round"/><circle cx="6.6" cy="37.6" r="1.1" fill="#2A1D10"/></svg>`;
function quoteStrip(st, q) {
  const words = String(st.q || '').split(/\s+/);
  const ink = words.map((w, i) => `<i style="animation-delay:${(i * 0.055 + 0.15).toFixed(3)}s">${w}</i>`).join(' ');
  const ctx = maskAnswer(st.ctx || '', q);
  /* at the reveal the sheet is signed */
  const sign = revealedSlot(q);
  return `<div class="qstrip hs-quote" role="img" aria-label="Citação: ${String(st.q || '').replace(/"/g, '&quot;')}">
    <span class="hs-quill">${QUILL}</span>
    <blockquote class="hs-q-text">${ink}</blockquote>
    ${ctx ? `<span class="hs-ctx">— ${ctx}</span>` : ''}
    ${sign ? `<span class="hs-sign">${sign}</span>` : ''}</div>`;
}

/* ── a batalha ── two banners, crossed swords, one side hidden */
const SWORDS = `<svg viewBox="0 0 60 44" aria-hidden="true">
  <g class="hs-sw hs-sw-l"><path d="M10 40 44 6l3 2.4L13 42Z" fill="#E4E6EA" stroke="#1A1410" stroke-width="1"/><path d="M8 33l9 9M6.6 38.6l3 3" stroke="#C9A04E" stroke-width="3.2" stroke-linecap="round"/></g>
  <g class="hs-sw hs-sw-r"><path d="M50 40 16 6l-3 2.4L47 42Z" fill="#D4D7DC" stroke="#1A1410" stroke-width="1"/><path d="M52 33l-9 9M53.4 38.6l-3 3" stroke="#C9A04E" stroke-width="3.2" stroke-linecap="round"/></g>
  <circle class="hs-spark" cx="30" cy="22" r="5" fill="#FFE9A8"/></svg>`;
function battleStrip(st, q) {
  const x = maskAnswer(st.x || '', q);
  const shown = revealedSlot(q);
  const side = n => n === '?' && shown
    ? `<span class="hs-side hs-side-shown">${stripMark(shown)}<b>${stripName(shown)}</b></span>`
    : `<span class="hs-side${n === '?' ? ' hs-side-q' : ''}">${stripMark(n)}<b>${stripName(n)}</b></span>`;
  return `<div class="qstrip hs-battle" role="img" aria-label="Batalha">
    <span class="hs-lbl">${st.lbl || ''}</span>
    <div class="hs-row">${side(st.a)}<span class="hs-swords">${SWORDS}</span>${side(st.b)}</div>
    ${x ? `<span class="hs-x">${x}</span>` : ''}</div>`;
}

/* ── a linhagem ── a succession reads left to right with arrows; a council
   or an alliance ("grupo") is joined by plus signs */
function lineStrip(st, q) {
  const grp = st.kind === 'grupo';
  const shown = revealedSlot(q);
  const rows = (st.rows || []).map(n => n === '?' && shown ? '\u0001' + shown : n);
  const cells = rows.map((n, i) => `${i ? `<span class="hs-join" style="animation-delay:${(i * .14).toFixed(2)}s">${grp ? '+' : '→'}</span>` : ''}
    <span class="hs-link${n === '?' ? ' hs-link-q' : ''}${n[0] === '\u0001' ? ' hs-link-shown' : ''}" style="animation-delay:${(i * .14 + .05).toFixed(2)}s">
      ${n === '?' ? '<span class="hs-mark hs-q">?</span>' : (n = n.replace('\u0001', ''), (() => { const r = optResolve(n); return r && r.k === 'face' ? `<span class="hs-mark hs-face"><img src="${r.img}" alt="" aria-hidden="true" onerror="this.style.visibility='hidden'" /></span>` : `<span class="hs-mark hs-ink">${bustGlyph(n, st.era || 'med')}</span>`; })())}
      <b>${n === '?' ? '???' : n}</b>${st.sub && st.sub[i] ? `<em>${st.sub[i]}</em>` : ''}</span>`).join('');
  return `<div class="qstrip hs-line${grp ? ' hs-line-grp' : ''}" role="img" aria-label="${grp ? 'Grupo' : 'Linhagem'}">
    <span class="hs-lbl">${st.t || ''}</span><div class="hs-chain">${cells}</div></div>`;
}

/* ── a manchete ── the front page of the day, spinning in like a newsreel */
function newsStrip(st, q) {
  const sub = maskAnswer(st.sub || '', q);
  return `<div class="qstrip hs-news" role="img" aria-label="Manchete de jornal">
    <div class="hs-mast"><span>${st.paper || 'A Gazeta'}</span></div>
    <div class="hs-dateline"><span>${st.city || ''}</span><span>${st.date ? maskAnswer(st.date, q) : 'Edição extra'}</span><span>${st.price || ''}</span></div>
    <p class="hs-head">${maskAnswer(st.h || '', q)}</p>
    ${sub ? `<p class="hs-sub">${sub}</p>` : ''}
    <div class="hs-cols" aria-hidden="true"><i></i><i></i><i></i></div></div>`;
}

/* ── fato ou mito ── the two slips are rubber stamps */
function stampSVG(kind) {
  const fato = kind === 'fato';
  const ink = fato ? '#2F6B45' : '#9B2226';
  return `<svg viewBox="0 0 64 40" aria-hidden="true"><g transform="rotate(${fato ? -6 : 5} 32 20)">
    <rect x="3" y="5" width="58" height="30" rx="5" fill="none" stroke="${ink}" stroke-width="2.6"/>
    <rect x="6.6" y="8.6" width="50.8" height="22.8" rx="3" fill="none" stroke="${ink}" stroke-width="1"/>
    <text x="32" y="26.4" text-anchor="middle" font-family="Archivo, system-ui" font-weight="800" font-size="15" letter-spacing="2" fill="${ink}">${fato ? 'FATO' : 'MITO'}</text></g></svg>`;
}

/* ── the moment each format arrives with ── */
function stripFx(q) {
  if (!q || sc !== 'quiz') return;
  if (q.quote) snd.quill();
  else if (q.battle) snd.clang();
  else if (q.news) snd.extra();
  else if (q.line) snd.chain();
  else if (q.duel || q.myth) snd.duel();
}
/* the stamp coming down on the right slip, at the reveal */
function revealFx(q) {
  if (q && q.myth) setTimeout(() => snd.stamp(), 120);
}

/* ── their sounds ── */
Object.assign(snd, {
  /* a nib on laid paper: three quick scratches */
  quill() { [0, .16, .34].forEach((d, i) => { crackle(.12, { grains: 10, vol: .02, delay: d });
            noise(.09, { type: 'bandpass', freq: 3200 + i * 300, q: 2.2, vol: .02, attack: .01, delay: d }); }); },
  /* two blades meeting: a bright ring with inharmonic partials, twice */
  clang() { [0, .5].forEach((d, k) => { const v = k ? .03 : .045;
            [1840, 2710, 3950, 5230].forEach((f, i) => tone(f * (k ? 1.04 : 1), .55 - i * .08, { type: 'sine', vol: v / (i + 1), delay: d + .02 }));
            noise(.04, { type: 'highpass', freq: 3000, q: .7, vol: v * 1.4, attack: .001, delay: d }); }); },
  /* the newsreel: a sheet whipping round and the presses' rattle */
  extra() { noise(.7, { type: 'bandpass', freq: 500, to: 2600, q: .6, vol: .05, attack: .15 });
            crackle(.4, { grains: 22, vol: .016, delay: .35 });
            [0, 1, 2, 3, 4, 5].forEach(i => noise(.02, { type: 'lowpass', freq: 1200, q: 1, vol: .03, attack: .001, delay: .78 + i * .07 })); },
  /* a chain being laid out, link by link */
  chain() { [0, 1, 2, 3, 4].forEach(i => { tone(1500 + i * 120, .06, { type: 'sine', vol: .022, delay: .05 + i * .14 });
            noise(.015, { freq: 4200, q: 3, vol: .02, attack: .001, delay: .05 + i * .14 }); }); },
  /* the two corners of the ring: a drum and a low horn */
  duel() { tone(98, .5, { type: 'sine', vol: .11, to: 62 }); noise(.12, { type: 'lowpass', freq: 300, q: .8, vol: .06 });
           tone(146.83, .7, { type: 'sawtooth', vol: .012, delay: .18 }); tone(220, .6, { type: 'triangle', vol: .02, delay: .2 }); },
  /* the rubber stamp coming down on the desk */
  stamp() { tone(92, .22, { type: 'sine', vol: .14, to: 48 }); noise(.08, { type: 'lowpass', freq: 600, q: .8, vol: .09, attack: .002 });
            crackle(.08, { grains: 6, vol: .015, delay: .03 }); },
});

/*@@/formats@@*/
/*@@/noscore@@*/
/* ═══════════════════════════════════════════════════
   O BARALHO DA RODADA

   A run is a seed: the same seed deals the same questions, in the same
   order, with the same tiles. The diário uses it, with the date as its seed,
   which is what makes it the same round for everybody who plays it that day.
═══════════════════════════════════════════════════ */
let runSeed = null;

/* Re-seeded per question: a lifeline draws random numbers, and without this
   two deals of the same seed would drift apart the moment one was used. */
function dealDisp(i) {
  if (runSeed !== null) seedFrom(runSeed + i * 7919);
  return getDisp(cat.qs[i]);
}

/* ── The "resposta final?" beat ────────────────────────────────
   Confirming does not reveal straight away. The clock stops, the board
   dims to the tiles you picked, and the answer hangs there for a moment
   that gets longer the more money is on the line. From R$ 75.000 up the
   host asks out loud first, and you can still take it back. */
const ASK_FROM_RUNG = 9;

function confirmAnswer() {
  if (sel.size === 0 || sc !== 'quiz') return;
  if (isMil && rung >= ASK_FROM_RUNG) {
    clearInterval(tmr);
    sc = 'ask';
    snd.lock();
    go();
    return;
  }
  lockIn();
}

function unlockAnswer() {          // "deixa eu pensar" — back to the board
  if (sc !== 'ask') return;
  sc = 'quiz';
  snd.swipe();
  startTmr();
  go();
}

function lockIn() {
  clearInterval(tmr);
  sc = 'lock';
  snd.lock();
  go();

  const hold = isMil ? Math.min(2600, 900 + rung * 120) : 700;
  let beats = 0;
  const pulse = setInterval(() => {
    if (++beats > 6 || sc !== 'lock') { clearInterval(pulse); return; }
    snd.heartbeat();
  }, Math.max(260, hold / 5));

  setTimeout(() => { clearInterval(pulse); if (sc === 'lock') doReveal(); }, hold);
}

/* The story behind an answer. A written question carries its own (`x`, checked
   against the same article as the question). The two table categories tell
   theirs from the tables themselves: which title in a run this was, and who
   won either side of it — facts the app already holds and tests. */
const ORD = n => n + 'º';
const joinPT = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
/*@@story@@*/
function storyFor(q) {
  if (!q) return '';
  return q.x || '';
}
/*@@/story@@*/
/* After the reveal, the run waits for you: long enough to read what came
   with the answer, never so long that it drags. "Próxima" moves on at once,
   and touching the story holds it on screen for as long as you like. */
let _adv = null, _advT = null;
function scheduleAdvance(p, ms) {
  clearTimeout(_advT);
  _adv = { p, left: ms, t0: performance.now(), held: false };
  _advT = setTimeout(fireAdvance, ms);
}
function fireAdvance() {
  if (!_adv) return;
  const p = _adv.p;
  _adv = null; clearTimeout(_advT);
  if (sc !== 'reveal') return;
  advanceAfterReveal(p); go();
}
function holdAdvance() {
  if (!_adv) return;
  const rv = document.getElementById('rvl');
  if (_adv.held) {
    _adv.held = false; _adv.t0 = performance.now();
    _advT = setTimeout(fireAdvance, Math.max(600, _adv.left));
  } else {
    _adv.held = true; clearTimeout(_advT);
    _adv.left -= performance.now() - _adv.t0;
  }
  if (rv) rv.classList.toggle('is-held', _adv.held);
}

function doReveal() {
  clearInterval(tmr);
  sc = 'reveal';

  const q     = cat.qs[qi];
  const rs    = new Set(q.a);
  const sa    = [...sel];
  const wrong = sa.filter(id => !rs.has(id)).length;
  const right = sa.filter(id =>  rs.has(id)).length;
  let p       = wrong === 0 && right === rs.size ? 3
              : wrong === 0 && right > 0          ? 1
              :                                     0;

  prevPts = pts;
  const prevStreak = streak;
  if (p === 3) streak++; else streak = 0;
  bestStreak = Math.max(bestStreak, streak);

  /* Getting it right sticks the figurinha in the album for good. */
  const earnedNow = p === 3 ? earned(q) : [];
  const gotNew = collect(earnedNow);
  runNew += gotNew.length;
  runNewIds.push(...gotNew);
  /* and each of them comes out of the packet as a printed copy */
  if (earnedNow.length) try { runPulls.push(...pullCopies(earnedNow, gotNew, pullBoost())); } catch (e) {}

  /* An ordering answer is scored by how many cards sit in the right place. */
  if (q.order) {
    const given = [...sel], hits = given.filter((id, i) => q.a[i] === id).length;
    /* and the cards fall into the true order, so the row reads as a timeline;
       each one still carries the number the player gave it */
    disp = q.order.slice().sort((a, b) => a.y - b.y);
    p = hits === q.a.length ? 3 : hits >= 2 ? 1 : 0;
    streak = p === 3 ? prevStreak + 1 : 0;
    bestStreak = Math.max(bestStreak, streak);
  }

  const { gained, mult, speed } = scoreAnswer(p);
  /* every extra clue taken costs two points, so the first guess is worth most */
  const gain = q.clues && p === 3 ? Math.max(1, gained - ((q._shown || 1) - 1) * 2) : gained;
  pts += gain;
  lastGain = gain;
  if (p === 3) nCorrect++; else if (p === 1) nPartial++;
  runLog.push(p);

  if (isMil) {
    if      (p === 3 && isFinal()) snd.fanfare();
    else if (p === 3)              snd.rung(rung);
    else                           snd.drop();
    /* Settle the money now, while we know the answer. The pause that
       follows is only there for the drama — nothing about the outcome
       should depend on a timer firing. */
    if (p !== 3)          banked = safetyNet();
    else if (isFinal())   { banked = LADDER[LADDER.length - 1].v; cashed = true; }
  } else if (p === 3) snd.correct(streak - 1);
  else if (p === 1)   snd.almost();
  else                snd.wrong();
  try { revealFx(q); } catch (e) {}

  const chip = (ic, txt) => `<span class="bonus">${ic}${txt}</span>`;
  const bonuses = (speed ? chip(ICON.bolt('var(--pitch)', 10), 'rápido +' + speed) : '')
                + (mult > 1 ? chip(ICON.flame('var(--brass)', 10), 'combo ×' + mult) : '')
                + (DCFG().pmul > 1 ? chip((ICON[DCFG().ic] || ICON.star)(DCFG().col, 10), '×' + DCFG().pmul) : '');

  const rightNames = q.order
    ? q.a.map(id => { const e = q.order.find(x => x.id === id); return e ? `${e.label} (${e.y})` : id; }).join(' · ')
    : q.a.map(id => {
    const pool = q.type === 'player' ? PL : CL;
    const hit = pool.find(x => x.id === id);
    return hit ? hit.n : id;
  }).join(', ');

  /* Turn the answer over: one card when there is a single answer, and
     nothing at all on multi-answer questions, where five cards would
     bury the board. */
  const isPl  = q.type === 'player';
  const backs = q.a.length === 1
    ? (() => { const it = (isPl ? PL : CL).find(x => x.id === q.a[0]);
               return it ? stickerBack(it, isPl, gotNew.includes(it.id)) : ''; })()
    : '';

  if (isMil) {
    /* On the ladder there is no half credit: you either climb or you fall. */
    lastMsg = p === 3
      ? `<span class="display good" style="font-size:18px;">${ICON.check('currentColor', 14)} ${
          isFinal() ? 'É o milhão!' : 'Colada! ' + money(RUNG().v)}</span>`
        + (isFinal() ? '' : `<div class="small muted" style="margin-top:3px;">Próximo degrau: ${money(LADDER[rung + 1].v)}</div>`) + backs
      : `<span class="display bad" style="font-size:18px;">${ICON.cross('currentColor', 14)} Essa não era…</span>
         <div class="small muted" style="margin-top:3px;">Era <b class="good">${rightNames}</b>
          · você leva ${money(safetyNet())}</div>` + backs;
  } else {
    lastMsg = (p === 3
      ? `<span class="display good" style="font-size:17px;">${ICON.check('currentColor', 13)} ${
          q.order ? 'Na ordem certa!' : 'Colada!'} +${gain}</span>${bonuses}`
      : p === 1
      ? `<span class="display brass" style="font-size:17px;">Quase! +${gain}</span>${bonuses}`
      : `<span class="display bad" style="font-size:17px;">${ICON.cross('currentColor', 13)} Errou!</span>
         <div class="small muted" style="margin-top:3px;">Resposta: <b class="good">${rightNames}</b></div>`) + backs;
  }

  const story = storyFor(q);
  const wait  = story ? Math.min(9500, Math.max(5200, 2400 + story.length * 40)) : (isMil ? 2600 : 2200);
  if (story) lastMsg += `<div class="story" role="button" tabindex="0" aria-label="Segurar a explicação na tela">
      <span class="story-k">${ICON.book('currentColor', 11)} Você sabia?</span><p>${story}</p></div>`;
  const last = isMil ? (p !== 3 || isFinal()) : (isSurv ? p !== 3 : qi >= cat.qs.length - 1);
  lastMsg += `<div class="next-row"><button id="bnext" class="btn btn-ghost btn-sm btn-next" style="--wait:${wait}ms">
      ${last ? 'Ver resultado' : 'Próxima'} ${ICON.back('currentColor', 11).replace('<svg', '<svg style="transform:scaleX(-1)"')}
      <i class="next-fill"></i></button></div>`;

  go();
  fxReveal(p, gain, streak, isMil && p === 3 && isFinal());
  scheduleAdvance(p, wait);
}

/* What happens once the reveal has been on screen long enough: either the
   run moves to the next question or it ends. Split out of doReveal so the
   state machine can be driven without waiting on a timer. */
function advanceAfterReveal(p) {
  if (isMil) {
    if (p !== 3) {                  // fell back to the last checkpoint
      cat.qs = cat.qs.slice(0, qi + 1);
      finishRun();
      return;
    }
    /* `rung` counts rungs *cleared*, so it advances past the last one too —
       that is what makes the end screen read 16/16 rather than 15/16. */
    rung++;
    if (rung >= LADDER.length) {    // took the million
      cat.qs = cat.qs.slice(0, qi + 1);
      finishRun();
      return;
    }
    qi++;
    sel.clear(); clearHelpers(); lastMsg = '';
    disp = dealDisp(qi);
    tMax = qTime(); tLeft = tMax;
    /* A carta especial is announced before it is played, and the clock waits
       for the player to turn it over. */
    if (cat.qs[qi] && cat.qs[qi]._special) { sc = 'card'; snd.card(); return; }
    sc = 'quiz';
    startTmr();
    return;
  }

  if (isSurv && p !== 3) {          // survival: anything short of perfect ends it
    cat.qs = cat.qs.slice(0, qi + 1);
    finishRun();
    return;
  }
  qi++;
  sel.clear();
  clearHelpers();
  lastMsg = '';
  if (isSurv && qi >= cat.qs.length - 2) {
    const more = buildGame(rnd() > .5 ? 'moderado' : 'dificil');
    cat.qs = cat.qs.concat(more.qs);
  }
  if (qi >= cat.qs.length) {
    finishRun();
  } else {
    sc    = 'quiz';
    tMax  = qTime();
    tLeft = tMax;
    disp  = dealDisp(qi);
    startTmr();
  }
}


function finishRun() {
  clearInterval(tmr);
  sc = 'end';
  if (scores[diffKey] === undefined || pts > scores[diffKey]) {
    scores[diffKey] = pts;
    LS.set('scores', scores);
  }
  if (isDaily) saveDaily();
  stats.games    += 1;
  stats.correct  += nCorrect;
  stats.answered += cat.qs.length;
  stats.bestStreak = Math.max(stats.bestStreak || 0, bestStreak);
  const acc = nCorrect / Math.max(1, cat.qs.length);
  if (isMil) {
    stats.milBest  = Math.max(stats.milBest || 0, banked);
    stats.milRung  = Math.max(stats.milRung || 0, rung);
    if (banked >= LADDER[LADDER.length - 1].v) stats.million = (stats.million || 0) + 1;
    if (banked > milBest()) LS.set('milBest', banked);
  } else if (isSurv) {
    stats.survBest = Math.max(stats.survBest || 0, nCorrect);
  } else {
    if (acc === 1) stats.perfect = (stats.perfect || 0) + 1;
    if (diffKey === 'dificil' && acc >= 0.8) stats.hard80 = (stats.hard80 || 0) + 1;
  }
  LS.set('stats', stats);
  window._newMedals = newMedals();
  try { runPulls.push(...awardBdays()); } catch (e) {}
  const good = isMil ? banked > 0 : acc >= .5;
  setTimeout(() => snd.final(good), isMil && banked >= LADDER[LADDER.length - 1].v ? 2600 : 250);
  _fxEnd = good ? (acc >= .8 || (isMil && banked >= LADDER[LADDER.length - 1].v) ? 2 : 1) : 0;
}

function startTmr() {
  clearInterval(tmr);
  tmr = setInterval(() => {
    if (frozen || ladderOpen) return;
    tLeft = Math.max(0, tLeft - 1);
    const tf = document.getElementById('tf');
    if (tf) {
      tf.style.width = (tLeft / tMax * 100) + '%';
      tf.classList.toggle('t-warn', tLeft <= 10 && tLeft > 5);
      tf.classList.toggle('t-bad',  tLeft <= 5);
      if (tLeft <= 5) tf.classList.add('timer-low');
    }
    const cn = document.getElementById('clock-n');
    if (cn) { cn.textContent = tLeft; if (tLeft <= 5) cn.parentElement.classList.add('timer-low'); }
    if (sc === 'quiz' && tLeft > 0 && tLeft <= 5) snd.tick(tLeft);
    if (tLeft <= 0 && sc === 'quiz') { snd.whistle(); doReveal(); }
  }, 1000);
}

/* ── Boot ── */
/* A withdrawn crest is replaced at the source, so every place that prints
   LOGOS[id] — an <img>, the canvas share card — draws the shield instead. */
HIDE_CRESTS.forEach(id => {
  if (!LOGOS[id]) return;
  const inner = genericCrest(id);
  const svg = inner
    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">${inner}</svg>`
    : optBadge(heraldInk(clubName(id)), clubName(id)).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  LOGOS[id] = 'data:image/svg+xml,' + encodeURIComponent(svg);
});

go();

/* ── Service Worker registration ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(() => {}); // silently fail (e.g. file:// protocol)
  });
}
</script>
