@media (prefers-reduced-motion: reduce) { .gz-paper.is-new { animation: none; } }
.mode-gz { --md: #2A2420; --md-soft: rgba(42, 36, 32, .14); }
:root[data-theme="dark"] .mode-gz, :root:not([data-theme="light"]) .mode-gz { --md: #D8CBB0; }


/* ═══ DUELO A DOIS — the phone passed between two players; each with a colour ═══ */
.duo-pg { gap: 10px; }
.duo-setup, .duo-pass-in { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; text-align: center; padding-bottom: 14px; }
.duo-names { width: 100%; max-width: 360px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo-names label { display: flex; flex-direction: column; gap: 5px; text-align: left; font: 700 9.5px/1 var(--font-s); letter-spacing: .16em; text-transform: uppercase; color: var(--pc); }
.duo-names input { width: 100%; padding: 11px 12px; border: 0; border-radius: 4px; font: 600 16px/1 var(--font-d); color: var(--ink);
  background: var(--at-card-img) center / 100% 100% no-repeat; box-shadow: inset 0 -3px 0 var(--pc); }
.duo-names input:focus-visible { outline: 2px solid var(--pc); outline-offset: 2px; }
.duo-opts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.duo-opt { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 8px 12px; border: 0; border-radius: 4px; cursor: pointer;
  font: 700 15px/1 var(--font-d); color: var(--ink-2); background: var(--at-card-img) center / 100% 100% no-repeat; transition: transform .12s; }
.duo-opt small { font: 700 8.5px/1 var(--font-s); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.duo-opt.is-on { color: var(--on-brass, #1A1204); background: var(--brass); box-shadow: 0 2px 6px rgba(0, 0, 0, .2); }
.duo-opt.is-on small { color: inherit; opacity: .75; }
.duo-opt:active { transform: scale(.96); }
/* the pass: the phone sliding across, the player's initial in their colour */
.duo-phone { width: 34px; height: 54px; animation: duo-slide 1.2s cubic-bezier(.5, 0, .3, 1) both; }
.duo-phone svg { width: 100%; height: 100%; display: block; }
@keyframes duo-slide { from { opacity: 0; transform: translateX(-120px) rotate(-25deg); } 60% { opacity: 1; } }
.duo-disc { width: 78px; height: 78px; display: grid; place-items: center; border-radius: 50%; font: italic 700 38px/1 var(--font-d); color: #fff;
  background: var(--pc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 30%, transparent), 0 8px 18px rgba(0, 0, 0, .25);
  animation: duo-pop .5s cubic-bezier(.2, 1.6, .4, 1) .2s both; }
@keyframes duo-pop { from { opacity: 0; transform: scale(.3); } }
.duo-vez { display: flex; flex-direction: column; align-items: center; font-size: clamp(30px, 4.6vh, 40px); line-height: 1; }
.duo-vez small { font: italic 600 15px/1 var(--font-d); color: var(--ink-3); margin-bottom: 4px; }
.duo-vez em { color: var(--pc); }
.duo-stakes { padding: 4px 10px; border-radius: 3px; font: italic 600 13px/1.2 var(--font-d); color: var(--ink-2); background: color-mix(in srgb, var(--pc) 12%, transparent); }
.duo-stakes.is-hot { color: #fff; background: var(--pc); animation: duo-pop .5s cubic-bezier(.2, 1.6, .4, 1) .45s both; }
.duo-k { font: 700 9.5px/1 var(--font-s); letter-spacing: .2em; text-transform: uppercase; color: var(--brass-ink, var(--brass)); }
.duo-score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 340px; }
.duo-col { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 8px; border-radius: 4px; background: var(--at-card-img) center / 100% 100% no-repeat; opacity: .7; }
.duo-col.is-on { opacity: 1; box-shadow: inset 0 -3px 0 var(--pc); }
.duo-col b { font: 700 12px/1.1 var(--font-s); color: var(--pc); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duo-col .num { font: 700 24px/1 var(--font-d); color: var(--ink); }
.duo-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.duo-dots i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--ink-3) 28%, transparent); }
.duo-dots i.rl-3 { background: var(--good); }
.duo-dots i.rl-1 { background: var(--brass); }
.duo-dots i.rl-0 { background: var(--bad); }
/* over the board, while a player plays */
.duo-bar { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; margin: -3px 0 -2px; }
.duo-who { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 12px; font: 700 11px/1.2 var(--font-s); color: var(--ink-3);
  background: color-mix(in srgb, var(--pc) 10%, transparent); }
.duo-who b { max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duo-who .num { font: 700 13px/1 var(--font-d); }
.duo-who.is-on { color: #fff; background: var(--pc); }
.duo-x { font: italic 600 12px/1 var(--font-d); color: var(--ink-3); }
/* the end: two podiums, the winner's raised and crowned */
.duo-end { gap: 10px; }
.duo-win { font-size: clamp(28px, 4.2vh, 36px); }
.duo-verdict { margin: -4px 0 4px; font: italic 500 15px/1.3 var(--font-d); color: var(--ink-2); text-wrap: balance; }
.duo-podium { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 360px; align-items: end; }
.duo-pod { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 16px 8px 12px; border-radius: 4px;
  background: var(--at-card-img) center / 100% 100% no-repeat; box-shadow: inset 0 -4px 0 var(--pc); }
.duo-pod .duo-disc { width: 56px; height: 56px; font-size: 26px; }
.duo-pod.is-win { padding-top: 30px; transform: translateY(-8px); box-shadow: inset 0 -4px 0 var(--pc), 0 0 0 2px color-mix(in srgb, var(--brass) 60%, transparent), 0 10px 22px rgba(0, 0, 0, .2); }
.duo-pod.is-lose { opacity: .82; }
.duo-crown { position: absolute; top: -16px; animation: duo-crown .7s cubic-bezier(.2, 1.6, .4, 1) .5s both; }
@keyframes duo-crown { from { opacity: 0; transform: translateY(-30px) rotate(-30deg) scale(1.6); } }

/* ═══ MITO OU FATO? — an index card from the archive, ruled like a library's; drag it or tap ═══ */
.mf-pg { gap: 8px; --mf-paper: #F6EFDC; --mf-line: rgba(70, 110, 160, .16); --mf-margin: rgba(190, 60, 50, .32); --mf-ink: #2A241C; --mf-m: 0; --mf-f: 0; }
:root[data-theme="dark"] .mf-pg, :root:not([data-theme="light"]) .mf-pg { --mf-paper: #2B2422; --mf-line: rgba(150, 180, 220, .1); --mf-margin: rgba(230, 110, 95, .28); --mf-ink: #EDE4CF; }
.mf-head { display: flex; justify-content: space-between; align-items: center; }
.mf-seals { display: inline-flex; gap: 5px; }
.mf-seal { width: 24px; height: 24px; color: #A3302A; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .3)); transition: opacity .3s; }
.mf-seal svg { width: 100%; height: 100%; display: block; fill: currentColor; }

.mf-run { display: inline-flex; align-items: baseline; gap: 5px; font: 600 12.5px/1 var(--font-s); color: var(--ink-3); }
.mf-run b { font: 700 19px/1 var(--font-d); color: var(--ink); }
.mf-run small { margin-left: 6px; font: 600 11px/1 var(--font-s); color: var(--ink-3); }
/* the pile: the card on top of two more, a little askew */
.mf-stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; perspective: 1100px; margin: 2px 6px 0; }
.mf-under, .mf-card { grid-area: 1 / 1; width: 100%; max-width: 360px; height: 100%; max-height: 470px; border-radius: 6px; }
.mf-under { background: var(--mf-paper); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); transform: rotate(2.4deg) translateY(5px) scale(.97); opacity: .9; }
.mf-under-2 { transform: rotate(-3deg) translateY(9px) scale(.94); opacity: .7; }
.mf-card { position: relative; transform-style: preserve-3d; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
.mf-card img, .mf-card svg { -webkit-user-drag: none; pointer-events: none; }
.mf-card.is-turned { transform: rotateY(180deg); cursor: default; }
.mf-card.is-flipping { animation: mf-flip .55s cubic-bezier(.3, .1, .3, 1) both; }
@keyframes mf-flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg) scale(1.04); } 100% { transform: rotateY(180deg); } }
.mf-card.is-coming { animation: mf-come .38s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes mf-come { from { transform: rotate(2.4deg) translateY(5px) scale(.97); } }
.mf-face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 18px 18px 30px; overflow: hidden;
  border-radius: 6px; color: var(--mf-ink); backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: linear-gradient(90deg, transparent 21px, var(--mf-margin) 21px 22.5px, transparent 22.5px),
              repeating-linear-gradient(180deg, transparent 0 25px, var(--mf-line) 25px 26.5px) 0 14px, var(--mf-paper);
  box-shadow: 0 2px 4px rgba(0, 0, 0, .14), 0 14px 30px -10px rgba(0, 0, 0, .35); }
.mf-front { justify-content: center; }
.mf-back { transform: rotateY(180deg); justify-content: center; text-align: center; gap: 9px; }
.mf-pic { flex: 0 1 auto; min-height: 70px; height: 52%; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 3px; }
.mf-p-face img { height: calc(100% - 12px); aspect-ratio: 4 / 5; max-width: 100%; object-fit: cover; object-position: 50% 22%; border-radius: 3px;
  box-shadow: 0 0 0 4px #FBF7EC, 0 0 0 5px rgba(0, 0, 0, .12), 0 3px 8px rgba(0, 0, 0, .3); transform: rotate(-1.6deg); filter: sepia(.15); }
.mf-p-scene svg { width: auto !important; height: 100% !important; max-width: 100% !important; border-radius: 3px; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
.mf-p-flag svg { height: 70%; aspect-ratio: 3 / 2; width: auto; border-radius: 2px; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); filter: sepia(.25); }
.mf-tag { font: 700 9.5px/1 var(--font-s); letter-spacing: .18em; text-transform: uppercase; color: var(--brass-ink); }
.mf-claim { margin: 0; font: italic 600 clamp(19px, 3.3vh, 27px)/1.22 var(--font-d); letter-spacing: -.01em; text-align: center; text-wrap: balance; }
.mf-claim::before { content: '“'; } .mf-claim::after { content: '”'; }
/* the word the card is being dragged toward, coming up as it goes */
.mf-hint { position: absolute; z-index: 2; top: 22px; padding: 5px 11px 4px; border: 3px solid; border-radius: 5px; background: color-mix(in srgb, var(--mf-paper) 88%, transparent); font: 800 22px/1 var(--font-s); letter-spacing: .12em; text-transform: uppercase; pointer-events: none; }
.mf-hint-m { left: 34px; color: #B3402F; transform: rotate(-14deg); opacity: var(--mf-m); }
.mf-hint-f { right: 14px; color: #2E7D4F; transform: rotate(12deg); opacity: var(--mf-f); }
/* the back: the verdict stamped in ink, and why */
.mf-verdict { position: relative; padding: 8px 18px 6px; border: 4px double; border-radius: 6px; font: 800 clamp(34px, 6vh, 46px)/1 var(--font-s); letter-spacing: .14em;
  text-transform: uppercase; transform: rotate(-7deg); animation: mf-stamp .4s cubic-bezier(.5, 1.8, .5, 1) .48s both; mix-blend-mode: multiply; }
.mf-verdict.is-m { color: #B3402F; } .mf-verdict.is-f { color: #2E7D4F; }
:root[data-theme="dark"] .mf-verdict, :root:not([data-theme="light"]) .mf-verdict { mix-blend-mode: normal; }
:root[data-theme="dark"] .mf-verdict.is-m, :root:not([data-theme="light"]) .mf-verdict.is-m { color: #E06A55; }
:root[data-theme="dark"] .mf-verdict.is-f, :root:not([data-theme="light"]) .mf-verdict.is-f { color: #4CAE74; }
@keyframes mf-stamp { from { opacity: 0; transform: rotate(-16deg) scale(2.2); } 70% { opacity: 1; } }
.mf-said { display: inline-flex; align-items: center; gap: 5px; font: 700 12.5px/1 var(--font-s); }
.mf-claim-sm { margin: 0; font: italic 500 14px/1.3 var(--font-d); color: color-mix(in srgb, var(--mf-ink) 70%, transparent); text-wrap: balance; }
.mf-x { margin: 0; font: 500 clamp(14.5px, 2.25vh, 17px)/1.42 var(--font-d); text-wrap: pretty; }
.mf-back .selo-won { margin-top: 2px; }
/* the two answers, under the thumbs */
.mf-btns { flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 0 2px; }
.mf-btn { flex: 1; max-width: 150px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 14px 10px; border: 0; border-radius: 8px; cursor: pointer;
  font: 800 16px/1 var(--font-s); letter-spacing: .1em; text-transform: uppercase; color: #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, .22), 0 6px 14px -4px rgba(0, 0, 0, .3); transition: transform .1s; }
.mf-btn.is-m { background: #B3402F; } .mf-btn.is-f { background: #2E7D4F; }
.mf-btn:active { transform: translateY(2px) scale(.98); box-shadow: 0 1px 0 rgba(0, 0, 0, .22); }
.mf-or { font: italic 500 11px/1.15 var(--font-d); color: var(--ink-3); text-align: center; }
.mf-btns .btn-lg { min-width: 200px; }

.mf-end { gap: 9px; padding: 20px 18px; }
.mf-badge { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 26px 16px; border-radius: 8px; text-align: center;
  background: var(--at-card-img) center / 100% 100% no-repeat; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--brass) 55%, transparent); }
.mf-badge-k { font: 700 9.5px/1 var(--font-s); letter-spacing: .22em; text-transform: uppercase; color: var(--brass-ink); }
.mf-end-n { font-size: 64px; line-height: 1; }
.mf-badge-u { font: 700 10px/1 var(--font-s); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
.mf-rank { margin-top: 4px; font: italic 700 25px/1.1 var(--font-d); color: var(--ink); }
.mf-badge small { font: 500 13px/1.3 var(--font-d); color: var(--ink-2); }
.mf-miss { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.mf-miss-k { font: 700 9.5px/1 var(--font-s); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
.mf-miss-row { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; font: 500 13px/1.3 var(--font-d); color: var(--ink-2); }
.mf-miss-row b { font: 800 9.5px/1 var(--font-s); letter-spacing: .12em; text-transform: uppercase; padding: 3px 5px; border-radius: 3px; color: #fff; }
.mf-miss-row b.is-m { background: #B3402F; } .mf-miss-row b.is-f { background: #2E7D4F; }
.mode-mito { --md: #3E6B5A; --md-soft: rgba(62, 107, 90, .14); }
:root[data-theme="dark"] .mode-mito, :root:not([data-theme="light"]) .mode-mito { --md: #7FC2A5; }
@media (max-height: 700px) {
  .mf-face { gap: 7px; padding: 12px 14px 14px 28px; }
  .mf-pic { height: 44%; }
  .mf-btn { padding: 12px 8px; }

}
@media (prefers-reduced-motion: reduce) { .mf-card, .mf-verdict, .mf-seal { animation: none !important; } }

/* ═══ GABINETE DE CURIOSIDADES — a walnut cabinet, four niches lined in velvet, brass labels ═══ */
.gab-pg { --gab-wood: #4A2C1A; --gab-wood-2: #2E1A0F; --gab-velvet: #5B1F24; --gab-brass: #C9A04E; gap: 6px; }
