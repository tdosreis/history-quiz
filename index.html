    /* ═══ HISTORY'S OWN WAYS TO ASK — the strips (tools/history/css/formats.css) ═══ */
    .qcard-strip { flex-wrap: wrap; }
    .qcard-strip > p { flex: 1 1 100%; }
    .qstrip { flex: 1 1 100%; position: relative; }
    .hs-lbl { display: block; text-align: center; font: 700 9.5px/1 var(--font-s); letter-spacing: .22em; text-transform: uppercase; margin-bottom: 8px; }
    .hs-mark { display: block; width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex: none;
      background: var(--pocket); box-shadow: 0 0 0 2px rgba(255,255,255,.22), 0 2px 5px rgba(0,0,0,.25); }
    .hs-mark img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
    .hs-mark svg { width: 100%; height: 100%; display: block; }
    .hs-crest .crest-disc { position: static; transform: none; width: 100%; height: 100%; }
    .hs-flag { border-radius: 4px; width: 46px; height: 32px; }
    .hs-ink { background: none; box-shadow: none; }
    .hs-q { display: flex; align-items: center; justify-content: center; background: url(img/atelier/slip-gold.webp) center / 100% 100%;
      color: #3a2708; font: 700 20px/1 var(--font-d); box-shadow: none; }

    /* a citação: a sheet of laid paper, the sentence in ink */
    .hs-quote { background: url(img/atelier/slip-ivory.webp) center / 100% 100% no-repeat; color: #2A1D10; padding: 16px 18px 14px 50px; min-height: 76px; }
    .hs-quill { position: absolute; left: 10px; top: 12px; width: 32px; height: 32px; transform-origin: 20% 90%; }
    .hs-q-text { margin: 0; font: italic 600 17px/1.32 var(--font-d); letter-spacing: -.01em; }
    .hs-q-text::before { content: '“'; font-size: 1.5em; line-height: 0; vertical-align: -.32em; margin-right: 2px; color: #7B1E3A; }
    .hs-q-text::after { content: '”'; font-size: 1.5em; line-height: 0; vertical-align: -.32em; margin-left: 1px; color: #7B1E3A; }
    .hs-q-text i { font-style: inherit; }
    /* Complete a frase: the gap, ruled in the sheet's ink, and the word written into it at the reveal */
    .hs-blank { display: inline-block; min-width: 3.4em; height: .95em; vertical-align: -.12em; border-bottom: 2.5px solid #7B1E3A;
      background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(123, 30, 58, .1) 6px 7px); }
    .hs-blank.is-filled { min-width: 0; height: auto; vertical-align: baseline; padding: 0 .12em; color: #2E6B3F; background: rgba(58, 156, 110, .14);
      border-bottom-color: #3A9C6E; animation: hs-fill .55s cubic-bezier(.2, 1.3, .4, 1) .1s both; }
    @keyframes hs-fill { from { opacity: 0; transform: translateY(-6px) scale(1.25); } }
    @media (prefers-reduced-motion: reduce) { .hs-blank.is-filled { animation: none; } }
    .hs-ctx { display: block; margin-top: 7px; font: 600 11px/1.3 var(--font-s); color: #5A4C3D; letter-spacing: .02em; }

    .hs-sign { display: block; text-align: right; margin: 4px 4px 0 0; font: 400 26px/1 'Mr Dafoe', 'Brush Script MT', cursive; color: #1F3A6B;
      animation: hs-sign .9s ease-out both; transform-origin: 100% 50%; }
    @keyframes hs-sign { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
    .hs-side-shown b, .hs-link-shown b { color: #C79A4E; }
    .hs-link-shown b { color: #7B1E3A; }
    .hs-side-shown .hs-mark, .hs-link-shown .hs-mark { animation: hs-vs .5s cubic-bezier(.2,1.6,.4,1) both; box-shadow: 0 0 0 2.5px #C9A04E, 0 3px 8px rgba(0,0,0,.3); }

    /* …carved in stone, for the ancients: Roman capitals cut into grey marble */
    .hs-quote-pedra { background: radial-gradient(120% 90% at 30% 20%, #D9D6CF, #B8B3A8 55%, #9C968A); padding: 16px 18px 14px;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.25), inset 0 -6px 14px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.25); border-radius: 3px; }
    .hs-quote-pedra .hs-q-text { font: 600 15px/1.35 var(--font-d); font-style: normal; text-transform: uppercase; letter-spacing: .12em;
      text-align: center; color: #3A3530; text-shadow: 0 1px 0 rgba(255,255,255,.55), 0 -1px 0 rgba(0,0,0,.25); }
    .hs-quote-pedra .hs-q-text::before, .hs-quote-pedra .hs-q-text::after { content: '·'; color: #5A5248; margin: 0 6px; vertical-align: 0; font-size: 1em; }
    .hs-quote-pedra .hs-ctx { text-align: center; color: #4A443C; }
    /* …a ship's log: ruled paper and the compass rose */
    .hs-quote-diario { background: repeating-linear-gradient(180deg, transparent 0 21px, rgba(63,95,115,.28) 21px 22px), url(img/atelier/slip-ivory.webp) center / 100% 100% no-repeat; }
    .hs-quote-diario .hs-q-text { font-style: italic; color: #1F3A6B; }
    .hs-quote-diario .hs-quill { width: 34px; height: 34px; top: 14px; }
    /* …a letter, sealed */
    .hs-quote-carta { background: linear-gradient(180deg, rgba(255,255,255,.35), transparent 30%), url(img/atelier/slip-ivory.webp) center / 100% 100% no-repeat; }
    .hs-quote-carta .hs-q-text { font: 400 24px/1.1 'Mr Dafoe', 'Brush Script MT', cursive; color: #2A2440; letter-spacing: 0; }
    .hs-quote-carta .hs-q-text::before, .hs-quote-carta .hs-q-text::after { content: ''; }
    .hs-quote-carta .hs-quill { width: 36px; height: 36px; top: auto; bottom: 10px; left: 10px; }
    .qz-screen.intro .hs-quote-pedra .hs-q-text i { animation: hs-carve .45s ease-out both; }
    @keyframes hs-carve { from { opacity: 0; letter-spacing: .4em; filter: blur(1.5px); } to { opacity: 1; } }

    /* a batalha: the night slip, two banners and the swords */
    .hs-battle { background: url(img/atelier/slip-night-on.webp) center / 100% 100% no-repeat; color: #F2ECD9; padding: 12px 14px 13px; }
    .hs-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
    .hs-side { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
    .hs-side b { font: 700 12px/1.15 var(--font-c); letter-spacing: .03em; text-align: center; text-transform: uppercase; }
    .hs-side-q b { color: #C79A4E; }
    .hs-swords { width: 62px; height: 46px; }
    .hs-swords svg { width: 100%; height: 100%; overflow: visible; }
    .hs-spark { opacity: 0; }
    .hs-x { display: block; text-align: center; font-size: 10.5px; opacity: .8; margin-top: 6px; }

    /* a linhagem: name plaques on a parchment ribbon */
    .hs-line { background: url(img/atelier/slip-day.webp) center / 100% 100% no-repeat; color: #2A1D10; padding: 12px 8px 12px; }
    .hs-chain { display: flex; align-items: flex-start; justify-content: center; gap: 2px; }
    .hs-link { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1 1 0; min-width: 0; max-width: 78px; }
    .hs-link b { font: 600 10.5px/1.12 var(--font-d); text-align: center; letter-spacing: -.01em; overflow-wrap: anywhere; }
    .hs-link em { font: 600 8.5px/1.1 var(--font-s); font-style: normal; color: #6B5C48; text-align: center; }
    .hs-link .hs-mark { width: 34px; height: 34px; }
    .hs-link-q b { color: #7B1E3A; }
    .hs-join { flex: none; align-self: flex-start; margin-top: 10px; font: 700 14px/1 var(--font-d); color: #8A6A2C; }

    /* a manchete: newsprint, a masthead, the headline */
    .hs-news { background: #EEE7D3 url(img/atelier/paper-day.webp) repeat; background-size: 256px; color: #1E1A16; padding: 10px 14px 12px;
      box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 6px 14px rgba(60,40,20,.18); transform: rotate(-.6deg); }
    .hs-mast { text-align: center; border-bottom: 2px solid #1E1A16; padding-bottom: 4px; }
    .hs-mast span { font: 700 22px/1 'Mr Dafoe', var(--font-d); letter-spacing: .01em; }
    .hs-dateline { display: flex; justify-content: space-between; gap: 6px; font: 700 8.5px/1 var(--font-c); letter-spacing: .12em; text-transform: uppercase;
      border-bottom: 1px solid #1E1A16; padding: 4px 0 4px; margin-bottom: 7px; }
    .hs-head { margin: 0; text-align: center; font: 800 19px/1.08 var(--font-d); text-transform: uppercase; letter-spacing: -.01em; }
    .hs-sub { margin: 5px 0 0; text-align: center; font: italic 500 11.5px/1.3 var(--font-d); color: #3A322A; }
    .hs-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .hs-cols i { height: 16px; background: repeating-linear-gradient(180deg, rgba(30,26,22,.28) 0 1.2px, transparent 1.2px 4px); }

    /* the duel: two slips and the VS between them */
    .board-duel { position: relative; }
    .duel-vs { position: absolute; left: 50%; top: 50%; z-index: 3; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font: italic 800 17px/1 var(--font-d); color: #F7E6CC; pointer-events: none;
      background: radial-gradient(circle at 35% 30%, #A8344F, #5E1426); box-shadow: 0 0 0 3px #C9A04E, 0 4px 10px rgba(0,0,0,.35); }

    /* fato ou mito: the slips are rubber stamps */
    .opt-stamp { width: 86px; height: 54px; }
    .opt-stamp svg { width: 100%; height: 100%; display: block; }
    .b-myth .tile-name { display: none; }
    .b-myth.b-correct .opt-stamp { animation: hs-stamp .42s cubic-bezier(.2,1.6,.4,1) both; }

    /* ── the moments, once, when the question is dealt ── */
    .qz-screen.intro .hs-q-text i { animation: hs-ink .5s ease-out both; }
    .qz-screen.intro .hs-quill { animation: hs-write 1.2s ease-in-out both; }
    .qz-screen.intro .hs-sw-l { animation: hs-sw-l .5s cubic-bezier(.3,1.4,.5,1) .12s both; transform-origin: 13px 41px; }
    .qz-screen.intro .hs-sw-r { animation: hs-sw-r .5s cubic-bezier(.3,1.4,.5,1) .12s both; transform-origin: 47px 41px; }
    .qz-screen.intro .hs-spark { animation: hs-spark .5s ease-out .5s both; transform-origin: 30px 22px; }
    .qz-screen.intro .hs-side { animation: hs-rise .45s ease-out both; }
    .qz-screen.intro .hs-side:last-child { animation-delay: .08s; }
    .qz-screen.intro .hs-link, .qz-screen.intro .hs-join { animation: hs-rise .4s ease-out both; }
    .hs-link-q .hs-q { animation: hs-pulse 1.6s ease-in-out infinite; }
    .qz-screen.intro .hs-news { animation: hs-spin .9s cubic-bezier(.2,.8,.3,1) both; }
    .qz-screen.intro .duel-vs { animation: hs-vs .5s cubic-bezier(.2,1.6,.4,1) .25s both; }
    .qz-screen.intro .board-duel > .b:first-of-type { animation: hs-from-l .45s ease-out both; }
    .qz-screen.intro .board-duel > .b:nth-of-type(2) { animation: hs-from-r .45s ease-out both; }

    @keyframes hs-ink { from { opacity: 0; filter: blur(2.5px); color: #7B1E3A; } to { opacity: 1; filter: none; } }
    @keyframes hs-write { 0% { transform: translate(-4px, 4px) rotate(-8deg); } 25% { transform: translate(2px, -2px) rotate(6deg); }
      50% { transform: translate(-1px, 3px) rotate(-5deg); } 75% { transform: translate(2px, -1px) rotate(4deg); } 100% { transform: none; } }
    @keyframes hs-sw-l { from { transform: translateX(-30px) rotate(-50deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes hs-sw-r { from { transform: translateX(30px) rotate(50deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes hs-spark { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; transform: scale(1.6); } 100% { opacity: 0; transform: scale(2.4); } }
    @keyframes hs-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes hs-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes hs-spin { from { opacity: 0; transform: scale(.1) rotate(-720deg); } 70% { opacity: 1; } to { transform: rotate(-.6deg) scale(1); } }
    @keyframes hs-vs { from { opacity: 0; transform: scale(2.6) rotate(-20deg); } to { opacity: 1; transform: none; } }
    @keyframes hs-from-l { from { opacity: 0; transform: translateX(-40px) rotate(-4deg); } to { opacity: 1; transform: none; } }
    @keyframes hs-from-r { from { opacity: 0; transform: translateX(40px) rotate(4deg); } to { opacity: 1; transform: none; } }
    @keyframes hs-stamp { from { transform: scale(2.2) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .qz-screen.intro .hs-q-text i, .qz-screen.intro .hs-quill, .qz-screen.intro .hs-sw-l, .qz-screen.intro .hs-sw-r,
      .qz-screen.intro .hs-spark, .qz-screen.intro .hs-side, .qz-screen.intro .hs-link, .qz-screen.intro .hs-join,
      .hs-link-q .hs-q, .qz-screen.intro .hs-news, .qz-screen.intro .duel-vs, .qz-screen.intro .board-duel > .b,
      .b-myth.b-correct .opt-stamp { animation: none !important; }
    }
    /* the night theme: the paper strips keep their own paper; the newsprint dims */
    :root[data-theme="dark"] .hs-news { filter: brightness(.92) sepia(.08); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hs-news { filter: brightness(.92) sepia(.08); } }

    /* ═══ HOJE NA HISTÓRIA — the almanac line on the cover ═══ */
    .almanac { display: flex; align-items: center; gap: 10px; margin: 2px 0 6px; padding: 9px 12px 9px 9px; text-align: left;
      background: url(img/atelier/slip-ivory.webp) center / 100% 100% no-repeat; color: #2A1D10; }
    .almanac.is-today { animation: alm-in .6s ease-out .3s both; }
    button.almanac { width: 100%; border: 0; cursor: pointer; font: inherit; }
    button.almanac:active { transform: translateY(1px); }
    button.almanac:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
    @media (max-width: 380px) {
      .almanac .alm-t small { letter-spacing: .12em; line-height: 1.3; margin: -2px 0 -1.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .alm-go { width: 20px !important; height: 20px !important; }
    }
    /* on a phone the almanac's line is two at most; on one that is not tall it gives way to the day's
       news when there is some (a birthday edition, a friend's challenge), and the Hoje tile still opens it */
    @media (max-width: 699px) {
      .cover .alm-t > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    }
    @media (max-width: 699px) and (max-height: 800px) {
      .cover .home-news ~ .almanac { display: none; }
    }
    @media (max-width: 699px) and (max-height: 700px) {
      .pg-home.cover { padding-bottom: 8px; }
    }
    .alm-go { flex: none; margin-left: auto; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #F7F1E2; background: #B85A16; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
    .alm-pic { flex: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: #E9DDC1; color: #7B1E3A; box-shadow: 0 0 0 2px #C9A04E; }
    .alm-pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
    .alm-flag { border-radius: 5px; width: 46px; height: 32px; }
    .alm-flag svg { width: 100%; height: 100%; }
    .alm-crest .crest-disc { position: static; transform: none; width: 100%; height: 100%; }
    .alm-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; font: 500 12.5px/1.3 var(--font-d); }
    .alm-t small { font: 700 8.5px/1 var(--font-s); letter-spacing: .18em; text-transform: uppercase; color: #8A6A2C; }
    .alm-t b { color: #7B1E3A; }
    @keyframes alm-in { from { opacity: 0; transform: translateY(6px) rotate(-1deg); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .almanac.is-today { animation: none; } }

    /* a strip above a full board, on a phone that is not tall: everything a notch
       smaller, so the board and its Confirmar stay on the screen
       (tools/history/probe_fit.py walks the ladder at every phone size) */
    @media (max-width: 699px) and (max-height: 880px) {
      .qcard-strip > p { font-size: clamp(16px, 4.8vw, 19px); }
      .hs-lbl { margin-bottom: 5px; }
      .hs-quote { padding: 10px 14px 9px 42px; min-height: 0; }
      .hs-quill { width: 26px; height: 26px; top: 9px; left: 9px; }
      .hs-q-text { font-size: 15px; line-height: 1.27; }
      .hs-quote-pedra { padding: 10px 14px 9px; }
      .hs-quote-pedra .hs-q-text { font-size: 13px; }
      .hs-quote-carta .hs-q-text { font-size: 21px; }
      .hs-ctx { margin-top: 3px; font-size: 10.5px; }
      .hs-sign { font-size: 21px; margin-top: 1px; }
      .hs-battle { padding: 8px 12px 8px; }
      .hs-mark { width: 30px; height: 30px; }
      .hs-flag { width: 38px; height: 27px; }
      .hs-swords { width: 48px; height: 34px; }
      .hs-x { margin-top: 3px; font-size: 10px; line-height: 1.22; }
      .hs-line { padding: 8px 6px 8px; }
      .hs-link .hs-mark { width: 27px; height: 27px; }
      .hs-news { padding: 6px 12px 7px; }
      .hs-mast span { font-size: 17px; }
      .hs-dateline { padding: 3px 0; margin-bottom: 4px; }
      .hs-head { font-size: 15.5px; }
      .hs-sub { margin-top: 3px; font-size: 10.5px; line-height: 1.25;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    }
    /* under a strip, a board of portraits goes five to a row (two rows, not three),
       unless the phone has the room for four (fitGrow tries, and keeps it only if it fits) */
    @media (max-width: 699px) and (max-height: 880px) {
      .qcard-strip ~ .board-5:not(.board-four) > * { flex: 0 0 calc(20% - 5.6px); }
      .qcard-strip ~ .board-5:not(.board-four) .fig-sm .fig-band { font-size: 5.8px; padding: 1.5px 3px 1.5px 24px; letter-spacing: .03em; }
      /* the number tab, a size down, so the band's country starts clear of it */
      .qcard-strip ~ .board-5:not(.board-four) .tab { font-size: 8.5px; padding: 2px 5px; }
      .qcard-strip ~ .board-5:not(.board-four) .fig-sm .fig-cap { padding: 3px 2px; min-height: 21px; }
      .qcard-strip ~ .board-5:not(.board-four) .fig-sm .fig-nm { font-size: 8px; }
      .qcard-strip ~ .board-5:not(.board-four) .fig-sm .fig-nm-long { font-size: 7px; }
      .hs-news .hs-dateline { display: none; }
      .hs-news .hs-mast { margin-bottom: 4px; }
    }
    /* shorter still: the battle's caption and the front page's subhead are colour, not
       clues, and give their lines back; the slips under a strip go one notch tighter */
    @media (max-width: 699px) and (max-height: 720px) {
      .hs-q-text { font-size: 14px; }
      .hs-head { font-size: 14.5px; }
      .hs-x, .hs-sub { display: none; }
      .hs-quote, .hs-quote-pedra { padding-top: 8px; padding-bottom: 7px; }
      .hs-battle { padding: 6px 12px 7px; }
      .hs-lbl { margin-bottom: 3px; }
      .qcard-strip ~ .board-2-tight .b-text { min-height: 40px; padding-top: 6px; padding-bottom: 6px; }
      .qcard-strip ~ .board-2-tight .b-text.b-art { gap: 3px; padding-top: 5px; padding-bottom: 5px; }
      .qcard-strip ~ .board-2-tight .opt-crest, .qcard-strip ~ .board-2-tight .opt-face { width: 26px; height: 26px; }
    }

    /* a charada: the pictures on a puzzle page, each popping up in turn */
    .hs-rebus { background: url(img/atelier/slip-ivory.webp) center / 100% 100% no-repeat; color: #2A1D10; padding: 11px 12px 13px; }
    .hs-rebus .hs-lbl { color: #735728; }
    .hs-rb-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 2px 6px; }
    .hs-rb-e { display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%;
      font: 33px/1 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
      background: radial-gradient(circle at 50% 40%, #FFFDF5, #EFE3C6 70%); box-shadow: 0 0 0 1.5px #C9A04E, 0 2px 5px rgba(60, 40, 10, .25);
      filter: sepia(.18) saturate(.92); }
    .hs-rb-plus { font: 700 16px/1 var(--font-d); color: #8A6A2C; }
    .qz-screen.intro .hs-rb-e { animation: hs-pop .5s cubic-bezier(.2, 1.7, .4, 1) both; }
    @keyframes hs-pop { from { opacity: 0; transform: scale(.2) rotate(-18deg); } 70% { transform: scale(1.12) rotate(4deg); } to { opacity: 1; transform: none; } }

    /* o detalhe: a brass magnifying glass over a portrait */
    .hs-detail { display: flex; flex-direction: column; align-items: center; padding: 2px 0 4px; }
    .hs-detail .hs-lbl { color: var(--ink-3); margin-bottom: 7px; }
    .hs-detail.is-shown .hs-lbl { color: var(--brass-ink); font-size: 11px; letter-spacing: .14em; }
    .hs-lens { position: relative; width: 148px; height: 148px; border-radius: 50%; overflow: hidden; flex: none;
      box-shadow: 0 0 0 5px #B8862F, 0 0 0 7px #6E4E1A, 0 6px 16px rgba(30, 18, 6, .45); background: #2A1D10; }
    .hs-lens img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block;
      transform-origin: var(--x) var(--y); transform: scale(var(--z)); }
    /* the glass: a highlight across it, and its rim */
    .hs-lens i { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .38), rgba(255, 255, 255, 0) 34%),
                  radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 62%, rgba(20, 12, 4, .42) 100%); }
    .qz-screen.intro .hs-detail:not(.is-shown) .hs-lens { animation: hs-lens-in .7s cubic-bezier(.2, 1.3, .4, 1) both; }
    @keyframes hs-lens-in { from { opacity: 0; transform: translateY(10px) scale(.85) rotate(-8deg); } }
    .hs-detail.is-shown .hs-lens img { animation: hs-unzoom 1.15s cubic-bezier(.4, .05, .2, 1) both; transform: scale(1); }
    @keyframes hs-unzoom { from { transform: scale(var(--z)); } to { transform: scale(1); } }
    .hs-detail.is-shown .hs-lens { box-shadow: 0 0 0 5px #C9A04E, 0 0 0 7px #6E4E1A, 0 0 0 11px rgba(201, 160, 78, .28), 0 6px 16px rgba(30, 18, 6, .45); }

    /* o intruso: the note above the four, and the stamp on the odd one out */
    .hs-odd { display: flex; align-items: center; gap: 10px; padding: 9px 12px; color: #2A1D10;
      background: url(img/atelier/slip-ivory.webp) center / 100% 100% no-repeat; }
    .hs-odd-ic { flex: none; width: 34px; height: 34px; }
    .hs-odd-ic svg { width: 100%; height: 100%; display: block; }
    .hs-odd-t { font: 500 13.5px/1.3 var(--font-d); }
    .hs-odd-t b { font-weight: 700; color: #7B1E3A; }
    .hs-odd.is-shown { animation: hs-vs .5s cubic-bezier(.2, 1.6, .4, 1) both; }
    .qz-screen.intro .hs-odd-ic { animation: hs-peer 1.1s ease-in-out both; }
    @keyframes hs-peer { 0% { opacity: 0; transform: translateX(-10px) rotate(-14deg); } 40% { opacity: 1; transform: translateX(4px) rotate(8deg); }
      70% { transform: translateX(-2px) rotate(-4deg); } 100% { transform: none; } }
    .b-odd { position: absolute; left: 50%; top: 42%; z-index: 3; pointer-events: none; transform: translate(-50%, -50%) rotate(-12deg);
      padding: 4px 10px 3px; border: 2.5px solid #9B2226; border-radius: 5px; color: #9B2226; background: rgba(250, 244, 230, .82);
      font: 800 14px/1 var(--font-s); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(155, 34, 38, .35);
      animation: hs-odd-stamp .42s cubic-bezier(.2, 1.6, .4, 1) .22s both; }
    @keyframes hs-odd-stamp { from { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(2.2); } to { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(1); } }
    @media (max-height: 700px) {
      .hs-lens { width: 116px; height: 116px; }
      .hs-rb-e { width: 44px; height: 44px; font-size: 27px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .qz-screen.intro .hs-rb-e, .qz-screen.intro .hs-detail .hs-lens, .hs-detail.is-shown .hs-lens img, .hs-odd.is-shown, .qz-screen.intro .hs-odd-ic, .b-odd { animation: none !important; }
    }

    /* ── um anacronismo: the scene mounted like a print, four numbered pins on it, the intruder stamped at the reveal ── */
    .hs-anachro { padding: 0; background: none; box-shadow: none; }
    .hs-an-scene { position: relative; display: block; width: 100%; height: clamp(124px, 25vh, 232px); overflow: hidden; border-radius: 3px; background: #EFE6CF;
      box-shadow: 0 0 0 4px #F4ECD8, 0 0 0 5px rgba(107, 74, 34, .35), 0 5px 12px rgba(0, 0, 0, .25); }
    .hs-an-scene > svg { display: block; width: 100%; height: 100%; filter: sepia(.12); }
    .hs-an-place { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
      padding: 3px 9px 3px; border-radius: 2px; font: 700 10.5px/1.2 var(--font-s); letter-spacing: .05em; color: #3B2A16;
      background: rgba(250, 242, 222, .94); box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
    .hs-an-st { position: absolute; z-index: 1; width: 46px; height: 46px; margin: -23px 0 0 -23px; display: grid; place-items: center; border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #FFFDF5, #EFE3C6 72%); box-shadow: 0 0 0 2px #6B4A22, 0 3px 7px rgba(0, 0, 0, .35);
      transition: transform .3s, box-shadow .3s, opacity .3s; }
    .hs-an-st b { font: 26px/1 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; }
    .hs-an-st i { position: absolute; top: -5px; left: -5px; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%;
      font: 800 10px/1 var(--font-s); font-style: normal; color: #FBF6EA; background: #6B4A22; box-shadow: 0 0 0 1.5px #FBF6EA; }
    .qz-screen.intro .hs-an-st { animation: hs-pin .5s cubic-bezier(.3, 1.6, .4, 1) both; }
    @keyframes hs-pin { from { opacity: 0; transform: translateY(-18px) scale(1.4); } }
    .hs-an-st.is-bad { z-index: 2; transform: scale(1.16); box-shadow: 0 0 0 3px #B3402F, 0 0 0 8px rgba(179, 64, 47, .32), 0 4px 10px rgba(0, 0, 0, .4); }
    .hs-an-st.is-bad i { background: #B3402F; }
    .hs-an-st.is-ok { opacity: .82; }
    .hs-an-st.is-ok::after { content: '✓'; position: absolute; right: -5px; bottom: -4px; width: 17px; height: 17px; display: grid; place-items: center; border-radius: 50%;
      font: 800 11px/1 var(--font-s); color: #fff; background: #3A9C6E; box-shadow: 0 0 0 1.5px #FBF6EA; }
    .hs-an-stamp { position: absolute; z-index: 3; left: 50%; top: 56%; transform: translate(-50%, -50%) rotate(-10deg); white-space: nowrap; pointer-events: none;
      padding: 5px 12px 4px; border: 3px solid #9B2226; border-radius: 5px; color: #9B2226; background: rgba(250, 244, 230, .86);
      font: 800 17px/1 var(--font-s); letter-spacing: .14em; text-transform: uppercase; box-shadow: inset 0 0 0 1px rgba(155, 34, 38, .35);
      animation: hs-odd-stamp .42s cubic-bezier(.2, 1.6, .4, 1) .25s both; }
    .opt-emoji { width: 40px; height: 40px; font: 28px/1 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #FFFDF5, #EFE3C6 72%); box-shadow: 0 0 0 1.5px rgba(107, 74, 34, .5); }
    @media (max-height: 700px) {
      .hs-an-st { width: 38px; height: 38px; margin: -19px 0 0 -19px; }
      .hs-an-st b { font-size: 21px; }
      .opt-emoji { width: 32px; height: 32px; font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) { .qz-screen.intro .hs-an-st, .hs-an-stamp { animation: none !important; } }


/* ═══ O ÁLBUM DE SELOS ═══ */
.selo-pg { gap: 8px; }
.selo-pg .alb-head { gap: 8px; }
.selo-sheet { display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 8px;
  background: var(--at-card-img) center / 100% 100% no-repeat; color: var(--ink); }
.selo-band { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 2px 4px 6px;
  border-bottom: 1px solid var(--rule); }
.selo-band b { font: 600 19px/1 var(--font-d); letter-spacing: -.01em; }
.selo-band span { font-size: 11px; color: var(--ink-3); text-align: right; }
.selo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 9px; }
.selo { display: block; border: 0; padding: 0; background: none; cursor: pointer; color: var(--ink-3);
  aspect-ratio: 132 / 104; animation: selo-in .32s ease-out both; }
.selo .selo-svg { width: 100%; height: 100%; display: block; }
.selo.is-got .selo-svg { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .28)); }
.selo.is-got:nth-child(3n+1) { transform: rotate(-1.2deg); }
.selo.is-got:nth-child(3n+2) { transform: rotate(.8deg); }
.selo.is-got:nth-child(3n) { transform: rotate(-.4deg); }
.selo.is-new .selo-svg { animation: selo-stamp .7s cubic-bezier(.2, 1.4, .4, 1) both; }
.selo-void { cursor: default; animation: none; }
.selo:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.selo-pager { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.selo-pager .small { text-align: center; font-size: 11px; }
.selo-pager .btn:disabled { opacity: .3; pointer-events: none; }
.selo-hint { margin: 0; text-align: center; font-size: 11px; line-height: 1.3; }
@keyframes selo-in { from { opacity: 0; transform: translateY(6px); } }
@keyframes selo-stamp { 0% { transform: scale(1.35) rotate(-6deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }

.selo-zoom { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
  background: rgba(10, 8, 6, .62); padding: 16px; animation: selo-in .2s ease-out both; }
.selo-zoom-card { width: min(380px, 100%); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 18px 16px 14px; background: var(--at-card-img) center / 100% 100% no-repeat; color: var(--ink); }
.selo-zoom-st { width: 100%; }
.selo-zoom-st .selo-svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .35));
  animation: selo-stamp .6s cubic-bezier(.2, 1.4, .4, 1) both; }
.selo-zoom-t { margin: 4px 0 0; font: 600 16px/1.3 var(--font-d); }

.selo-mini { display: inline-block; width: 58px; flex: none; }
.selo-mini .selo-svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3)); }
.selo-strip { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; padding: 4px; color: inherit; }
.selo-strip-row { display: flex; gap: 8px; justify-content: center; }
.selo-strip .selo-mini { animation: selo-stamp .6s cubic-bezier(.2, 1.4, .4, 1) both; }
.selo-won { display: flex; align-items: center; gap: 9px; justify-content: center; margin-top: 6px; font-size: 12.5px; text-align: left; }
.selo-won .selo-mini { width: 50px; animation: selo-stamp .6s cubic-bezier(.2, 1.4, .4, 1) both; }
.selo-won b { color: var(--brass-ink, var(--brass)); }

/* the home screen: the album and the stamps side by side */
.cv-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; }
.cv-selo .cv-h { letter-spacing: .12em; }
.cv-cols .cv-album { min-width: 0; }
.cv-selo { gap: 10px; }
.cv-stk { position: relative; flex: none; width: 58px; height: 50px; }
.cv-stk i { position: absolute; top: calc(var(--i) * 3px); left: calc(var(--i) * 9px); width: 40px; height: 32px;
  transform: rotate(calc(var(--i) * 6deg - 6deg)); color: var(--ink-3); }
.cv-stk .selo-svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3)); }
.cv-selo .cv-at b { font-size: 22px; }
@media (max-width: 699px) {
  .cv-toc.cv-toc-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .cv-toc-4 .cv-rt b { font-size: 15px; }
  .cv-toc-4 .cv-rt small { font-size: 9.5px; }
  .cv-cols .cv-album { padding: 9px 10px 9px 8px; gap: 8px; }
  .cv-cols .cv-fan { width: 58px; }
  .cv-cols .cv-fan i { width: 27px; height: 38px; left: calc(var(--i) * 15px); }
  .cv-cols .cv-at b { font-size: 20px; }
  .cv-selo .cv-at b { font-size: 19px; white-space: nowrap; }
  .cv-selo .cv-at b small { font-size: 10.5px; }
  .cv-stk { width: 50px; height: 44px; }
  .cv-stk i { width: 34px; height: 27px; left: calc(var(--i) * 8px); }
}

/* ═══ QUE ANO? ═══ */
.ano-pg { gap: 9px; }
.ano-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ano-head .runlog { justify-content: flex-start; }
.ano-dot-on { background: var(--brass) !important; }
.ano-score { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.ano-score b { font: 600 20px/1 var(--font-d); color: var(--ink); }
.ano-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; flex: 1 1 auto; min-height: 0; }
.ano-pic { flex: 0 1 auto; min-height: 84px; max-height: min(330px, 36vh); width: 100%; display: flex; align-items: center; justify-content: center; }
.ano-pic svg { height: min(330px, 36vh); width: auto; max-width: 100%; max-height: 100%; display: block; }
.ano-scene svg { padding: 5px 5px 6px; background: #EFE6CF; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
.ano-face img { height: min(330px, 36vh); max-height: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: 50% 20%;
  padding: 5px 5px 6px; background: #EFE6CF; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); filter: sepia(.08); }
.ano-pic.ano-crest { height: min(150px, 24vh); }
.ano-crest .crest-disc { position: static; transform: none; width: auto; height: 100%; aspect-ratio: 1; flex: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .3), inset 0 0 0 1px rgba(32, 36, 30, .16); }
.ano-flag svg { width: auto; height: 100%; max-height: 120px; aspect-ratio: 3 / 2; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
/* a hyphenated word (14-Bis, Mata-mata) never breaks at its hyphen */
.ano-nw { white-space: nowrap; }
/* Hoje na História: the day and the month of the event, given; the year is the question */
.ano-date { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 5px 11px 4px; border-radius: 12px;
  font: 700 10.5px/1 var(--font-s); letter-spacing: .1em; text-transform: uppercase; color: var(--brass-ink); background: var(--brass-soft); }
.ano-t { margin: 0; text-align: center; font: 600 clamp(19px, 5.4vw, 23px)/1.22 var(--font-d); letter-spacing: -.012em; max-width: 26ch; }
.ano-dial { display: flex; flex-direction: column; align-items: stretch; gap: 6px; flex: none; }
.ano-year { text-align: center; font: 600 44px/1 var(--font-d); letter-spacing: -.02em; color: var(--brass-ink, var(--brass)); }
.ano-year.is-set { font-size: 30px; color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 2px; }
.ano-truth { text-align: center; font-size: 13px; color: var(--ink-2); }
.ano-truth span { font-weight: 700; color: var(--ink); }
.ano-truth b { font: 600 24px/1 var(--font-d); color: var(--good); margin: 0 2px; }
.ano-rule { position: relative; padding: 4px 4px 0; --ano-th0: 19px; }  /* 4px padding + half the 30px thumb */
.ano-rule input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; cursor: pointer; }
.ano-rule input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px;
  background: repeating-linear-gradient(90deg, var(--ink-3) 0 1px, transparent 1px 10%), var(--rule); }
.ano-rule input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--rule); }
.ano-rule input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -11px; border-radius: 50%;
  background: var(--brass); border: 3px solid var(--paper, #F4EEDC); box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.ano-rule input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--brass);
  border: 3px solid var(--paper, #F4EEDC); box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.ano-rule input[type=range]:disabled { opacity: .45; cursor: default; }
.ano-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); padding: 0 2px; }
.ano-mark { position: absolute; top: 4px; width: 0; height: 34px; pointer-events: none; }
.ano-year.is-set.is-hit { text-decoration: none; color: var(--good); }
.ano-mark::before { content: ''; position: absolute; left: -2px; top: 2px; width: 4px; height: 30px; border-radius: 2px; }
.ano-mark-g::before { background: var(--ink-3); }
.ano-mark-y::before { background: var(--good); animation: ano-drop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes ano-drop { from { transform: translateY(-14px); opacity: 0; } }
.ano-nudge { display: flex; justify-content: center; gap: 6px; }
.ano-nudge .btn { min-width: 52px; }
#ano-go { align-self: center; }
.ano-after { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.ano-after .story { margin-top: 2px; }
.ano-after .btn { margin-top: 6px; }
.ano-list { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.ano-li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 3px 4px;
  border-bottom: 1px solid var(--rule); font-size: 12px; }
.ano-li-p { font: 700 14px/1 var(--font-d); text-align: right; }
.ano-li-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ano-li-y { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.ano-li-y small { font-size: 9.5px; color: var(--ink-3); }
@media (max-width: 699px) {
  .ano-pg { padding-top: 10px; padding-bottom: 12px; gap: 7px; }
  .ano-year { font-size: 40px; }
}
@media (max-width: 699px) and (max-height: 700px) {
  .ano-pg { gap: 5px; }
  .ano-pic { max-height: 130px; }
  .ano-pic svg, .ano-face img { max-height: 130px; }
  .ano-t { font-size: 18px; }
  .ano-year { font-size: 34px; }
  .ano-li { padding: 2px 4px; font-size: 11px; }
}
.mode-ano { --md: #2F5D62; --md-soft: rgba(47, 93, 98, .14); }
:root[data-theme="dark"] .mode-ano, :root:not([data-theme="light"]) .mode-ano { --md: #5FA3A9; }

/* an unwon stamp's number reads in the dark too */
:root[data-theme="dark"] .selo:not(.is-got) { color: var(--ink-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .selo:not(.is-got) { color: var(--ink-2); } }
/* centred end screens: nothing cut off out of reach, and a short phone keeps the stamps to one line */
#ct > .pg.pg-center { justify-content: safe center; }
@media (max-height: 700px) {
  .selo-strip-row { display: none; }
  .newfigs-row .newfig { zoom: .74; }
  .pg:has(.newfigs):has(.selo-strip) .end-trophy { display: none; }
  .medal-chips .chip { padding-top: 3px; padding-bottom: 3px; }
  /* the screen's own eyebrow gives way, not the one naming the stamps just won; Hoje keeps its date */
  .ano-end > .eyebrow:not(.eb-keep) { display: none; }
  .ano-li { padding-top: 2px; padding-bottom: 2px; }
}
/* the album head, with Vitrine and Selos both in it */
@media (max-width: 460px) {
  .alb-pg .alb-head > .small { display: none; }
  .alb-pg .alb-vit { padding: 6px 10px; }
}
@media (max-width: 380px) { .cv-toc-4 .cv-rt b { font-size: 13.5px; white-space: nowrap; } }


/* ═══ O MAPA-MÚNDI — the album as an old atlas (js/atlas.js draws it) ═══ */
/* IM Fell English: the types Bishop Fell bought for Oxford in the 1670s, cut again by Igino Marini (SIL Open Font License, img/fonts) */
@font-face { font-family: 'IM Fell English'; src: url(img/fonts/im-fell-english-400.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'IM Fell English'; font-style: italic; src: url(img/fonts/im-fell-english-400-italic.woff2) format('woff2'); font-display: swap; }
.amap-pg { gap: 8px; flex: 1 1 auto; min-height: 0; }
.amap-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 1px 1px 3px; scrollbar-width: none; flex: none; }
.amap-tabs::-webkit-scrollbar { display: none; }
.amap-tab { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 8px 5px;
  border: 0; cursor: pointer; color: var(--ink-2); font: 700 12px/1 var(--font-s); letter-spacing: .02em;
  background: var(--at-card-img) center / 100% 100% no-repeat; }
.amap-tab small { font: 600 9.5px/1 var(--font-s); color: var(--ink-3); }
.amap-tab.is-on { color: var(--ink); box-shadow: inset 0 -3px 0 var(--brass); }
.amap-tab:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

/* the sheet: old rag paper, its edges browned and its fold still showing */
.amap-wrap { flex: 1 1 0; min-height: 150px; position: relative; }
.amap { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; border-radius: 2px;
  background: #E8D6AA url(img/atelier/map-paper.webp) 0 0 / 256px 256px;
  box-shadow: 0 6px 18px rgba(30, 18, 6, .4), 0 1px 3px rgba(30, 18, 6, .35); }
.amap::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1; mix-blend-mode: multiply;
  background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(255, 255, 255, 0) 52%, rgba(150, 100, 45, .2) 82%, rgba(105, 64, 24, .42) 100%),
    linear-gradient(90deg, rgba(0, 0, 0, 0) 49.2%, rgba(110, 75, 35, .16) 49.9%, rgba(255, 248, 230, .5) 50.3%, rgba(0, 0, 0, 0) 51%); }
.atl-svg { position: absolute; left: 0; top: 0; display: block; }
.atl-svg * { pointer-events: none; }
/* a <use> draws a copy of its <defs> original and takes that original's style: let those inherit from the copy */
.atl-svg defs * { pointer-events: inherit; }
.atl-svg use.atl-c, .atl-svg .atl-c use { pointer-events: visiblePainted; cursor: pointer; }
.atl-t { font-family: 'IM Fell English', 'Fraunces', Georgia, serif; fill: #3A2A1A; text-anchor: middle; dominant-baseline: central;
  paint-order: stroke; stroke: #F1E4C0; stroke-opacity: .72; stroke-linejoin: round; }
.atl-t-sea { font-style: italic; fill: #4A3926; }
.atl-t-land { fill: #4A3926; }
.atl-title { font-style: italic; fill: #2E2116; stroke: none; }
.atl-sub { fill: #5B4A33; stroke: none; letter-spacing: .03em; }
.atl-c.is-fresh .atl-wash { animation: atl-fresh 1.5s ease-in-out 3; }
@keyframes atl-fresh { 50% { fill: #E9C46A; fill-opacity: .95; } }
@media (prefers-reduced-motion: reduce) { .atl-c.is-fresh .atl-wash, .amap-pin.is-fresh { animation: none; } }

/* a pin on a chart: the place's flag in a brass medallion, its ring filling as its page does */
.amap-pin { position: absolute; z-index: 2; transform: translate(-50%, -50%); width: 27px; height: 27px; padding: 3px; border-radius: 50%; border: 0;
  cursor: pointer; background: conic-gradient(#B07A2E var(--f), #F7F1E2 0); box-shadow: 0 0 0 1px #4A3520, 0 2px 4px rgba(0, 0, 0, .45); }
.amap-pin:hover, .amap-pin:focus-visible { z-index: 4; transform: translate(-50%, -50%) scale(1.18); outline: none;
  box-shadow: 0 0 0 2px var(--brass), 0 2px 6px rgba(0, 0, 0, .45); }
.amap-flag { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
  background: #F7F1E2; color: #6E5836; }
.amap-flag svg { height: 100%; width: auto; display: block; }
.amap-crest { display: block; position: relative; flex: none; width: 100% !important; height: 100% !important; }
.amap-crest .crest-disc { position: static; transform: none; width: 100%; height: 100%; }
.amap-pin.is-empty { background: repeating-conic-gradient(#8A6B3E 0 12deg, #F7F1E2 12deg 24deg); }
.amap-pin.is-empty .amap-flag { filter: sepia(.45) saturate(.6); }
.amap-pin.is-done { background: #8E2F2F; box-shadow: 0 0 0 1.5px #E0B968, 0 2px 4px rgba(0, 0, 0, .45); }
/* the finished page's seal sits inside the ring, where it cannot cover a neighbour */
.amap-pin.is-done::after { content: '✓'; position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%;
  background: #E0B968; color: #3A1208; font: 800 8.5px/12px var(--font-s); text-align: center; box-shadow: 0 0 0 1px #6E5836; }
.amap-pin.is-fresh { animation: amap-pin-in 1.2s ease-out 2; z-index: 3; }
@keyframes amap-pin-in { 40% { box-shadow: 0 0 0 7px rgba(233, 196, 106, .85); } }
.amap-lead { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
.amap-lead path { fill: none; stroke: #2A1D10; stroke-width: 1.2; stroke-opacity: .7; stroke-dasharray: 2 2; }
.amap-lead circle { fill: #2A1D10; stroke: #F1E4C0; stroke-width: 1; }

/* under the map: the pages nearest to finished, or the first word to a new player, or the finished album */
.amap-near { display: flex; flex-wrap: wrap; gap: 4px 6px; flex: none; min-width: 0; }
.amap-near-h { flex: 1 0 100%; font: 700 9.5px/1 var(--font-s); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.amap-nr { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 7px; border: 0; cursor: pointer; text-align: left;
  color: var(--ink); background: var(--at-card-img) center / 100% 100% no-repeat; }
.amap-nr .amap-flag { flex: none; width: 24px; height: 24px; box-shadow: 0 0 0 1px #6E5836; }
.amap-nr > span:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.amap-nr b { font: 700 11.5px/1.1 var(--font-s); overflow-wrap: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.amap-nr small { font-size: 10.5px; color: var(--ink-3); }
.amap-first, .amap-done { display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; padding: 7px 12px;
  font: 600 12px/1.3 var(--font-s); color: var(--ink-2); text-align: left; background: var(--at-card-img) center / 100% 100% no-repeat; }
.amap-done { color: var(--brass-ink); font-weight: 700; }
.amap-first .btn { flex: none; }
.amap-hint { margin: 0; text-align: center; font-size: 11px; flex: none; }
.alb-pg .alb-head .alb-vit + .alb-vit { margin-left: -2px; }

/* a page's title never breaks inside a word; the age beside it gives way first */
.alb-pg .alb-band .t { overflow-wrap: normal; word-break: normal; }
.alb-pg .alb-dec { flex: 0 1 auto; min-width: 0; max-width: 46%; text-align: right; line-height: 1.1; }

/* the foot of a page: the country's own little chart, framed, its flag where it lies, a rose in the corner */
.alb-colo.alb-colo-map { box-shadow: none; justify-content: flex-end; padding: 0 0 8px; }
.alb-inset { position: absolute !important; inset: 4px; overflow: hidden; border-radius: 1px;
  background: #E8D6AA url(img/atelier/map-paper.webp) 0 0 / 256px 256px;
  box-shadow: 0 0 0 1px #4A3520, 0 0 0 3px #F1E5C4, 0 0 0 4px #4A3520, 0 3px 8px rgba(30, 18, 6, .3); }
.alb-inset::after { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
  background: radial-gradient(ellipse 80% 75% at 50% 50%, rgba(255, 255, 255, 0) 55%, rgba(120, 78, 30, .3) 100%); }
.alb-inset-rose { position: absolute; right: 5px; top: 5px; width: 34px; height: 34px; opacity: .92; }
.alb-inset-pin { position: absolute; transform: translate(-50%, -50%); width: 19px; height: 19px; padding: 2px; z-index: 1; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: #B07A2E; box-shadow: 0 0 0 1px #4A3520, 0 2px 4px rgba(0, 0, 0, .45); }
.alb-inset-pin > * { border-radius: 50%; overflow: hidden; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #F7F1E2; }
.alb-inset-pin svg { height: 100%; width: auto; }
.alb-colo-map .alb-colo-txt, .alb-colo-map.is-tall .alb-colo-txt { position: relative; top: auto; left: auto; transform: none; z-index: 1;
  padding: 4px 12px 5px; border-radius: 2px; background: #F4EBD2; box-shadow: 0 0 0 1px #4A3520, 0 0 0 3px #F4EBD2, 0 0 0 3.6px #4A3520; }
.alb-colo-map.plate-left { align-items: flex-start; padding-left: 12px; }
.alb-colo-map.plate-none .alb-colo-txt { display: none; }
.alb-inset-sea, .alb-inset-nm { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; z-index: 1;
  font-family: 'IM Fell English', var(--font-d); color: #4A3926; text-shadow: 0 0 3px #F1E4C0, 0 0 2px #F1E4C0; }
.alb-inset-sea { font-style: italic; font-size: 11px; }
.alb-inset-nm { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; }
.alb-colo-map .alb-colo-t { font-family: 'IM Fell English', var(--font-d); font-weight: 400; letter-spacing: .2em; color: #2E2116; }
.alb-colo-map .alb-colo-s { font-family: 'IM Fell English', var(--font-d); color: #5B4A33; }

@media (max-height: 700px) {
  .amap-pg { gap: 6px; }
  .amap-tab { padding: 5px 6px 4px; }
  .amap-nr { padding: 4px 6px; }
  .amap-nr .amap-flag { width: 20px; height: 20px; }
  .amap-first, .amap-done { padding: 5px 10px; }
}

/* on a tablet or a computer the sheet is as tall as the screen allows, so the maps get the room */
@media (min-width: 700px) {
  #qz:has(.amap-pg), #qz:has(.alb-pg), #qz:has(.onde-pg) { height: min(calc(100dvh - 48px), 980px); }
}


/* ═══ ONDE FOI? — the pin on the atlas ═══ */
.onde-pg { gap: 8px; }
.onde-card { display: flex; align-items: center; gap: 11px; flex: none; padding: 8px 12px 8px 8px; background: var(--at-card-img) center / 100% 100% no-repeat; }
.onde-pic { flex: none; width: 84px; height: 56px; overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: #EFE6CF; box-shadow: 0 0 0 1px #6E5836; border-radius: 2px; }
.onde-pic svg { width: 100% !important; height: 100% !important; max-width: none !important; display: block; }
.onde-scene svg { object-fit: cover; }
.onde-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
.onde-crest { padding: 3px; }
.onde-crest > * { width: 50px !important; height: 50px !important; position: relative; }
.onde-flag svg { width: 100%; height: 100%; }
.onde-tt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.onde-t { margin: 0; font: 600 16px/1.2 var(--font-d); letter-spacing: -.01em; color: var(--ink); }
.onde-y { font: 700 11px/1 var(--font-s); letter-spacing: .08em; color: var(--ink-3); }
.onde-map { position: relative; flex: 1 1 0; min-height: 150px; margin: 4px; overflow: hidden; touch-action: none; user-select: none;
  -webkit-user-select: none; cursor: crosshair; outline: none;
  background: #E8D6AA url(img/atelier/map-paper.webp) 0 0 / 256px 256px;
  border: 1.5px solid #6E5836; box-shadow: 0 0 0 3px #EFE6CF, 0 0 0 4px #6E5836, 0 4px 14px rgba(0, 0, 0, .3); }
.onde-map:focus-visible { box-shadow: 0 0 0 3px #EFE6CF, 0 0 0 4px #6E5836, 0 0 0 7px var(--brass); }
.is-rev .onde-map { cursor: grab; }
.onde-svg, .onde-ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.onde-ov { pointer-events: none; overflow: visible; }
.onde-deco { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
  opacity: 0; transition: opacity .25s; z-index: 1; overflow: hidden; }

@keyframes onde-drop { from { transform: translateY(-16px) scale(.6); opacity: .3; } }
.onde-mk-t { z-index: 3; }

  box-shadow: 0 0 0 2px #3A1208, 0 0 0 6px rgba(224, 185, 104, .5); animation: onde-ring 1.6s ease-out infinite; }

.onde-mk-t b { position: absolute; left: 15px; top: -11px; white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis;
  font: 700 11.5px/1 var(--font-s); color: #2A1D10; background: #F7F1E2; padding: 5px 7px; border-radius: 3px;
  box-shadow: 0 0 0 1px #6E5836, 0 1px 3px rgba(0, 0, 0, .3); }

.onde-zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 4; }
.onde-zb { width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  background: #F7F1E2; color: #2A1D10; font: 700 20px/1 var(--font-s); box-shadow: 0 0 0 1px #6E5836, 0 1px 3px rgba(0, 0, 0, .35); }
.onde-zb:disabled { opacity: .4; cursor: default; }
.onde-zb:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.onde-tip { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 4; pointer-events: none; white-space: nowrap;
  background: rgba(42, 29, 16, .85); color: #F7F1E2; font: 600 12px/1 var(--font-s); padding: 8px 12px; border-radius: 14px; }

.onde-after { display: flex; flex-direction: column; gap: 7px; flex: none; }

@media (max-height: 700px) {

}
.mode-onde { --md: #56702F; --md-soft: rgba(86, 112, 47, .14); }
:root[data-theme="dark"] .mode-onde, :root:not([data-theme="light"]) .mode-onde { --md: #8DAE57; }
/* the other games, on a phone: four to a row, two rows */

}
.cv-ts { display: none; }
@media (max-width: 699px) { .cv-toc-4 .cv-ts { display: inline; } }
@media (max-width: 380px) { .cv-toc-4 .cv-rt b { font-size: 12.5px; } .cv-toc-4 .cv-rt small { font-size: 9.5px; } }

/* ═══ O DESAFIO — a friend's challenge, and who won it ═══ */
.chal-pg { padding: 26px 22px; gap: 10px; }
.chal-ic { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; margin: 2px 0;
  background: var(--md); color: #fff; }
.chal-g { margin: -4px 0 0; font: 700 12px/1 var(--font-s); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.chal-card { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 14px 30px 15px; margin: 4px 0;
  background: var(--at-card-img) center / 100% 100% no-repeat; }
.chal-card small { font: 700 10px/1 var(--font-s); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
.chal-card b { font: 600 34px/1 var(--font-d); color: var(--brass-ink); letter-spacing: -.02em; }
.chal-card span { font-size: 12px; color: var(--ink-3); }
.chal-pg .btn-lg { margin-top: 6px; }
.chal-res { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 2px 9px; padding: 6px 12px; max-width: 340px;
  border: 1.5px solid var(--rule); border-radius: 4px; background: var(--pocket-2, rgba(128, 128, 128, .08)); }
.chal-res-k { display: flex; align-items: center; gap: 4px; align-self: center; font: 700 9.5px/1 var(--font-s); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
.chal-res-v { font: 600 14px/1.2 var(--font-s); color: var(--ink-2); white-space: nowrap; }
.chal-res-v b { color: var(--ink); }
.chal-res-v small { font-size: 10.5px; color: var(--ink-3); }
.chal-res-v i { font-style: normal; color: var(--ink-3); margin: 0 2px; }
.chal-res em { font: italic 600 16px/1.1 var(--font-d); white-space: nowrap; }
.chal-res.is-win { border-color: var(--brass); }
.chal-res.is-win em { color: var(--brass-ink); }
.chal-res.is-lose em { color: var(--ink-2); }
@media (max-height: 700px) {
  .chal-pg { gap: 7px; padding: 16px 20px; }
  .chal-ic { width: 52px; height: 52px; }
  .chal-card { padding: 10px 26px 11px; }
  .chal-card b { font-size: 29px; }
  .chal-res { padding: 5px 10px; }
  .chal-res em { font-size: 15px; }
}

/* ═══ REVISAR — the tile, and what is left ═══ */
.mode-rev { --md: #6B4E8A; --md-soft: rgba(107, 78, 138, .14); }
:root[data-theme="dark"] .mode-rev, :root:not([data-theme="light"]) .mode-rev { --md: #A68BC6; }
.cv-row.is-off { opacity: .62; }
.cv-row.is-off .cv-ic { filter: grayscale(.7); }
.cv-row.is-nudge { animation: rev-nudge .4s ease; }
@keyframes rev-nudge { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
.rev-left { display: flex; align-items: center; gap: 5px; color: var(--ink-2); font-weight: 600; }


/* ═══ CRONOLOGIA — the line of time, its events on slips, the gaps between them to tap ═══ */
.cron-pg { gap: 8px; }
.cron-lives { display: flex; gap: 2px; }
.cron-lives i { display: flex; color: var(--ink-3); opacity: .28; transition: opacity .3s, transform .3s; }
.cron-lives i.on { color: var(--bad); opacity: 1; }
.cron-card { margin: 0; }
.cron-line { flex: 1 1 0; min-height: 110px; position: relative; display: flex; flex-direction: column; padding: 14px 2px;
  overflow-x: hidden; overscroll-behavior: contain;
  /* the line fades at its ends, so a line longer than its window shows there is more of it above and below */
  -webkit-mask-image: linear-gradient(transparent, #000 14px, #000 calc(100% - 14px), transparent);
  mask-image: linear-gradient(transparent, #000 14px, #000 calc(100% - 14px), transparent); }
.cron-line:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
/* the spine of the line, behind the slips and the gaps: a rule down the year column */
.cron-row, .cron-slot { --sp: 34px; background-image: linear-gradient(var(--brass), var(--brass)); background-repeat: no-repeat;
  background-size: 2px 100%; background-position: var(--sp) 0; }
.cron-row { flex: none; position: relative; display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 8px;
  min-height: 38px; padding: 0 10px 0 0; }
.cron-y { justify-self: center; z-index: 1; padding: 4px 6px; min-width: 56px; text-align: center; border-radius: 3px;
  font: 600 13.5px/1 var(--font-d); letter-spacing: -.01em; color: var(--brass-ink); background: var(--pocket);
  box-shadow: 0 0 0 1.5px var(--brass); white-space: nowrap; }
.cron-y.is-long { min-width: 0; padding: 4px 3px; font-size: 11.5px; letter-spacing: -.03em; }
.cron-t { padding: 7px 10px; font: 500 13px/1.25 var(--font-d); color: var(--ink);
  background: var(--at-card-img) center / 100% 100% no-repeat; }
.cron-row.is-good .cron-y { color: #fff; background: var(--good); box-shadow: 0 0 0 1.5px var(--good); }
.cron-row.is-bad .cron-y { color: #fff; background: var(--bad); box-shadow: 0 0 0 1.5px var(--bad); }
.cron-row.is-good .cron-t, .cron-row.is-bad .cron-t { font-weight: 600; }
/* the night's green and red are light: the year on them is printed dark */
:root[data-theme="dark"] .cron-row.is-good .cron-y, :root[data-theme="dark"] .cron-row.is-bad .cron-y,
:root:not([data-theme="light"]) .cron-row.is-good .cron-y, :root:not([data-theme="light"]) .cron-row.is-bad .cron-y { color: #10140F; }
.cron-row#cron-fresh.is-good, .cron-row#cron-fresh.is-bad { animation: cron-in .45s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes cron-in { from { transform: translateX(-14px) scale(.97); opacity: 0; } }
/* a gap to tap: a dashed slot on the line, saying where */
.cron-slot { flex: none; display: flex; align-items: center; width: 100%; min-height: 36px; padding: 0 10px 0 80px; border: 0; cursor: pointer;
  background-color: transparent; color: var(--ink-3); font: 700 10px/1 var(--font-s); letter-spacing: .14em; text-transform: uppercase; }
.cron-slot span { flex: 1; display: flex; align-items: center; justify-content: center; height: 22px; border-radius: 11px;
  border: 1.5px dashed color-mix(in srgb, var(--ink-3) 55%, transparent); transition: background .15s, color .15s, border-color .15s; }
.cron-slot:hover span, .cron-slot:focus-visible span { color: var(--on-brass, #1A1204); background: var(--brass); border-color: var(--brass); border-style: solid; }
.cron-slot:focus-visible { outline: none; }
.cron-slot:active span { transform: scale(.98); }
.cron-res { flex: none; display: flex; flex-direction: column; gap: 4px; padding: 9px 12px; text-align: center;
  background: var(--at-card-img) center / 100% 100% no-repeat; }
.cron-res-h { margin: 0; font: 600 16px/1.2 var(--font-d); color: var(--ink-2); }
.cron-res-h b { font-weight: 700; }
.cron-res.good .cron-res-h b { color: var(--good-ink); }
.cron-res.bad .cron-res-h b { color: var(--bad); }
.cron-res-h .num { color: var(--ink); }
.cron-res-h small { font: 600 12px/1 var(--font-s); color: var(--ink-3); }
.cron-res-x { margin: 0; font-size: 12.5px; line-height: 1.32; color: var(--ink-2);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cron-res .selo-won { justify-content: center; }
.cron-hint { margin: 14px 10px 0 80px; font-size: 12.5px; line-height: 1.35; color: var(--ink-3); }
#cron-next { flex: none; align-self: stretch; justify-content: center; }
/* the results: the whole line as it was laid, the wrong ones in red */
.cron-line-end { flex: 0 1 auto; width: 100%; max-width: 440px; max-height: 38vh; min-height: 80px; text-align: left; }
.cron-line-end .cron-row { min-height: 0; padding-top: 2px; padding-bottom: 2px; }
.cron-line-end .cron-t { padding: 5px 9px; font-size: 12px; }
.mode-cron { --md: #3B5488; --md-soft: rgba(59, 84, 136, .14); }
:root[data-theme="dark"] .mode-cron, :root:not([data-theme="light"]) .mode-cron { --md: #8AA3D6; }
.mode-hoje { --md: #B85A16; --md-soft: rgba(184, 90, 22, .14); }
:root[data-theme="dark"] .mode-hoje, :root:not([data-theme="light"]) .mode-hoje { --md: #E8904A; }
@media (max-height: 700px) {
  .cron-pg { gap: 6px; }
  .cron-row { min-height: 34px; }
  .cron-t { padding: 5px 9px; font-size: 12.5px; }
  .cron-slot { min-height: 32px; }
  .cron-res { padding: 6px 10px; }
  .cron-res-h { font-size: 15px; }
  .cron-res-x { font-size: 12px; -webkit-line-clamp: 2; }
  .cron-line-end { max-height: 30vh; }
}
/* on a tablet or a computer the sheet is as tall as the screen allows, so the line gets the room */
@media (min-width: 700px) {
  #qz:has(.cron-pg) { height: min(calc(100dvh - 48px), 980px); }
}
/* the Cronologia's door: the day's line, or a free one */
.cron-menu-in { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; text-align: center; padding: 6px 4px 18px; }
.cron-menu-in .chal-ic { margin-bottom: 2px; }
.cron-menu-p { max-width: 32ch; margin: 0 0 6px; line-height: 1.4; }
.cron-opt { width: 100%; max-width: 380px; display: flex; align-items: center; gap: 13px; padding: 14px 16px; border: 0; cursor: pointer; text-align: left;
  color: var(--ink); background: var(--at-card-img) center / 100% 100% no-repeat; transition: transform .12s; }
.cron-opt .mode-disc { width: 42px; height: 42px; flex: none; }
.cron-opt b { display: block; font: 600 19px/1.15 var(--font-d); letter-spacing: -.01em; }
.cron-opt small { display: block; margin-top: 3px; font: 600 12px/1.3 var(--font-s); color: var(--ink-3); }
.cron-opt.is-day:not(.is-done) { box-shadow: inset 0 -3px 0 var(--brass); }
.cron-opt:hover .mode-disc, .cron-opt:focus-visible .mode-disc { transform: scale(1.08); }
.cron-opt:active { transform: translateY(1px); }
.cron-opt:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
@media (max-height: 700px) {
  .cron-menu-in { gap: 9px; }
  .cron-menu-in .chal-ic { width: 52px; height: 52px; }
  .cron-opt { padding: 11px 14px; }
}


/* ═══ METAS DA SEMANA ═══ */
.metas-pg { gap: 10px; }
.metas-when { margin: 0; text-align: center; font: 600 13px/1.3 var(--font-s); color: var(--ink-3); }
.metas-when b { color: var(--ink); }
.metas-list { display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; justify-content: safe center; }
.meta { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 12px; background: var(--at-card-img) center / 100% 100% no-repeat; }
.meta .mode-disc { width: 40px; height: 40px; flex: none; }
.meta-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.meta-tx b { font: 600 16px/1.2 var(--font-d); color: var(--ink); }
.meta-tx small { font: 600 11.5px/1 var(--font-s); color: var(--ink-3); }
.meta-bar { display: block; height: 7px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.meta-bar i { display: block; height: 100%; border-radius: 4px; background: var(--brass); transition: width .5s; }
.meta.is-done .meta-bar i { background: var(--good); }
.meta-prize { flex: none; width: 46px; display: flex; justify-content: center; }
.meta-prize .selo-mini { width: 46px; }
.meta-prize .selo-mini svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3)); }
.meta-gift { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-3);
  border: 1.5px dashed color-mix(in srgb, var(--ink-3) 60%, transparent); }
.metas-foot { margin: 0; text-align: center; line-height: 1.4; }
/* the banner a goal met raises, over whatever is on the screen */
.meta-toast { position: fixed; left: 50%; top: max(10px, env(safe-area-inset-top)); z-index: 2000; transform: translateX(-50%); pointer-events: none;
  width: min(92vw, 400px); display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px;
  background: #F7F1E2; color: #20241E; box-shadow: 0 0 0 1px #6E5836, 0 6px 22px rgba(0, 0, 0, .35); animation: meta-in .45s cubic-bezier(.2, 1.3, .4, 1); }
.meta-toast.is-out { opacity: 0; transform: translate(-50%, -14px); transition: opacity .4s, transform .4s; }
.meta-toast .mode-disc { width: 34px; height: 34px; flex: none; }
.meta-toast > span:nth-child(2) { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.meta-toast small { font: 700 9.5px/1 var(--font-s); letter-spacing: .14em; text-transform: uppercase; color: #735728; }
.meta-toast b { display: block; font: 600 14px/1.2 var(--font-d); }
.meta-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.meta-toast i { font: 600 11px/1.2 var(--font-s); font-style: normal; color: #4B4F45; }
.meta-toast .selo-mini { width: 40px; flex: none; }
.meta-toast .selo-mini svg { width: 100%; height: auto; display: block; }
@keyframes meta-in { from { opacity: 0; transform: translate(-50%, -18px); } }
@media (prefers-reduced-motion: reduce) { .meta-toast { animation: none; } }
@media (max-height: 700px) {
  .meta { padding: 10px 12px 10px 10px; }
  .meta .mode-disc { width: 34px; height: 34px; }
  .meta-tx b { font-size: 15px; }
}


/* ═══ THE ROUND'S CERTIFICATE — a sheet with a ruled frame, the score in a laurel, a title, a wax seal ═══ */
.end-cert { position: relative; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 20px 18px 18px; color: var(--ink); background: var(--at-card-img) center / 100% 100% no-repeat; }
/* the frame: a brass rule and a fainter one outside it, like an engraved border */
.end-cert::before { content: ''; position: absolute; inset: 9px; pointer-events: none; border-radius: 2px;
  border: 1.5px solid color-mix(in srgb, var(--brass) 72%, transparent);
  outline: 1px solid color-mix(in srgb, var(--brass) 34%, transparent); outline-offset: 3px; }
.end-cert .display em { font-size: inherit; }
.end-wreath { position: relative; width: 220px; height: 112px; display: grid; place-items: center; margin: 2px 0 -4px; }
.end-wreath .end-laurel { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--brass);
  animation: end-laurel .9s cubic-bezier(.2, .8, .3, 1) both; }
.end-wreath #endpts { position: relative; margin-top: -6px; }
.end-wreath-mode { width: 250px; height: 112px; margin: -4px 0 -6px; }
.end-wreath-mode > .display { position: relative; margin-top: -8px; }
@keyframes end-laurel { from { opacity: 0; transform: scale(.82) rotate(-4deg); } }
/* the title, on a ribbon: its two tails folded behind */
.end-title { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 4px 0 2px;
  padding: 6px 26px 7px; color: #F6EBD8; background: var(--retro-band, #6B2E1F);
  clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 50%, 100% 100%, 0 100%, 12px 50%);
  animation: end-ribbon .5s cubic-bezier(.2, 1.2, .4, 1) .45s both; }

/* ═══ JORNADA PELA HISTÓRIA — an old map, an era a page, its stops as medallions on a dotted road ═══ */

  border-top: 1.5px solid color-mix(in srgb, var(--brass) 70%, transparent); border-bottom: 1.5px solid color-mix(in srgb, var(--brass) 70%, transparent);
  box-shadow: 0 3px 0 -1.5px color-mix(in srgb, var(--brass) 35%, transparent), 0 -3px 0 -1.5px color-mix(in srgb, var(--brass) 35%, transparent); }
.jor-cart small { font: 700 9.5px/1 var(--font-s); letter-spacing: .24em; text-transform: uppercase; color: var(--brass-ink, var(--brass)); }
.jor-cart b { font: italic 700 21px/1.1 var(--font-d); letter-spacing: -.01em; color: var(--ink); }
.jor-sum { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 600 12px/1 var(--font-s); color: var(--ink-3); }
.jor-sum > span:first-child { display: inline-flex; align-items: center; gap: 4px; }
.jor-sum b { font: 700 15px/1 var(--font-d); color: var(--ink); }
.jor-dots { display: inline-flex; gap: 5px; align-items: center; }

.jor-dots i.ok { background: var(--good); }

/* the map: aged paper, a faint graticule, a wash of the era's colour in one corner */
.jor-map { position: relative; flex: 1 1 0; min-height: 280px; overflow: hidden; border-radius: 4px; color: #3B2A16; isolation: isolate;
  background: radial-gradient(ellipse at 48% 38%, #F8EFD6 0%, #EFE1BC 55%, #DCC48F 100%);
  box-shadow: inset 0 0 0 1.5px rgba(107, 74, 34, .55), inset 0 0 0 5px rgba(247, 237, 211, .5), inset 0 0 0 6.5px rgba(107, 74, 34, .35),
    inset 0 0 46px rgba(110, 70, 20, .28), 0 3px 12px rgba(0, 0, 0, .22); }
.jor-map::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: repeating-linear-gradient(0deg, rgba(107, 74, 34, .075) 0 1px, transparent 1px 46px),
    repeating-linear-gradient(90deg, rgba(107, 74, 34, .075) 0 1px, transparent 1px 46px); }
.jor-map::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(circle at 84% 14%, color-mix(in srgb, var(--era) 22%, transparent), transparent 55%),
    radial-gradient(circle at 10% 92%, color-mix(in srgb, var(--era) 14%, transparent), transparent 45%); }
.jor-mark { position: absolute; left: 50%; top: 54%; width: 62%; max-width: 280px; transform: translate(-50%, -50%) rotate(-6deg);
  opacity: .08; pointer-events: none; filter: sepia(1); }

.jor-road { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* a stop: its scene in a brass medallion, its number and name on a label, its stars */
.jor-stop { position: absolute; z-index: 2; transform: translate(-50%, -36%); display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 0; border: 0; background: none; cursor: pointer; color: inherit; -webkit-tap-highlight-color: transparent; }
.jor-medal { position: relative; display: block; width: clamp(76px, 13vh, 116px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: #EFE6CF;

.jor-name { max-width: 158px; padding: 3px 8px 4px; border-radius: 3px; text-align: center; font: 600 13px/1.15 var(--font-d); letter-spacing: -.005em;

/* an era not reached yet: the map is there, but faded, terra incognita */

.jor-fog-t { position: absolute; z-index: 1; left: 62%; top: 29%; transform: translate(-50%, -50%) rotate(-9deg); white-space: nowrap; pointer-events: none;

.jor-map.is-fin { background: radial-gradient(ellipse at 50% 42%, #F4E6C4 0%, #E2CB98 60%, #C9AA6E 100%); }
.jor-foot { flex: none; display: flex; justify-content: center; }

.jor-endline { margin: 0; display: flex; align-items: center; gap: 6px; font: 600 13px/1.3 var(--font-d); color: var(--ink-2); text-align: center; }

@keyframes jor-fade { from { opacity: 0; } }
.jor-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 0 18px calc(16px + env(safe-area-inset-bottom, 0px)); text-align: center; background: var(--stock); border-top: 1px solid var(--rule);
  border-radius: 15px 15px 0 0; box-shadow: 0 -16px 34px -14px var(--shadow-2); animation: rvlUp .26s cubic-bezier(.2, .9, .3, 1); }
.jor-sheet-pic { width: min(230px, 62%); aspect-ratio: 3 / 2; margin-top: -40px; overflow: hidden; border-radius: 3px; transform: rotate(-1.4deg);
  background: #EFE6CF; box-shadow: 0 0 0 5px #F4ECD8, 0 0 0 6px rgba(107, 74, 34, .3), 0 8px 18px rgba(0, 0, 0, .35); }
.jor-sheet-pic > svg { display: block; width: 100%; height: 100%; }
.jor-sheet-k { margin-top: 8px; font: 700 9.5px/1 var(--font-s); letter-spacing: .2em; text-transform: uppercase; color: var(--brass-ink, var(--brass)); }
.jor-sheet-n { font: italic 700 24px/1.12 var(--font-d); letter-spacing: -.01em; color: var(--ink); }

/* ═══ RETRATO DE ÉPOCA — eight questions on slips, then a portrait in a gilt frame ═══ */
.ret-pg { gap: 10px; }

  background: linear-gradient(135deg, #E8CF8A, #B8862F 45%, #7A5420); box-shadow: 0 8px 18px rgba(60, 30, 5, .35), inset 0 0 0 3px rgba(255, 240, 200, .35); }

.ret-k { flex: none; text-align: center; font: 700 9.5px/1 var(--font-s); letter-spacing: .2em; text-transform: uppercase; color: var(--brass-ink, var(--brass)); }
.ret-q { flex: none; text-align: center; font-size: clamp(23px, 3.4vh, 30px); line-height: 1.15; margin: 2px 6px 4px; text-wrap: balance; }
.ret-opts { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.ret-opt { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border: 0; cursor: pointer; text-align: left; color: var(--ink);
  background: var(--at-card-img) center / 100% 100% no-repeat; transition: transform .14s; animation: ret-in .4s cubic-bezier(.2, 1.2, .4, 1) both; }

.ret-e { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%;
  font: 26px/1 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
  background: radial-gradient(circle at 50% 40%, #FFFDF5, #EFE3C6 72%); box-shadow: 0 0 0 1.5px rgba(107, 74, 34, .45); }
.ret-t { font: 600 clamp(14.5px, 2.1vh, 17px)/1.25 var(--font-d); letter-spacing: -.005em; }
.ret-back { flex: none; align-self: center; }
/* the result: the portrait big and a little askew, the kind on a ribbon of its colour, the six kinds as bars */
.ret-res { gap: 7px; padding: 18px 18px 14px !important; }
.ret-res-k { font: 700 9.5px/1 var(--font-s); letter-spacing: .22em; text-transform: uppercase; color: var(--brass-ink, var(--brass)); }
.ret-portrait { width: clamp(132px, 23vh, 196px); transform: rotate(-2.5deg); animation: ret-unveil .9s cubic-bezier(.2, .9, .3, 1) both; }

  color: #F6EBD8; background: var(--kc); clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 50%, 100% 100%, 0 100%, 9px 50%);
  animation: end-ribbon .5s cubic-bezier(.2, 1.2, .4, 1) .5s both; }

/* ═══ A GAZETA DO SEU DIA — a front page of the past: masthead between rules, a headline with its picture, two columns, the small ads ═══ */
.gz-fold { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; color: #F3EAD3; background: #2A2420; transform: rotate(-8deg);
  box-shadow: 0 6px 14px rgba(0, 0, 0, .3); }

.gz-sel select { appearance: none; -webkit-appearance: none; padding: 11px 34px 11px 14px; border-radius: 4px; border: 0; cursor: pointer;
  font: 600 18px/1 var(--font-d); color: var(--ink); background: var(--at-card-img) center / 100% 100% no-repeat;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%), var(--at-card-img);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%, center; background-size: 5px 5px, 5px 5px, 100% 100%; background-repeat: no-repeat; }
.gz-sel select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.gz-on { gap: 8px; }
.gz-paper { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 7px; padding: 12px 14px 12px; color: #1E1A16;
  background: radial-gradient(ellipse at 50% 30%, #F8F0DA, #EDE1C2 70%, #E0CFA6); box-shadow: 0 6px 18px rgba(0, 0, 0, .28), inset 0 0 30px rgba(120, 90, 40, .18);
  transform: rotate(-.6deg); }
.gz-paper.is-new { animation: gz-spin .95s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes gz-spin { from { transform: rotate(-740deg) scale(.06); opacity: 0; } 55% { opacity: 1; } to { transform: rotate(-.6deg) scale(1); } }
.gz-ears { flex: none; display: flex; justify-content: space-between; gap: 6px; margin-bottom: -4px;
  font: 700 7.5px/1.2 var(--font-s); letter-spacing: .14em; text-transform: uppercase; color: #5A4A36; }
.gz-mast { flex: none; text-align: center; padding-bottom: 5px; border-bottom: 3px double #1E1A16; }
.gz-mast h1 { margin: 0; text-align: center; white-space: nowrap; font: italic 700 clamp(21px, 6.4vw, 30px)/1 var(--font-d); letter-spacing: -.01em; }
.gz-mast h1 span { font-style: normal; font-size: .62em; vertical-align: .18em; color: #7B1E1E; }
.gz-dateline { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 1px 0 5px; border-bottom: 1px solid #1E1A16;
  font: 700 9px/1.25 var(--font-s); letter-spacing: .1em; text-transform: uppercase; color: #5A4A36; }
.gz-dateline b { flex: none; font-size: 11px; color: #1E1A16; }
.gz-dateline span { text-align: right; }
.gz-lead { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 11px; align-items: start; padding-bottom: 7px; border-bottom: 1px solid #1E1A16; }
.gz-lead.gz-quiet { grid-template-columns: 1fr; }
.gz-pic { display: block; width: clamp(82px, 14vh, 128px); aspect-ratio: 4 / 5; overflow: hidden; box-shadow: 0 0 0 1.5px #1E1A16; background: #E6DABB; }
.gz-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; filter: grayscale(1) contrast(1.1) sepia(.28); mix-blend-mode: multiply; }
.gz-crest, .gz-orn { display: grid; place-items: center; padding: 8px; }
.gz-crest svg, .gz-orn svg { width: 100%; height: auto; filter: grayscale(1) sepia(.3); }
.gz-flag svg { width: 100%; height: 100%; filter: sepia(.45) saturate(.75); }
.gz-lead-t small { display: block; margin-bottom: 4px; font: 800 10px/1 var(--font-s); letter-spacing: .14em; text-transform: uppercase; color: #7B1E1E; }
.gz-lead-t h2, .gz-quiet h2 { margin: 0; font: 700 clamp(17px, 2.6vh, 23px)/1.14 var(--font-d); letter-spacing: -.012em; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }

.gz-col + .gz-col { padding-left: 12px; border-left: 1px solid rgba(30, 26, 22, .55); }
.gz-col h3 { margin: 0 0 5px; padding-bottom: 3px; border-bottom: 1px solid rgba(30, 26, 22, .55); font: 800 9px/1.2 var(--font-s); letter-spacing: .16em; text-transform: uppercase; }
.gz-col p { margin: 0 0 6px; font: 500 12px/1.28 var(--font-d); color: #2B241C; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.gz-col p b { font: 800 10px/1 var(--font-s); color: #7B1E1E; margin-right: 2px; }

.gz-born-pic { flex: none; width: 34px; height: 40px; overflow: hidden; box-shadow: 0 0 0 1px #1E1A16; }
.gz-born-pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; filter: grayscale(1) sepia(.28); }
.gz-born b { display: block; font: 700 12.5px/1.15 var(--font-d) !important; color: #1E1A16 !important; margin: 0 !important; }
.gz-born small { font: 700 9.5px/1 var(--font-s); color: #5A4A36; }

.gz-riddle { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; text-align: center; }
.gz-rb { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }

@media (max-height: 700px) {
