  }

  /* ── Figurinhas especiais ──
     Set by set, the way the album itself is sectioned, every card printed
     whether you hold it or not. A locked one still shows how far along you
     are: "58 / 108" is a reason to play one more round; "colecione 108
     figurinhas" is a wall. */
  /* One set to a page, turned like the álbum's — which is what these are: a
     sheet of figurinhas especiais. It used to be one long scroll, and on a
     360×640 phone that was 1,391px of it hidden below the fold. The sets were
     already the sections; they just had to become the pages. */
  if (sc === 'vitrine') return vitrineHtml();

  if (sc === 'medals') {
    const got  = new Set(earnedMedals().map(m => m.id));
    const sets = MEDAL_SETS.map(set => ({
      set, ms: set.ids.map(id => MEDALS.find(m => m.id === id)).filter(Boolean) }));
    insPage = Math.max(0, Math.min(insPage, sets.length - 1));
    const cur = sets[insPage];
    const n   = cur.ms.filter(m => got.has(m.id)).length;
    return `
    <div class="pg" style="gap:9px;">
      ${topbar(`Insígnias · ${got.size}/${MEDALS.length}`)}
      <div class="ins-sets" style="flex:1;min-height:0;">
        <section>
          <div class="ins-set-h"><span class="ins-set-t">${cur.set.n}</span>
            <span class="ins-set-n">${n} de ${cur.ms.length}</span></div>
          <div class="ins-grid">${cur.ms.map(m => medalCard(m, got.has(m.id))).join('')}</div>
        </section>
      </div>
      <div class="alb-foot">
        <button id="ins-prev" class="alb-arrow" ${insPage === 0 ? 'disabled' : ''}
          aria-label="Página anterior">${ICON.back('currentColor', 14)}</button>
        <div class="alb-foot-mid">
          <div class="alb-pips" aria-hidden="true">
            ${sets.map((s, i) => `<span class="alb-pip${i === insPage ? ' is-on' : ''}${
              s.ms.every(m => got.has(m.id)) ? ' is-full' : ''}"></span>`).join('')}
          </div>
          <span class="alb-folio">pág. ${insPage + 1} de ${sets.length} · ${cur.set.tag}</span>
        </div>
        <button id="ins-next" class="alb-arrow alb-fwd" ${insPage >= sets.length - 1 ? 'disabled' : ''}
          aria-label="Próxima página">${ICON.back('currentColor', 14)}</button>
      </div>
    </div>`;
  }

  /* ── Credits ── */
  if (sc === 'credits') {
    const pairs = {};
    Object.values(typeof CREDITS !== 'undefined' ? CREDITS : {}).forEach(c => {
      const k = (c.a || 'Desconhecido') + '||' + (c.l || '?');
      pairs[k] = (pairs[k] || 0) + 1;
    });
    const rows = Object.keys(pairs).sort().map(k => {
      const [a, l] = k.split('||');
      return `<div class="credit-row"><span style="flex:1;color:var(--ink-2);line-height:1.35;">${a}</span>
        <span class="l">${l}</span></div>`;
    }).join('');

    /* Every photo currently carries a credit, so this renders nothing. It
       stays as a guard: if a future photo lands without one, saying so beats
       an attribution list that quietly looks complete. */
    const unsourced = PL.filter(p => p.img && !CREDITS[p.img]).map(p => p.n);
    return `
    <div class="pg" style="gap:10px;">
      ${topbar('Créditos das imagens')}
      <!--@@credits@@-->
      <div class="note" style="font-size:11.5px;line-height:1.45;">
        <div style="font-weight:800;color:var(--brass);margin-bottom:3px;">App independente</div>
        Este quiz é um projeto educativo, sem vínculo, patrocínio ou aprovação de
        nenhum governo, museu, instituição ou marca. Os nomes de pessoas, povos e
        lugares são fatos históricos de domínio comum.
        Se você é titular de algum direito e quer que algo seja retirado, escreva
        para tiagor.reis@gmail.com — atendemos rápido.
      </div>
      <p class="small muted" style="font-size:11px;">
        As imagens vêm da <b style="color:var(--ink);">Wikimedia Commons</b> e são usadas sob
        licenças livres (CC / domínio público): bustos, pinturas, gravuras e
        fotografias de monumentos, impressas aqui em serigrafia.
        Obrigado a cada autor listado abaixo.<br><br>
        As bandeiras dos países foram desenhadas para este app. Os brasões dos
        estados e impérios são ilustrações próprias, feitas para identificá-los
        no jogo — não reproduzem nenhum símbolo oficial.
      </p>
      <!--@@/credits@@-->
      <!-- The cap was a flat 330px, from when the page never filled the sheet;
           on a tall phone that wasted half the screen. It has to stay a cap of
           some kind — #qz is only min-height:100dvh, so with no definite height
           to divide, a flex child cannot shrink and the list would push the
           footnote off the bottom — but measured against the screen it now
           grows with it. -->
      <div class="scroll-y" style="flex:1;background:var(--pocket);border:1px solid var(--rule-2);
        border-radius:11px;padding:8px 12px;max-height:${unsourced.length ? 46 : 58}vh;">${
        rows || '<span class="small muted">—</span>'}</div>
      ${unsourced.length ? `<div class="note">
        <div style="font-weight:800;color:var(--brass);margin-bottom:2px;">Fonte ainda não registrada</div>
        <div class="muted">${unsourced.join(', ')} — estamos rastreando a autoria dessas fotos.
          Se você é o autor, escreva para tiagor.reis@gmail.com.</div>
      </div>` : ''}
      <p class="small muted" style="font-size:9.5px;text-align:center;margin-top:auto;">Detalhes completos: commons.wikimedia.org</p>
    </div>`;
  }

  /* ── A carta especial, before it is played ───────────────────
     The rung is announced, not sprung: the clock does not start until the
     player turns the card over, because reading "Quem sou eu?" for the first
     time should not cost him the seconds he needs to answer it. */
  if (sc === 'card' && cat && cat.qs[qi] && cat.qs[qi]._special) {
    const k = SPECIAL[cat.qs[qi]._special];
    return `
    <div class="pg pg-center" style="padding:26px 22px;gap:15px;">
      <div class="eyebrow">Degrau ${rung + 1} de ${LADDER.length} ·
        <span class="brass num" style="font-weight:800;">${money(RUNG().v)}</span></div>
      <div class="spcard spcard-${cat.qs[qi]._special}">
        <span class="spcard-k">Carta especial</span>
        <span class="spcard-ic">${k.ic('currentColor', 32)}</span>
        <span class="spcard-n display"><em>${k.n}</em></span>
        <span class="spcard-s">${k.tag}</span>
      </div>
      <button id="bcardgo" class="btn btn-brass btn-lg">Virar a carta</button>
      <button id="bexit" class="btn btn-ghost btn-sm">Sair</button>
    </div>`;
  }

  /* ── Treino: fixed-length rounds, nothing at stake ── */
  if (sc === 'difficulty') return `
  <div class="pg" style="gap:10px;">
    ${topbar('Treino · escolha a dificuldade')}
    <div style="display:flex;flex-direction:column;gap:9px;flex:1;justify-content:center;">
      ${DIFFS.map(d => `
      <div class="dc dc-${d.key}" data-key="${d.key}" data-n="${d.n}">
        <span class="ic">${(ICON[d.ic] || ICON.star)('currentColor', 18)}</span>
        <div style="flex:1;min-width:0;">
          <div class="t">${d.label}</div>
          <div class="d">${d.desc}</div>
        </div>
        <div class="n num">${d.n}<small>perguntas</small>
          ${scores[d.key] !== undefined
            ? `<small style="color:${d.col};text-transform:none;letter-spacing:.02em;">recorde ${scores[d.key]} pts</small>` : ''}
        </div>
      </div>`).join('')}
    </div>
    <p class="small muted" style="font-size:10px;text-align:center;">Rodadas de treino: sem degraus, sem prêmio, só pontos</p>
  </div>`;

  /* ── How a ladder run ends ───────────────────────────────────
     Three different endings, and they should not look alike. Walking
     away with money is a win and gets the brass; falling to a
     checkpoint still pays, but quietly; going out with nothing is
     stated plainly rather than dressed up. */
  if (sc === 'end' && isMil) {
    const won     = banked >= LADDER[LADDER.length - 1].v;
    const cleared = rung;
    const tone    = won ? 'brass' : banked > 0 ? 'good' : 'bad';
    const head    = won     ? 'Um milhão!'
                  : cashed  ? 'Você parou a tempo'
                  : banked  ? 'Caiu, mas levou'
                  :           'Fim de jogo';
    const sub     = won
      ? 'Dezesseis perguntas, dezesseis acertos. Não dá pra ir mais longe.'
      : cashed
      ? 'Saiu com o dinheiro na mão — decisão de quem sabe a hora.'
      : banked
      ? `Errou a pergunta de ${money(LADDER[Math.min(rung, LADDER.length - 1)].v)} — o degrau garantido segurou.`
      : 'Escorregou antes do primeiro degrau garantido. Da próxima, considere parar.';

    return `
    <div class="pg pg-center scroll-y" style="padding:26px 22px;gap:9px;">
      <div class="eyebrow">Rumo ao Milhão · degrau ${cleared}/${LADDER.length}</div>
      ${banked > 0 ? `<div style="margin:2px 0 -2px;">${ART.trophy(58)}</div>` : ''}
      <div class="display ${tone}" style="font-size:30px;"><em>${head}</em></div>
      <div id="endcash" class="display prize-pop ${banked > 0 ? 'brass' : 'muted'}"
        data-to="${banked}"
        style="font-size:${banked >= 100000 ? 44 : 52}px;letter-spacing:-.03em;">${money(banked)}</div>
      <p class="small muted" style="max-width:290px;font-size:12px;">${sub}</p>

      <div class="rail" style="width:100%;max-width:300px;margin:6px 0;">
        ${LADDER.map((step, i) => `<span class="notch${i < rung ? ' notch-done' : ''}${step.safe ? ' notch-safe' : ''}"></span>`).join('')}
      </div>

      <div class="stats">
        <div><div class="v num">${nCorrect}</div><div class="k">Acertos</div></div>
        <div><div class="v num">${pts}</div><div class="k">Pontos</div></div>
        <div><div class="v num brass">${money(Math.max(milBest(), banked))}</div><div class="k">Recorde</div></div>
      </div>

      ${packStrip()}
      ${medalChips()}

      <div class="foot-row" style="margin-top:12px;">
        <button id="bshare"  class="btn btn-ghost btn-sm">Compartilhar</button>
        <button id="bmilrep" class="btn btn-brass">De novo</button>
        <button id="bhome"   class="btn btn-ghost btn-sm">Início</button>
      </div>
    </div>`;
  }

  /* ── End of a round ── */
  if (sc === 'end') {
    const total = cat.qs.length;
    const pct = Math.round(nCorrect / total * 100);
    const msg = pct >= 80 ? 'Mestre da História!' : pct >= 50 ? 'Muito bem!' : 'Hora de estudar!';
    const isRecord = scores[diffKey] !== undefined && pts === scores[diffKey] && pts > 0;
    const curDiff  = DIFFS.find(d => d.key === diffKey);
    return `
    <div class="pg pg-center" style="padding:28px 24px;gap:10px;">
      <span class="chip chip-soft" style="color:${curDiff.col};">
        ${isSurv ? `${ICON.shield('currentColor', 11)} Mata-mata · ${nCorrect} ${nCorrect === 1 ? 'acerto' : 'acertos'} seguidos`
                 : `${(ICON[curDiff.ic] || ICON.star)('currentColor', 11)} ${curDiff.label} · ${total} perguntas`}</span>
      ${pct >= 80 ? `<div class="end-trophy">${ART.trophy(52)}</div>` : ''}
      <div class="display" style="font-size:34px;margin-top:6px;"><em>${msg}</em></div>
      <div id="endpts" class="display num" style="font-size:64px;line-height:1;font-weight:600;"
        data-to="${pts}">${pts}</div>
      <div class="small muted">pontos · ${nCorrect}/${total} acertos (${pct}%)</div>
      ${bestStreak >= 3 ? `<div class="small" style="display:flex;gap:4px;align-items:center;color:var(--brass);font-weight:700;">
        ${ICON.flame('currentColor', 12)} melhor sequência: ${bestStreak}</div>` : ''}
      <div class="bar"><i style="width:${pct}%;"></i></div>
      ${isRecord ? `<span class="chip chip-brass">${ICON.star('currentColor', 11)} Novo recorde</span>` : ''}
      ${medalChips()}
      ${packStrip()}
      <div style="margin-top:6px;">${runlogEl()}</div>
      <div class="foot-row" style="margin-top:12px;">
        <button id="bshare" class="btn btn-ghost btn-sm">Compartilhar</button>
        <button id="brep"   class="btn btn-primary">Jogar de novo</button>
        <button id="bdiff"  class="btn btn-ghost btn-sm">Mudar dificuldade</button>
      </div>
    </div>`;
  }

  /* ── Quiz / Reveal ── */
  const q    = cat.qs[qi];
  const qcat = q._cat || cat;
  const tpct = (tLeft / tMax) * 100;
  const tcls = tLeft <= 5 ? 't-bad' : tLeft <= 10 ? 't-warn' : isMil ? 't-brass' : '';
  const armed = sc === 'quiz';

  /* a citação, a batalha, a linhagem or a manchete is the question's picture */
  const art = hasStrip(q) ? '' : questionArt(q);

  const scoreChanged = pts !== prevPts;

  /* the rail: sixteen notches, one per rung, checkpoints picked out */
  const prizeRail = !isMil ? '' : `
    <div class="rail">${LADDER.map((step, i) => `<span class="notch${
      i < rung ? ' notch-done' : ''}${step.safe ? ' notch-safe' : ''}${i === rung ? ' notch-now' : ''}"></span>`).join('')}</div>`;

  /* what this question is worth, and what you keep if it goes wrong */
  const stakes = !isMil ? '' : `
    <div class="stakes">
      <div style="min-width:0;">
        <div class="eyebrow">Pergunta ${rung + 1} de ${LADDER.length}${isFinal() ? ' · a última' : ''}</div>
        <div class="stakes-v prize-pop">${money(RUNG().v)}</div>
      </div>
      <button id="bladder" class="safe-box">
        <div>
          <div class="k">Garantido</div>
          <div class="v num ${safetyNet() ? 'good' : 'muted'}">${safetyNet() ? money(safetyNet()) : '—'}</div>
        </div>
        ${ICON.ladder('var(--ink-3)', 14)}
      </button>
    </div>`;

  const expertBox = !(expert && armed) ? '' : `
    <div class="expert-box">
      ${ICON.mic('var(--brass)', 15)}
      <p><em>${expert.line}</em> <b>${expert.name}</b>${expert.sure ? '' : ' <em>— mas é chute, hein.</em>'}</p>
    </div>`;

  /* Five different things to spend, and they used to look like five identical
     grey pills. Each carries its own colour now — the same colour the game
     already uses for what it does: the cut is the red of a wrong answer, the
     freeze is the cold of the clock running out, the skip is the pitch green
     of moving on. The tint only shows while the lifeline is still yours. */
  const narrowing = !q.order;
  const ajudas = [
    ['bhalf',   'Cortar',    ICON.cut,   narrowing && lifes.half && cutCount() >= 1, 'cut'],
    ['bpoll',   'Placar',    ICON.crowd, narrowing && lifes.poll,                    'poll'],
    ['bexpert', 'Convidado', ICON.mic,   narrowing && lifes.expert,                  'mic'],
    ['bfreeze', 'Congelar',  ICON.snow,  lifes.freeze,                               'snow'],
    ['bskip',   'Pular',     ICON.skip,  lifes.skip,                                 'skip'],
  ];

  const progress = isMil ? '' : `
    <div class="pdots${cat.qs.length > 10 ? ' pdots-dense' : ''}">
      ${cat.qs.length <= 20 ? cat.qs.map((_, i) => {
          const cls = i < runLog.length ? (runLog[i] === 3 ? 'pdot pdot-on'
                    : runLog[i] === 0 ? 'pdot pdot-miss' : 'pdot pdot-on')
                    : (i === qi ? 'pdot pdot-cur' : 'pdot');
          return `<span class="${cls}"></span>`;
        }).join('')
      : `<span class="small muted num">${qi + 1}/${cat.qs.length}</span>`}
    </div>`;

  return `
  <div class="pg qz-screen${introOn ? ' intro' : ''}${justCut ? ' cut-now' : ''}" style="padding:13px;gap:9px;position:relative;">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div style="display:flex;align-items:center;gap:7px;min-width:0;">
        <button id="bexit" class="btn btn-ghost btn-icon" aria-label="Sair">${ICON.close('currentColor', 12)}</button>
        <span class="chip">${catIcon(qcat)}<span>${qcat.name}</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        ${streak > 1 ? `<span class="chip chip-brass streak-chip${
          introOn ? ' streak-up' : ''}" style="padding:2px 8px;">${
          ICON.flame('currentColor', 11)}${streak}x</span>` : ''}
        ${progress}
        ${isMil
          ? `<div class="clock ${tLeft <= 5 ? 'timer-low' : ''}">${ICON.clock('currentColor', 13)}
               <span id="clock-n" class="v num">${tLeft}</span></div>`
          : `<div id="score-disp" class="score ${scoreChanged ? 'score-up' : ''}">${
               sc === 'reveal' && lastGain > 0 ? `<span class="gain">+${lastGain}</span>` : ''}
               <span class="v num">${pts}</span><span class="u">pts</span></div>`}
      </div>
    </div>

    ${prizeRail}
    ${stakes}

    <div class="timer"><i id="tf" class="${tcls}${tLeft <= 5 ? ' timer-low' : ''}" style="width:${tpct}%;"></i></div>

    ${q.clues ? `
    <div class="qcard qcard-clue">
      <div class="clue-head">${art || ''}<p class="clue-title">Quem sou eu?</p></div>
      <ol class="clues">${q.clues.slice(0, q._shown || 1).map((c, i) =>
        `<li style="animation-delay:${i * 50}ms">${c}</li>`).join('')}</ol>
      ${armed && (q._shown || 1) < q.clues.length
        ? `<button id="bclue" class="btn btn-ghost btn-sm clue-more">+ pista <span class="small muted">−${CLUE_COST} seg.</span></button>` : ''}
    </div>` : `
    <div class="qcard${isMil ? ' qcard-brass' : ''}${hasStrip(q) ? ' qcard-strip' : ''}">
      ${art}
      <p>${q.t}</p>
      ${qStrip(q)}
    </div>`}

    ${expertBox}

    <div class="board ${q.order ? 'board-ord' : isTextQ(q)
        ? 'board-2' + (disp.length > 6 ? ' board-2-tight' : '')
        : disp.length <= 4 ? 'board-big' : 'board-5'}${q.duel && disp.length === 2 ? ' board-duel' : ''}">
      ${disp.map((c, i) => badge(c, i)).join('')}
      ${q.duel && disp.length === 2 && !q.myth ? '<span class="duel-vs" aria-hidden="true">VS</span>' : ''}
    </div>

    ${armed ? `
    <div class="foot">
      <div class="ajudas">
        ${ajudas.map(([id, lbl, ic, on, kind]) => `
          <button id="${id}" ${on ? '' : 'disabled'} class="ajuda aj-${kind}${
            on ? '' : ' aj-spent'}${firedAid === id ? ' aj-firing' : ''}">
            <span class="aj-disc">${ic('currentColor', 15)}</span>
            <span class="aj-lbl">${lbl}</span></button>`).join('')}
      </div>
      ${frozen ? `<div class="small pitch" style="font-weight:700;display:flex;align-items:center;gap:4px;">
        ${ICON.snow('currentColor', 11)} Relógio parado nesta pergunta</div>` : ''}
      <p class="footer-hint">
        ${q.order ? 'Toque na ordem: do mais antigo para o mais recente'
          : q.myth ? 'Fato ou mito? Carimbe a sua resposta'
          : q.duel ? 'Só dois na disputa: escolha um'
          : q.type === 'txt'
          ? (q.a.length > 1 ? `Marque as ${q.a.length} respostas certas` : 'Marque a resposta certa')
          : q.type === 'player'
          ? (q.a.length > 1 ? `Marque os ${q.a.length} personagens certos` : 'Marque o personagem certo')
          : (q.a.length > 1 ? `Marque os ${q.a.length} estados certos`     : 'Marque o estado certo')}</p>
      <div class="foot-row">
        <button id="bconf" ${(q.order ? sel.size === q.order.length : sel.size > 0) ? '' : 'disabled'} class="btn ${
          isMil ? 'btn-brass' : 'btn-primary'} btn-lg${sel.size ? ' is-armed' : ''}">
          ${q.order ? 'Confirmar ordem' : sel.size && q.type === 'player' ? 'Colar figurinha' : 'Confirmar'}</button>
        ${isMil && rung > 0 ? `
        <button id="bstop" class="btn btn-ghost btn-sm">${ICON.stop('currentColor', 13)} Parar · ${money(LADDER[rung - 1].v)}</button>` : ''}
      </div>
    </div>`
    : sc === 'ask' ? `
    <div class="pg-center" style="display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:4px;">
      <div class="display brass" style="font-size:22px;text-align:center;"><em>Essa é a sua resposta final?</em></div>
      <p class="small muted" style="text-align:center;max-width:300px;">
        Está valendo <b class="brass">${money(RUNG().v)}</b>. Se errar, você sai com ${money(safetyNet())}.</p>
      <div class="foot-row">
        <button id="bfinal"  class="btn btn-brass">É essa</button>
        <button id="bunlock" class="btn btn-ghost btn-sm">Deixa eu pensar</button>
      </div>
    </div>`
    : sc === 'lock' ? `
    <div class="settling">
      <span class="settle-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="small muted">${isMil ? money(RUNG().v) + ' na mesa…' : ''}</span>
    </div>`
    : `<div id="rvl" class="rvl-sheet"></div>`}

    ${(sc === 'ask' || sc === 'lock' || sc === 'reveal') ? '<div class="stage-dark"></div>' : ''}
    ${ladderOpen ? ladderOverlay() : ''}
  </div>`;
}

/* ── The full ladder, as a sheet over the board ──────────────────
   Opening it stops the clock: checking where you stand is not
   something the player should have to pay for in seconds. */
function ladderOverlay() {
  return `
  <div class="sheet">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="eyebrow" style="color:var(--brass);">A escada do milhão</span>
      <button id="bladderclose" class="btn btn-ghost btn-icon" aria-label="Fechar">${ICON.close('currentColor', 13)}</button>
    </div>
    <div class="scroll-y" style="flex:1;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:2px;">
      ${LADDER.map((step, i) => {
        const state = i < rung ? 'rung-done' : i === rung ? 'rung-now' : step.safe ? 'rung-safe' : '';
        const top = i === LADDER.length - 1 ? ' rung-top' : '';
        return `<div class="rung ${state}${top}">
          <span class="rung-n">${i + 1}</span>
          ${step.safe ? ICON.shield(i < rung ? 'var(--good)' : 'var(--ink-4)', 11) : '<span style="width:11px;"></span>'}
          <span style="flex:1;">${money(step.v)}</span>
          ${i < rung ? ICON.check('var(--good)', 12) : ''}
        </div>`;
      }).join('')}
    </div>
    <p class="small muted" style="font-size:10px;text-align:center;">
      ${ICON.shield('var(--ink-3)', 10)} são os degraus garantidos —
      passou de um, esse dinheiro é seu aconteça o que acontecer.</p>
  </div>`;
}


/* ═══════════════════════════════════════════════════
   FX — paint that moves

   Everything here is paint, like the rest of the app: a right answer
   splashes green watercolour from its slip and throws droplets, the points
   rise off it in gold, a streak warms the edges of the page, a wrong one
   bleeds red. All of it lives on one fixed layer above the screen (the
   screen re-renders on every tap, the layer does not), is made of the same
   dab mask as the icons, and is skipped when the phone asks for less motion.
═══════════════════════════════════════════════════ */
let _fxEnd = 0;
const FX_STILL = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const fx = {
  /* two layers: paint that splashes goes *under* the board (inside the page,
     beneath the screen), so it blooms around a slip instead of over its
     words; lettering and light go over everything */
  layer(under) {
    const id = under ? 'fx-u' : 'fx';
    let l = document.getElementById(id);
    if (!l) {
      l = document.createElement('div'); l.id = id; l.setAttribute('aria-hidden', 'true');
      (under && document.getElementById('qz') || document.body).appendChild(l);
    }
    return l;
  },
  add(cls, css, life, under) {
    const e = document.createElement('i');
    e.className = cls; e.style.cssText = css;
    this.layer(under).appendChild(e);
    setTimeout(() => e.remove(), life || 1400);
    return e;
  },
  centre(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; },
  /* a splash of watercolour: one bloom behind, droplets thrown out */
  splash(el, col, n) {
    if (FX_STILL || !el) return;
    const c = this.centre(el), sz = Math.max(c.w, c.h) * 1.15;
    this.add('fx-bloom', `left:${c.x}px;top:${c.y}px;width:${sz}px;height:${sz}px;--c:${col};--r:${(Math.random() * 360) | 0}deg`, 1300, true);
    for (let i = 0; i < (n || 12); i++) {
      const a = Math.random() * Math.PI * 2, d = sz * (.45 + Math.random() * .55), s = 5 + Math.random() * 11;
      this.add('fx-drop', `left:${c.x}px;top:${c.y}px;width:${s}px;height:${s}px;--c:${col};` +
        `--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d * .8).toFixed(0)}px;` +
        `animation-delay:${(Math.random() * .08).toFixed(2)}s`, 1100, true);
    }
  },
  /* the points lift off the slip in gold lettering */
  float(el, txt, col) {
    if (!el) return;
    const c = this.centre(el);
    this.add('fx-float', `left:${c.x}px;top:${c.y - c.h * .2}px;--c:${col || '#E0B968'}`, 1500).textContent = txt;
  },
  /* the page's edges warm (a streak) or bleed (a fall) */
  edge(col, strong) { if (!FX_STILL) this.add('fx-edge', `--c:${col};--o:${strong ? .55 : .3}`, 1600); },
  /* a ring of water where a finger touched a slip */
  ripple(x, y) { if (!FX_STILL) this.add('fx-ripple', `left:${x}px;top:${y}px`, 700); },
  /* a shower of paint flecks from the top of the page */
  rain(n, cols) {
    if (FX_STILL) return;
    cols = cols || ['#E0B968', '#C79A4E', '#3A9C6E', '#F3EEDE', '#B3402F'];
    for (let i = 0; i < n; i++) {
      const s = 7 + Math.random() * 12;
      this.add('fx-fleck', `left:${(Math.random() * 100).toFixed(1)}vw;width:${s}px;height:${s * (.6 + Math.random() * .8)}px;` +
        `--c:${cols[(Math.random() * cols.length) | 0]};--dx:${((Math.random() - .5) * 160).toFixed(0)}px;` +
        `--rot:${((Math.random() * 720) + 180).toFixed(0)}deg;animation-duration:${(2.2 + Math.random() * 1.6).toFixed(2)}s;` +
        `animation-delay:${(Math.random() * .7).toFixed(2)}s`, 4800);
    }
  },
};
/* after the board turns over: what the answer looks like */
function fxReveal(p, gain, k, big) {
  requestAnimationFrame(() => {
    const ok = [...document.querySelectorAll('#ct .b-correct')];
    const bad = [...document.querySelectorAll('#ct .b-wrong')];
    if (p === 3) {
      ok.forEach(el => { fx.splash(el, '#3A9C6E', 10 + Math.min(k, 6) * 2); el.classList.add('fx-stamp'); });
      if (ok[0] && gain) fx.float(ok[0], '+' + gain);
      if (k >= 3) { fx.edge('#E0B968', k >= 5); ok.forEach(el => fx.splash(el, '#E0B968', 6)); }
      if (big) fx.rain(70);
    } else {
      bad.forEach(el => fx.splash(el, p === 1 ? '#C79A4E' : '#B3402F', 7));
      ok.forEach(el => el.classList.add('fx-stamp'));
      if (p === 0) fx.edge('#B3402F', false);
      if (p === 1 && ok[0] && gain) fx.float(ok[0], '+' + gain, '#C79A4E');
    }
  });
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('#ct .b, #ct .cv-row, #ct .btn-brass, #ct .btn-primary');
  if (b) fx.ripple(e.clientX, e.clientY);
}, { passive: true });

/* ── A shower of paper, only for the million ── */
function burst(n) {
  /* the paper confetti is paint now, like everything else */
  if (typeof fx !== 'undefined') return fx.rain(n * 2);
  const cols = ['var(--brass)', 'var(--pitch)', 'var(--ink)', 'var(--pocket)'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'conf';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.background = cols[(Math.random() * cols.length) | 0];
    d.style.setProperty('--dx', ((Math.random() * 160) - 80).toFixed(0) + 'px');
    d.style.setProperty('--rot', ((Math.random() * 900) + 360).toFixed(0) + 'deg');
    d.style.animationDuration = (2.2 + Math.random() * 1.5).toFixed(2) + 's';
    d.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    frag.appendChild(d);
  }
  document.body.appendChild(frag);
  setTimeout(() => document.querySelectorAll('.conf').forEach(e => e.remove()), 4500);
}

/* ═══════════════════════════════════════════════════
   RENDER + EVENT BINDING
═══════════════════════════════════════════════════ */
/* Every tap on a tile re-renders the whole screen, which replayed the board's
   deal-in and the question card's entrance from the top — the board reshuffled
   itself visually each time you changed your mind. The entrances belong to a
   new question, not to a repaint, so they run only when the question changed. */
let _qKey = null;
let introOn = true;
let justCut = false;
let firedAid = null;   // the lifeline spent on this render, so it can flare once
let gameN   = 0;   // bumped when a run starts, so two runs' question 0 differ
let _lastSc = null;
/* Whether this render is a move to a different screen rather than a repaint of
   the one already showing. go() works it out, and html() reads it to decide
   whether the album should jump to a freshly-earned sticker — so it cannot be
   a local of go(): html() is called by go() but not written inside it, and a
   const in go() is not in html()'s scope. It was one, and the album threw
   "movedScreen is not defined" for anyone who had just earned a figurinha. */
let movedScreen = false;
/* which section of the album is open, and which spread within it */
let albCtry = null;
let albPage = 0;
let albTurning = null;   // 'fwd' | 'back', consumed by the next render
let medalFocus = null;   // the figurinha especial tapped on home, found on arrival
let insPage = 0;         // which sheet of insígnias is open

function go() {
  /* Only the board itself gets an entrance, and only when the question under
     it changed. Locking in an answer (ask/lock) and the reveal are the same
     question still on screen — re-dealing the tiles there would undo the very
     thing the lock screen is doing. gameN separates two runs that both open on
     question zero. */
  const qk = `${gameN}:${qi}`;
  introOn = sc === 'quiz' && qk !== _qKey;
  if (sc === 'quiz') _qKey = qk;

  const ct = document.getElementById('ct');
  document.body.classList.toggle('at-home', sc === 'home');
  movedScreen = sc !== _lastSc;
  _lastSc = sc;
  if (ct) ct.classList.toggle('screen-in', movedScreen);

  prevPts = pts; // snapshot before render (score-up only fires once)
  document.getElementById('ct').innerHTML = html();
  prevPts = pts; // prevent re-fire on subsequent re-renders without score change
  /* a question dealt in one of history's own formats arrives with its sound */
  if (introOn && sc === 'quiz') try { stripFx(cat.qs[qi]); } catch (e) {}

  justCut = false;   // consumed by the render above
  firedAid = null;
  albTurning = null;

  const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);

  /* ── home ── */
  on('mil-btn',     () => { snd.rung();   startMilhao(); });
  on('cta-btn',     () => { snd.swipe();  sc = 'difficulty'; go(); });
  on('daily-btn',   () => { snd.select(); startDaily(); });
  on('surv-btn',    () => { snd.select(); startSurvival(); });
  on('bcred',       () => { snd.swipe();  sc = 'credits'; go(); });
  on('bmed',        () => { snd.swipe();  sc = 'medals';  go(); });
  on('ins-prev',    () => { snd.page(); insPage = Math.max(0, insPage - 1); go(); });
  on('ins-next',    () => { snd.page(); insPage = Math.min(MEDAL_SETS.length - 1, insPage + 1); go(); });
  on('balb',        () => { snd.swipe();  sc = 'album';   go(); });
  on('bvit',        () => { snd.swipe();  sc = 'vitrine'; go(); });
  on('bvit2',       () => { snd.swipe();  sc = 'vitrine'; go(); });
  on('balbvit',     () => { snd.swipe();  sc = 'vitrine'; go(); });
  on('bwelc',       () => { snd.tap(); openWelcomePack(); });
  on('bpack',       () => { snd.tap(); openRunPack(); });
  if (sc === 'vitrine') wireVitrine();

  /* ── Opening the album on what you just won ──
     Two hundred and forty-eight pockets, and the three you just filled are
     somewhere among them. If the run earned anything, the album opens scrolled
     to the first of them rather than at Brazil's first page. Only on arrival:
     turning a card over must not yank the page around. */
  if (sc === 'album') {
    /* ── Turning a figurinha over ──
       Bound once on the sheet, not per card, and it toggles a class rather than
       re-rendering: a re-render would put every card face-up again mid-turn. */
    const turn = el => {
      const slot = el.closest && el.closest('.alb-turn');
      if (!slot) return;
      LS.set('albFlipped', true);
      const tabN = parseInt((slot.querySelector('.alb-n') || {}).textContent, 10) || 0;
      zoomCopy(slot, slot.dataset.fig, tabN);
    };
    const sheet = document.querySelector('.alb-sheet');
    if (sheet) {
      sheet.addEventListener('click', e => turn(e.target));
      sheet.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); turn(e.target); }
      });
    }

    /* ── Choosing a section ── */
    const tabs = document.getElementById('alb-tabs');
    if (tabs) tabs.addEventListener('click', e => {
      const b = e.target.closest && e.target.closest('.alb-tab');
      if (!b) return;
      if (b.dataset.ctry === albCtry) return;
      albCtry = b.dataset.ctry; albPage = 0;
      snd.swipe(); go();
    });

    /* ── Turning the page ──
       `albTurning` carries which way it went into the next render, so the
       new spread slides in from the side it was turned towards. */
    const flip = dir => {
      const old = document.querySelector('.alb-sheet');
      const ghost = old && !matchMedia('(prefers-reduced-motion: reduce)').matches
        ? old.cloneNode(true) : null;
      albTurning = dir > 0 ? 'fwd' : 'back';
      albPage += dir;
      snd.page();
      go();
      const fresh = document.querySelector('.alb-sheet');
      const bk = document.getElementById('alb-book');
      if (ghost && fresh && bk) {
        ghost.classList.remove('turn-fwd', 'turn-back');
        ghost.classList.add('alb-ghost', dir > 0 ? 'out-fwd' : 'out-back');
        ghost.style.top = fresh.offsetTop + 'px';
        ghost.style.height = fresh.offsetHeight + 'px';
        bk.appendChild(ghost);
        const drop = () => ghost.remove();
        ghost.addEventListener('animationend', drop);
        setTimeout(drop, 800);
      }
    };
    on('alb-prev', () => flip(-1));
    on('alb-next', () => flip(1));

    /* the arrow keys turn the page too — the album is read on a laptop as
       often as on a phone, and a book turns with the keys there */
    if (!window._albKeys) {
      window._albKeys = true;
      document.addEventListener('keydown', e => {
        if (sc !== 'album' || _zoom) return;
        if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
        const prev = document.getElementById('alb-prev');
        const next = document.getElementById('alb-next');
        if (e.key === 'ArrowLeft'  && prev && !prev.disabled) { e.preventDefault(); prev.click(); }
        if (e.key === 'ArrowRight' && next && !next.disabled) { e.preventDefault(); next.click(); }
      });
    }

    /* ── Turning it with a swipe ──
       Read as one gesture on release, the same as tapping an arrow — not
       driven frame by frame. A short or mostly-vertical move is a scroll
       and leaves the page alone. */
    const book = document.getElementById('alb-book');
    if (book) {
      let x0 = null, y0 = null;
      book.addEventListener('touchstart', e => {
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      }, { passive: true });
      book.addEventListener('touchend', e => {
        if (x0 === null) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - x0, dy = t.clientY - y0;
        x0 = null;
        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
        const btn = document.getElementById(dx < 0 ? 'alb-next' : 'alb-prev');
        if (btn && !btn.disabled) btn.click();
      }, { passive: true });
    }

    /* the index runs wider than the screen, so the section you are reading has
       to be brought under your thumb — otherwise opening on a fresh sticker
       from Uruguay leaves the strip sitting on Brazil */
    if (tabs) {
      const cur = tabs.querySelector('.alb-tab.is-on');
      if (cur) {
        const want = cur.offsetLeft - (tabs.clientWidth - cur.offsetWidth) / 2;
        const max  = tabs.scrollWidth - tabs.clientWidth;
        tabs.scrollLeft = Math.max(0, Math.min(want, max));
      }
      const edges = () => {
        tabs.classList.toggle('fade-l', tabs.scrollLeft > 4);
        tabs.classList.toggle('fade-r',
          tabs.scrollLeft + tabs.clientWidth < tabs.scrollWidth - 4);
      };
      tabs.addEventListener('scroll', edges, { passive: true });
      edges();
    }

    /* a fresh sticker is on the spread the album opened to; bring it into view
       inside the sheet rather than moving the whole page */
    if (runNewIds.length && movedScreen) {
      const first = document.querySelector('.alb-fresh');
      if (first && first.scrollIntoView) first.scrollIntoView({ block: 'nearest' });
    }
  }
  /* The strip stays a row of small symbols; tapping one opens the full
     screen on that symbol's card. */
  on('medal-strip', e => {
    const dot = e.target.closest && e.target.closest('.medal-dot');
    medalFocus = dot ? dot.dataset.medal : null;
    /* open on the sheet that symbol lives on, not on sheet one */
    if (medalFocus) {
      const s = MEDAL_SETS.findIndex(x => x.ids.includes(medalFocus));
      if (s >= 0) insPage = s;
    }
    snd.swipe(); sc = 'medals'; go();
  });
  /* the same held-up-to-the-light view for a figurinha especial: its back
     says what it asks for and how far along you are */
  if (sc === 'medals') {
    const sets = document.querySelector('.ins-sets');
    if (sets) sets.addEventListener('click', e => {
      const card = e.target.closest && e.target.closest('.ins');
      const m = card && MEDALS.find(x => x.id === card.dataset.medal);
      if (!m) return;
      const front = card.outerHTML.replace(' is-focus', '');
      openZoom(card, front, medalBack(m, card.classList.contains('is-on')));
    });
  }
  if (sc === 'medals' && medalFocus) {
    const card = document.querySelector(`.ins[data-medal="${medalFocus}"]`);
    medalFocus = null;
    if (card) { card.scrollIntoView({ block: 'center' }); card.classList.add('is-focus'); }
  }
  on('bmute',       () => { setMuted(!muted); snd.tap(); go(); });

  if (sc === 'end' && !window._celebrated) {
    // paper falls for the million and nothing else: the album is calm
    if (isMil && banked >= LADDER[LADDER.length - 1].v) { window._celebrated = true; burst(48); }
  }
  if (sc !== 'end') window._celebrated = false;

  /* ── run controls ── */
  on('bshare',  () => { snd.tap(); doShare(); });
  on('bhome',   () => { snd.swipe(); clearInterval(tmr); sc = 'home'; go(); });
  /* One more clue, and the clock pays for it. It used to say "−2 pts" and
     charge nothing at all; seconds are what a rung actually costs, and on the
     ladder there are no points to take away. */
  on('bclue',     () => {
    const q = cat.qs[qi];
    if (!q || !q.clues || (q._shown || 1) >= q.clues.length) return;
    q._shown = (q._shown || 1) + 1;
    tLeft = Math.max(4, tLeft - CLUE_COST);
    snd.select(); go();
  });
  /* the card is turned over: now the clock starts */
  on('bcardgo',   () => {
    snd.rung();
    sc = 'quiz'; tMax = qTime(); tLeft = tMax;
    startTmr(); go();
  });
  on('bexit',   () => { snd.swipe(); clearInterval(tmr); sc = isMil ? 'home' : 'difficulty'; go(); });
  on('bconf',   confirmAnswer);
  on('bfinal',  lockIn);
  on('bunlock', unlockAnswer);
  on('brep',    () => { snd.swipe(); startGame(); });
  on('bmilrep', () => { snd.rung();  startMilhao(); });
  if (sc === 'end' && _fxEnd) { const k = _fxEnd; _fxEnd = 0; setTimeout(() => fx.rain(k === 2 ? 90 : 34), 350); }
  on('bdiff',   () => { snd.swipe(); sc = 'difficulty'; go(); });
  on('bstop',   cashOut);

  /* ── the ajuda cards ── */
  on('bhalf',   useHalf);
  on('bpoll',   usePoll);
  on('bexpert', useExpert);
  on('bfreeze', useFreeze);
  on('bskip',   useSkip);

  /* ── the ladder sheet (opening it holds the clock) ── */
  on('bladder',      () => { ladderOpen = true;  snd.swipe(); go(); });
  on('bladderclose', () => { ladderOpen = false; snd.swipe(); go(); });

  document.querySelectorAll('.dc').forEach(d => d.addEventListener('click', () => {
    diffKey = d.dataset.key;
    numQs   = parseInt(d.dataset.n);
    snd.select();
    startGame();
  }));

  document.querySelectorAll('.b').forEach(b => b.addEventListener('click', () => {
    if (sc !== 'quiz') return;
    snd.tap();
    const id = b.dataset.id;
    sel.has(id) ? sel.delete(id) : sel.add(id);
    go();
  }));

  if (sc === 'reveal') {
    const rv = document.getElementById('rvl');
    if (rv && lastMsg) rv.innerHTML = lastMsg;
    if (rv && _adv && _adv.held) rv.classList.add('is-held');
    on('bnext', () => { snd.tap(); fireAdvance(); });
    const st = rv && rv.querySelector('.story');
    if (st) {
      st.addEventListener('click', () => { snd.tap(); holdAdvance(); });
      st.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); holdAdvance(); } });
    }
  }

  /* The final number is the one thing the whole run was for, and it simply
     appeared. It counts up instead — fast, under a second, easing out so the
     last few tick slowly. Reduced motion gets the number, not the climb.
     Two of these: points on a training round, reais on the ladder. */
  const endN = document.getElementById('endpts') || document.getElementById('endcash');
  if (endN && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const asMoney = endN.id === 'endcash';
    const show = v => endN.textContent = asMoney ? money(v) : String(v);
    const to = parseInt(endN.dataset.to, 10) || 0;
    if (to > 0) {
      /* the ladder's number is bigger and the moment is bigger, so it takes
         a little longer to arrive */
      const dur = asMoney ? 1250 : 900, t0 = performance.now();
      show(0);
      /* The true score must land whatever happens. requestAnimationFrame stops
         when the tab is backgrounded, so a player who looks away mid-count
         would come back to a number that is not their score. This timer is the
         guarantee; the animation is only the nice part. */
      const land = setTimeout(() => show(to), dur + 120);
      let lastTk = 0;
      const tick = now => {
        /* clamped at both ends: a rAF callback can carry a timestamp from
           before the one performance.now() handed back, and an unclamped k
           then runs the easing backwards into negative numbers. */
        const k = Math.max(0, Math.min(1, (now - t0) / dur));
        show(Math.round(to * (1 - Math.pow(1 - k, 3))));
        /* the counter clicks over like a scoreboard, climbing in pitch,
           slower as it slows; and lands with a chord and a stamp */
        if (k < 1 && now - lastTk > 55 + k * 120) { lastTk = now; snd.count(k); }
        if (k < 1) requestAnimationFrame(tick);
        else { clearTimeout(land); snd.land(); endN.classList.add('fx-stamp'); }
      };
      requestAnimationFrame(tick);
    }
  }

  fitScreen();
}

/* ═══════════════════════════════════════════════════
   NOTHING IN THIS APP SCROLLS

   Every screen is built to fit, and most of them do on their own. One does
   not: a board of ten pockets is sized by its width — four across, each one a
   photograph with a name under it — so on a 360×640 phone, under a prize rail
   and a question, it is genuinely taller than the glass. CSS cannot shrink it,
   because its height comes from a width it must keep to stay four across.

   So the board is measured after layout and scaled to whatever is left. A
   transform, not a font change: every proportion inside the card — the
   photograph, the name, the country band — is kept exactly, which is the
   point. The negative margin is what hands the reclaimed height back to the
   column; without it the box still occupies its old size and nothing is won.

   It only ever shrinks, never below a floor where a face stops being a face,
   and it resets before measuring so a re-render measures the real height
   rather than the last scaled one.
═══════════════════════════════════════════════════ */
const FIT_FLOOR = 0.66;

/* A figurinha's lettering is sized for the usual name. "ARGENTINA" in the
   band, "Argentinos Juniors" under the name, or "Maradona" on a narrow
   pocket did not fit: the band cut to "ARGENT…", the club to "Argentinos
   Ju…", and a long surname broke mid-word. Each line is measured after
   layout and, only if it overflows, stepped down until it fits — never
   below 55% of its size, so it stays a label and not a smudge. On the page
   (`minPx`) it also never goes below a size a phone can print: an album
   pocket is a thumbnail, its band can only ever hold "A…", and the zoom
   is where the whole word is read. */
let _fitCtx = null;
function fitFigText(root, minPx, rel) {
  if (!root) return;
  /* the widest thing that must sit on one line: the whole text where the
     line never wraps (the band, the club), else its longest word */
  const words = el => {
    const cs = getComputedStyle(el);
    _fitCtx = _fitCtx || document.createElement('canvas').getContext('2d');
    _fitCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const ls = parseFloat(cs.letterSpacing) || 0, up = cs.textTransform === 'uppercase';
    const txt = el.textContent.trim();
    return Math.max(0, ...(cs.whiteSpace === 'nowrap' ? [txt] : txt.split(/\s+/)).map(w => {
      const t = up ? w.toUpperCase() : w;
      return _fitCtx.measureText(t).width + ls * t.length;
    }));
  };
  root.querySelectorAll('.fig-band, .fig-nm, .fig-sub').forEach(el => {
    const room = el.clientWidth;
    if (!room || !el.textContent.trim()) return;
    const cs = getComputedStyle(el);
    const pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    const over = () => el.scrollWidth > room + 1 || el.scrollHeight > el.clientHeight + 1 ||
                       words(el) > room - pad;
    let f = parseFloat(cs.fontSize);
    const floor = Math.max(f * (rel === undefined ? 0.55 : rel), minPx || 0);
    for (let i = 0; i < 24 && f > floor && over(); i++) {
      f *= 0.93;
      el.style.fontSize = f.toFixed(2) + 'px';
    }
  });
}

/* measured before the web fonts arrived, a line may have been shrunk for the
   fallback's wider letters — refit it once the real ones are in */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  try {
    document.querySelectorAll('#ct .fig-band, #ct .fig-nm, #ct .fig-sub').forEach(el => { el.style.fontSize = ''; });
    fitFigText(document.getElementById('ct'), 5.5);
  } catch (e) {}
});

/* The glass as the phone reports it, not as CSS guesses it. The sheet is
   sized from 100dvh and the navigation-bar inset, and on most phones that is
   exactly the screen. Where it is not — a system font size, a browser that
   reports the inset differently — the page came out taller than the glass
   and the "Próxima" at the foot of a reveal had to be scrolled to. So the
   sheet is measured against the real viewport after layout, and only if it
   overhangs is it pinned to what is actually there. On a phone where it
   already fits this does nothing at all. */
function fitGlass() {
  const qz = document.getElementById('qz'), bd = document.body;
  if (!qz) return;
  qz.style.minHeight = qz.style.maxHeight = bd.style.minHeight = '';
  if (window.innerWidth >= 700) return;
  const de = document.documentElement;
  const overBy = () => Math.max(de.scrollHeight, bd.scrollHeight) - de.clientHeight;
  if (overBy() <= 1) return;
  /* The body is 100dvh tall too, and on a phone whose dvh is taller than
     its glass that alone overhangs — so it is held to the glass first, and
     the sheet gives up whatever is still left over. */
  bd.style.minHeight = de.clientHeight + 'px';
  const over = overBy();
  if (over <= 1) return;
  const h = Math.max(420, Math.floor(qz.getBoundingClientRect().height - over));
  qz.style.minHeight = qz.style.maxHeight = h + 'px';
}

/* The reveal sheet is pinned to the foot of the page and grows upward. With
   a long "Você sabia?", a figurinha and a large system font it can be taller
   than the page, and then its own top is lost. It is scaled down from the
   bottom until it fits under the top bar, so the verdict, the note and the
   button are all on the glass together. */
function fitSheet() {
  const rv = document.getElementById('rvl'), qz = document.getElementById('qz');
  if (!rv || !qz) return;
  rv.style.transform = '';
  const room = qz.clientHeight - 64, hh = rv.offsetHeight;
  if (hh <= room || hh < 1) return;
  rv.style.transformOrigin = 'bottom center';
  rv.style.transform = 'scale(' + Math.max(0.55, room / hh).toFixed(4) + ')';
}

/* The album page sizes its pockets to the sheet. Chrome resolves the
   sheet's cqh to 0 while the sheet takes its height from flex: 1, so the
   container-unit formula always fell to its 40px floor and every page was a
   small block of stamps in the middle of an empty sheet. The same formula,
   measured here instead. */
function fitAlbum() {
  const sh = document.querySelector('.alb-sheet'), g = sh && sh.querySelector('.alb-grid');
  if (!g) return;
  const cs = getComputedStyle(sh);
  const w = sh.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = sh.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (w < 1 || h < 1) return;
  const pw = Math.max(40, Math.min((w - 21) / 4, (h - 34) / 5 * .58));
  g.style.setProperty('--pw', pw.toFixed(2) + 'px');
  sh.classList.toggle('alb-short', h < 560);
  sh.classList.toggle('alb-tiny', h < 540);
}

function fitScreen() {
  try { fitAlbum(); } catch (e) {}
  try { fitFigText(document.getElementById('ct'), 5.5); } catch (e) {}
  try { fitGlass(); } catch (e) {}
  const pg = document.querySelector('#ct > .pg');
  if (!pg) return;
  try { fitSheet(); } catch (e) {}
  const board = pg.querySelector('.board');
  if (board) { board.style.transform = ''; board.style.marginBottom = ''; }

  /* How much does not fit. The sheet is capped to the viewport and clips, so
     the body can no longer grow — measuring the page alone would always read
     zero and the board would never be scaled, it would just be cut off. What
     counts is the screen's content against the frame it is drawn into. */
  const de = document.documentElement;
  const qz = document.getElementById('qz');
  let over = Math.max(de.scrollHeight, document.body.scrollHeight) - de.clientHeight;
  if (qz) over = Math.max(over, pg.scrollHeight - qz.clientHeight,
                                qz.scrollHeight - qz.clientHeight);
  if (over <= 1 || !board) return;

  const h = board.getBoundingClientRect().height;
  if (h < 80) return;
  const k = Math.max(FIT_FLOOR, (h - over) / h);
  board.style.transformOrigin = 'top center';
  board.style.transform = 'scale(' + k.toFixed(4) + ')';
  board.style.marginBottom = (-Math.round(h * (1 - k))) + 'px';
}

/* A phone that turns, or a keyboard that opens, changes the room available. */
window.addEventListener('resize', () => { try { fitScreen(); } catch (e) {} });

/* ═══════════════════════════════════════════════════

═══════════════════════════════════════════════════ */
function startGame() {
  isDaily = false; isSurv = false; isMil = false;
  /* Seeded even though nothing hands a seed in: it is what keeps the tiles of
     a question stable across a lifeline, and it costs nothing. */
  runSeed = (Math.random() * 2147483647) | 0;
  seedFrom(runSeed);
  cat = buildGame(diffKey);
  qi = 0; sel.clear(); pts = 0; prevPts = 0; streak = 0;
  nCorrect = 0; nPartial = 0; bestStreak = 0; lastGain = 0; runLog = []; runNew = 0; runNewIds = []; runPulls = []; runPackOpened = false; gameN++;
  resetLifes();
  sc = 'quiz'; tMax = qTime(); tLeft = tMax; lastMsg = '';
  disp = dealDisp(0);
  startTmr();
  go();
}

const pickN = (arr, n) => shuf(arr).slice(0, n);

/* The clues, cheapest first: when and where, what the figure did, the states
   they were tied to, and only at the end the epithet that all but names them. */
function whoClues(p) {
  const cl = [];
  cl.push(`Viveu no ${centTxt(p.era[0])} · ${POS_NAME[p.pos]}`);
  if (!NAT_SKIP.has(p.id) && CTRY_NAME[p.ctry]) cl.push(`Nasceu ${ctryEm(p.ctry)}`);

  if (pols.length) cl.push(`Ligado a: ${pols.join(', ')}`);
  const h = [];
  if (p.nb) h.push(p.nb === 1 ? 'Ganhou o Prêmio Nobel' : `Ganhou ${p.nb} Prêmios Nobel`);
  if (p.ev && p.ev.length) h.push(`Viveu ${EVENTS[p.ev[0]].n.replace(/^(.)/, c => c.toLowerCase())}`);
  const nmw = _fold(p.n).split(/[^a-z]+/).filter(w => w.length >= 5);
  if (p.nick && !nmw.some(w => _fold(p.nick).includes(w))) h.push(`Ficou conhecido como “${p.nick}”`);
  if (h.length) cl.push(h.join(' · '));
  return cl;
}
function buildWho(n) {
  const rich = PL.filter(p => p.img && p.era && (p.clubs || []).length >= 1 && p.nick);
  /* Half the cards come from the written clue sets — a story told in four
     steps reads better than a record read aloud — and half are built from
     the data, so every figure can still turn up. */
  const written = pickN(CATS.flatMap(c => c.qs.filter(q => q.clues && q.a && q.a.length === 1)), Math.ceil(n / 2))
    .map(q => ({ ...q, clues: q.clues.slice(), _shown: 1, _cat: GC_WHO }));
  const taken = new Set(written.map(q => q.a[0]));
  const qs = written.concat(pickN(rich.filter(p => !taken.has(p.id)), n - written.length).map(p => ({
    t: 'Quem sou eu?', type: 'player', a: [p.id], clues: whoClues(p), _shown: 1,
    opts: 6, strict: 1, _cat: GC_WHO, _noFlag: true, _hideCtry: true, _hideEra: true,
  })));
  return { id:'who', name:'Quem sou eu?', emoji:'🕵️', tag:'Pistas, uma de cada vez',
           col:'#7E57C2', diff:'Variado', qs };
}
