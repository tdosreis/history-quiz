/* ═══════════════════════════════════════════════════
   SMART DISTRACTOR ENGINE
   Wrong answers are scored for plausibility instead of
   being drawn at random, so harder levels really are harder.
═══════════════════════════════════════════════════ */
/* Seedable PRNG — when _seed is set the sequence is reproducible, which is
   what makes the Daily Challenge identical for every player. */
let _seed = null;
function rnd() {
  if (_seed === null) return Math.random();
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function seedFrom(n) { _seed = (n * 2654435761) | 0; }

function shuf(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* days since 2024-01-01 — the daily puzzle number */
function dayIndex(d) {
  const n = d || new Date();
  return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())
                     - Date.UTC(2024, 0, 1)) / 86400000);
}

function eraOverlap(a, b) {
  if (!a.era || !b.era) return 0;
  return Math.max(0, Math.min(a.era[1], b.era[1]) - Math.max(a.era[0], b.era[0]));
}

/* How confusable is `cand` with the correct player `ref`? 0-100 */
function simPlayer(cand, ref) {
  let sc = 0;
  if (cand.pos  === ref.pos)  sc += 38;           // same position
  if (cand.ctry === ref.ctry) sc += 22;           // same country
  sc += Math.min(26, eraOverlap(cand, ref) * 1.8); // contemporaries
  const shared = (cand.clubs || []).filter(c => (ref.clubs || []).includes(c)).length;
  sc += Math.min(14, shared * 7);                 // shared clubs
  return sc;
}

/* Years between two careers: 0 when they overlap, otherwise the gap. */
function eraGap(a, b) {
  if (!a.era || !b.era) return 99;
  if (eraOverlap(a, b) > 0) return 0;
  return Math.min(Math.abs(a.era[0] - b.era[1]), Math.abs(b.era[0] - a.era[1]));
}

/* Confusability between polities */
function simClub(cand, ref) {
  let sc = 0;
  if (cand.s === ref.s) sc += 42;                                          // same part of the world
  sc += Math.max(0, 22 - Math.abs((cand.f || 0) - (ref.f || 0)) / 40);   // founded around the same time
  if ((cand.e > 0) === (ref.e > 0)) sc += 20;                              // both gone / both still here
  if ((cand.f < 0) === (ref.f < 0)) sc += 16;                              // both ancient / both not
  return sc;
}

function yearCue(t) {

  for (const [w, code] of DEMONYM) if (t.indexOf(w) !== -1) { cues.ctry = code; break; }
  for (const [w, pos]  of POS_WORDS) if (t.indexOf(w) !== -1) { cues.pos = pos; break; }

/* ── Which questions may cross the generations ───────────────

   football question into a date-sorting exercise, and the answer stands
   out for being the only man of the right vintage. So only these are

const ALL_TIME = /(todos os tempos|toda a historia|da historia mundial|de todos|ao longo da historia)/;

/* Does this candidate fit every clue the question gives away? */
function cueFits(p, cues) {
  if (cues.ctry && p.ctry !== cues.ctry) return false;
  if (cues.pos  && p.pos  !== cues.pos)  return false;
  if (cues.year !== null && p.era && (p.era[0] > cues.year + 2 || p.era[1] < cues.year - 2)) return false;
  return true;
}

/* How well the candidate matches the clues, as a score to add to sim() */
function cueSim(p, cues) {
  let sc = 0;
  if (cues.ctry && p.ctry === cues.ctry) sc += 30;
  if (cues.pos  && p.pos  === cues.pos)  sc += 26;
  if (cues.year !== null && p.era) {
    const gap = p.era[0] > cues.year ? p.era[0] - cues.year
              : p.era[1] < cues.year ? cues.year - p.era[1] : 0;

  /* an ordering question deals its own cards, already shuffled */
  if (q.order) return q.order;
  if (q.type === 'txt') {
    return shuf((q.choices || []).map(c => ({ id: c, n: c })));
  }

  const isPlayer = q.type === 'player';
  /* A drawn card among nine photographs stands out and reads as a clue, so
     a player we only have a drawing of is never a wrong option — he appears
     when he is the answer. */
  const pool0 = isPlayer ? PL.filter(p => !DRAWN_FACES.has(p.id) || (q.a || []).includes(p.id)) : CL;
  const sim   = isPlayer ? simPlayer : simClub;
  const cfg   = DCFG();
  const strict = (q.strict !== undefined) ? q.strict : qStrict();
  const nOpts  = q.opts || cfg.opts;
  const cues   = isPlayer ? qCues(q) : { any: false };

  /* A tile is a figurinha, and a figurinha prints where the man is from and
     when he played. That is the album working — and, on the wrong question, a
     free answer. "Qual destes defendeu a seleção argentina?" is over the
     moment the band says ARGENTINA; "qual estreou nos anos 60?" is over when
     the band says 60, and again when eight tea-coloured cards sit beside one
     mint one, because the two printings split at the year 2000.
     So the cue the engine already reads for choosing distractors also decides
     what the card is allowed to show. Generators can set either flag directly
     when the giveaway is in the shape of the question rather than its words. */
  if (cues.ctry) { q._noFlag = true; q._hideCtry = true; }
  if (cues.year !== null && cues.year !== undefined) q._hideEra = true;

  // `fixed` = show exactly these tiles (comparison questions)
  if (q.fixed) return shuf(q.fixed.map(id => (isPlayer ? PL : CL).find(x => x.id === id)).filter(Boolean));

  const right = q.a.map(id => pool0.find(x => x.id === id)).filter(Boolean);

  // `pool` = explicit list of ids allowed as wrong answers
  let wrong;
  if (q.pool) {
    const allow = new Set(q.pool);
    wrong = pool0.filter(x => allow.has(x.id) && !q.a.includes(x.id));
  } else {
    const skip = new Set([...(q.excl || []), ...q.a]);
    wrong = pool0.filter(x => !skip.has(x.id));
  }

  const ref  = right[0];
  const need = nOpts - right.length;

  /* ── One board, one generation ──────────────────────────────
     Unless the question is explicitly about all of history, every wrong
     answer has to be a contemporary of the right one. This runs at every
     level, fácil included: a board that spans seventy years is not an
     easier question, it is a worse one, because the answer announces
     itself. Difficulty is carried by how tight the window is and by how
     much the position and the country have to match, below. */
  const generic = isPlayer ? qAllTime(q) : true;
  if (isPlayer && ref && ref.era && !generic && wrong.length > need + 2) {
    /* Not tighter than this at difícil: squeezing the era to a handful of
       candidates leaves the ranking no room to also match the position and
       the country, and the hard board ends up no harder than the moderate
       one — just narrower. */
    const win  = strict >= 0.9 ? 80 : strict >= 0.4 ? 120 : 200;
    let near = wrong.filter(x => eraGap(x, ref) <= win);
    // widen rather than give up, so a thin era still fills a board
    if (near.length < need + 2) near = wrong.filter(x => eraGap(x, ref) <= win * 2);
    if (near.length >= need + 2) wrong = near;
  }

  if (ref && wrong.length > need) {
    const jitter = 14 * (1 - strict) + 6;
    /* On a question that is not about all of history the nation and the
       shirt are part of what makes a board cohere, so they carry weight
       even at fácil — the level still differs, because `strict` scales
       everything else and the era window above is far wider. */
    const floor = generic ? strict : Math.max(strict, 0.3);
    const ranked = wrong
      .map(x => ({ x, s: sim(x, ref) * floor
                       + (isPlayer && !generic && x.ctry === ref.ctry ? 16 : 0)
                       + (isPlayer && !generic && (x.clubs || []).some(c => (ref.clubs || []).includes(c)) ? 10 : 0)
                       + (isPlayer ? cueSim(x, cues) : 0)
                       + rnd() * jitter }))
      .sort((a, b) => b.s - a.s)
      .map(o => o.x);
    // the plausible band: tighter as strictness rises, never below need+2
    const band   = Math.max(need + 2, Math.round(ranked.length * (1 - strict * 0.8)));
    const inBand = shuf(ranked.slice(0, band));
    let picks;

    /* Clues are honoured at every level — a share of the wrong answers must
       fit what the question just said, or the clue is a free pass. The share
       grows with the level: a third of the board on fácil, most of it on
       difícil, where the question is meant to be decided by knowledge alone. */
    if (cues.any) {
      const fits   = shuf(wrong.filter(x => cueFits(x, cues)));
      const quota  = Math.min(fits.length, Math.max(2, Math.round(need * (0.35 + 0.45 * strict))));
      const chosen = fits.slice(0, quota);
      const ids    = new Set(chosen.map(x => x.id));
      picks = chosen.concat(inBand.filter(x => !ids.has(x.id)));
      for (const x of ranked) {                       // top up if the band ran dry
        if (picks.length >= need) break;
        if (!ids.has(x.id) && picks.indexOf(x) === -1) picks.push(x);
      }
      picks = picks.slice(0, need);
    } else {
      picks = inBand.slice(0, need);
    }

    /* ── and one nationality, mostly ─────────────────────────────
       A board of ten Brazilians of the same decade is a real question;
       the same ten with a Norwegian and a Ghanaian dropped in is a
       spotting exercise. Half the board is held to the answer's own
       country whenever that many exist — the rest stay mixed, so it
       never becomes a lineup of one nation and one nation only. */
    if (isPlayer && !generic && ref) {
      const kin = ranked.filter(x => x.ctry === ref.ctry);
      const want = Math.min(kin.length, Math.round(need * (0.3 + 0.3 * strict)));
      if (want > 0) {
        const have = picks.filter(x => x.ctry === ref.ctry).length;
        if (have < want) {
          const add = kin.filter(x => !picks.some(pk => pk.id === x.id)).slice(0, want - have);
          // drop the least plausible outsiders to make room
          const outs = picks.filter(x => x.ctry !== ref.ctry);
          const keep = picks.filter(x => x.ctry === ref.ctry)
                            .concat(outs.slice(0, Math.max(0, outs.length - add.length)));
          picks = keep.concat(add).slice(0, need);
        }
      }
    }
    return shuf([...right, ...picks]);
  }

  wrong = shuf(wrong);
  return shuf([...right, ...wrong.slice(0, Math.max(0, need))]);
}

/* ═══════════════════════════════════════════════════
   QUESTION DIFFICULTY RATING
═══════════════════════════════════════════════════ */
/*@@tier-head@@*/
const FAMOUS = new Set(['napoleao','cleopatra','einstein','leonardo','cesar','alexandre','gandhi','newton','colombo',
  'cabral','tiradentes','dom_pedro_i','dom_pedro_ii','princesa_isabel','santos_dumont','churchill','mandela','mlk',
  'shakespeare','mozart','beethoven','marie_curie','darwin','galileu','lincoln','washington','zumbi','vasco_gama',
  'gengis','ramses_ii','tutancamon','picasso','van_gogh','freud','marx','lenin','che','fidel','kennedy','augusto',
  'nero','luis_xiv','michelangelo','joana_darc','socrates','platao','aristoteles','machado','getulio','anne_frank']);

/* How hard a question is, on a scale of five.
   The category sets the base; what moves it is the answer itself — a famous
   name is easier than an obscure one whatever the category, and being asked
   for two names is harder than being asked for one. */
function qTier(q) {
  return Math.max(1, Math.min(5, _qBase(q) + _qShift(q)));
}

function _qShift(q) {
  if (q.type !== 'player') return 0;
  const ans = (q.a || []).map(id => PL.find(x => x.id === id)).filter(Boolean);
  let shift = ans.length > 1 ? 1 : 0;        // "selecione os 2" is harder
  if (!ans.length) return shift;
  if (ans.some(p => FAMOUS.has(p.id))) return shift - 1;
  return shift;
}
/*@@/tier-head@@*/
function _qBase(q) {
  return q.d || 2;                           // every question carries its own tier
}

/* What a question is *about*, as a key: its answers, sorted. Two questions
   with the same answer are the same question as far as one round is concerned,
   however differently they are worded. */
/* "Fato" and "Mito" answer every myth: a myth is told apart by its claim */
const ansKey = q => q && q.myth ? 'myth:' + q.t : ((q && q.a) || []).slice().sort().join('|');

/* Text tiles: either the question asked for them (photo reveal, career path)
   or its answers are words rather than rows, which leaves nothing to draw. */
const isTextQ = q => !!(q && (q.textTiles || q.type === 'txt'));

/* The question's *shape* — its opening words with the variable parts
   stripped out. Two questions share a shape when they would feel like the
   same question asked twice, even though their text differs. */
function qShape(q) {
  return String(q.t || '')
    .replace(/\d+/g, '#')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 34)
    .toLowerCase();
}

function buildGame(key) {
  const cfg = DIFFS.find(d => d.key === key) || DIFFS[0];
  let all = CATS.flatMap(c => c.qs.map(q => ({ ...q, _cat: c })));
  if (typeof GEN_QS === 'function') all = all.concat(GEN_QS(cfg.tier));
  all.forEach(q => { q._d = qTier(q); });

  // prefer questions at the requested tier, then nearest tiers
  /* A written question outranks a generated one of the same tier.
     The generators produce roughly two questions for every one that was
     written by hand, so on weight alone a round came out 91% "qual destes
     jogadores…" — the hand-written ones, which are the ones with a story in
     them, almost never surfaced. The bonus is small enough that tier still
     decides first: it breaks ties, it does not override the ladder. */
  const written = q => !String((q._cat && q._cat.id) || '').startsWith('g_');
  const scored = shuf(all).map(q => ({
    q, w: -Math.abs(q._d - cfg.tier) * 10 + rnd() * 4 + (written(q) ? 5 : 0),
  }));
  scored.sort((a, b) => b.w - a.w);

  /* Fill the round greedily, but charge a price for repetition: the same
     category twice in a row, or a fourth "qual destes clubes foi fundado…",
     makes a round feel like a worksheet even when every question is fair.
     De-duplication by exact text is not enough — it is the *shape* that
     repeats, so questions are also bucketed by their opening words. */
  /* Two questions can be different sentences and still be the same question:
     "qual goleiro soviético é o único a ganhar a Bola de Ouro" and "qual
     goleiro é o único a ganhar a Bola de Ouro" are both Yashin, and a round
     that asked both looked broken. Text and shape were already de-duplicated;
     the answer is the third thing that must not repeat. */
  const seen  = new Set();
  const seenA = new Set();
  const byCat = {};
  const byShape = {};
  const qs = [];
  /* A thousand more written questions tipped the bonus above the other way:
     rounds came out entirely written, and the generated kinds — the photo,
     the career path, the odd one out — stopped appearing at all. Until about
     a third of the round is generated, a generated question of a near tier
     outranks a written one; tier still decides first. */
  const genTarget = Math.round(cfg.n * 0.3);
  let genN = 0;
  /* The same standing preference the ladder draws, for the same reason: the
     shape that wins a slot should not be the shape that wins it every round.
     Seeded, so the diário is still the same round for everybody that day. */
  const bias = {};
  const biasOf = k => (bias[k] !== undefined ? bias[k] : (bias[k] = (rnd() - 0.5) * 9));
  const PICK_MARGIN = 7;

  while (qs.length < cfg.n) {
    /* shortlist kept and pruned as we go — see the note in buildMilhao */
    let bestW = -1e9;
    let near = [];
    for (let i = 0; i < scored.length; i++) {
      const o = scored[i];
      if (!o || seen.has(o.q.t) || seenA.has(ansKey(o.q))) continue;
      const cid   = (o.q._cat && o.q._cat.id) || '?';
      const shape = qShape(o.q);
      const w = o.w
              + biasOf(shape)
              - (byCat[cid] || 0) * 6
              - (byShape[shape] || 0) * 14
              - (qs.length && ((qs[qs.length - 1]._cat || {}).id === cid) ? 9 : 0)
              - (qs.length && qShape(qs[qs.length - 1]) === shape ? 14 : 0)
              + (!written(o.q) && genN < genTarget ? 16 : 0);
      if (w > bestW) {
        bestW = w;
        near = near.filter(c => c.w >= bestW - PICK_MARGIN);
        near.push({ i, w });
      } else if (w >= bestW - PICK_MARGIN) {
        near.push({ i, w });
      }
    }
    if (!near.length) break;
    const bestI = near[Math.floor(rnd() * near.length)].i;
    const best = scored[bestI];
    scored[bestI] = null;
    seen.add(best.q.t);
    seenA.add(ansKey(best.q));
    const cid = (best.q._cat && best.q._cat.id) || '?';
    byCat[cid] = (byCat[cid] || 0) + 1;
    byShape[qShape(best.q)] = (byShape[qShape(best.q)] || 0) + 1;
    if (!written(best.q)) genN++;
    qs.push(best.q);
  }

  return {
    id: 'mixed', name: 'History Quiz', emoji: '📜',
    tag: 'Perguntas misturadas', col: '#FFD700', diff: cfg.label,
    qs: shuf(qs),
  };
}


/* ═══════════════════════════════════════════════════
   QUESTION GENERATORS
   Build fresh questions from the structured data so the
   pool never runs dry and distractors are correct by design.
═══════════════════════════════════════════════════ */
/*@@gen@@*/
function GEN_QS(tier) {
  /* GENCAT — badge shown in the quiz header for generated questions */
  const GC = {
    pol:   { id:'g_pol',   name:'Estados',      emoji:'🏛️', col:'#8A5A2B' },
    nat:   { id:'g_nat',   name:'Origens',      emoji:'🌍', col:'#42A5F5' },
    hist:  { id:'g_hist',  name:'Cronologia',   emoji:'📜', col:'#C8A400' },
    squad: { id:'g_squad', name:'Ligações',     emoji:'🔗', col:'#66BB6A' },
    era:   { id:'g_era',   name:'Época',        emoji:'⏳', col:'#FFA726' },
    path:  { id:'g_path',  name:'Caminhos',     emoji:'🔀', col:'#26C6DA' },
    event: { id:'g_event', name:'Grandes Eventos', emoji:'🌋', col:'#C0562E' },
    nobel: { id:'g_nobel', name:'Prêmio Nobel', emoji:'🏅', col:'#B8860B' },
    nick:  { id:'g_nick',  name:'Epítetos',     emoji:'🏷️', col:'#8E4E9E' },
    flag:  { id:'g_flag',  name:'Bandeiras',    emoji:'🚩', col:'#C0392B' },
    place: { id:'g_place', name:'Lugares',      emoji:'🗺️', col:'#3F6FB5' },
    count: { id:'g_count', name:'Datas',        emoji:'🔢', col:'#5C7F67' },
    duel:  { id:'g_duel',  name:'Duelo',        emoji:'🤺', col:'#5D4037' },
  };
  const out  = [];
  const rndOf = a => a[Math.floor(rnd() * a.length)];
  const pick = (a, n) => shuf(a).slice(0, n);
  const born = p => p.era[0];
  /* a century, as the album would print it: 'século XVIII', 'século V a.C.' */
  const cent = p => centTxt(born(p));
  const overlap = (p, ev) => p.era[0] <= ev.y[1] && p.era[1] >= ev.y[0];
  const natOk = p => !NAT_SKIP.has(p.id) && CTRY_NAME[p.ctry] && FLAGS[p.ctry];

  /* ── 1. Which state is tied to this figure? ── */
  pick(PL.filter(p => (p.clubs || []).length), 26).forEach(p => {
    const mine = p.clubs;
    out.push({
      t: `Qual destes estados está ligado a ${p.n}?`,
      a: [rndOf(mine)],
      pool: CL.filter(c => !mine.includes(c.id)).map(c => c.id),
      face: p.img, _cat: GC.pol,
      d: p.ctry === 'BRA' ? 2 : 3,
    });
  });

  /* ── 2. Birthplace ── */
  const byCtry = {};
  PL.filter(natOk).forEach(p => { (byCtry[p.ctry] = byCtry[p.ctry] || []).push(p); });
  Object.keys(byCtry).forEach(c => {
    const p = rndOf(byCtry[c]);
    out.push({
      t: `Qual destes personagens nasceu ${ctryEm(c)}?`,
      a: [p.id], type: 'player', flag: c,
      pool: PL.filter(x => x.ctry !== c).map(x => x.id), _cat: GC.nat,
      d: c === 'BRA' ? 1 : 2,
    });
  });

  /* ── 3. Oldest / youngest / longest-lived state (comparison, exact ten) ── */
  for (let i = 0; i < 4; i++) {
    const set = pick(CL, 10);
    const oldest = set.reduce((a, b) => (a.f <= b.f ? a : b));
    if (set.filter(c => c.f === oldest.f).length > 1) continue;
    out.push({ t: 'Qual destes estados surgiu primeiro?',
               a: [oldest.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 2 });
  }
  for (let i = 0; i < 4; i++) {
    const set = pick(CL, 10);
    const newest = set.reduce((a, b) => (a.f >= b.f ? a : b));
    if (set.filter(c => c.f === newest.f).length > 1) continue;
    out.push({ t: 'Qual destes estados é o mais recente — surgiu por último?',
               a: [newest.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 3 });
  }
  for (let i = 0; i < 4; i++) {
    const set = pick(CL.filter(c => c.e !== 0), 10);
    const len = c => c.e - c.f;
    const top = set.reduce((a, b) => (len(a) >= len(b) ? a : b));
    if (set.length < 10 || set.filter(c => len(c) === len(top)).length > 1) continue;
    out.push({ t: 'Qual destes estados durou mais tempo?',
               a: [top.id], fixed: set.map(c => c.id), _cat: GC.hist, d: 3 });
  }

  /* ── 4. Multi-select: states of the ancient world among the later ones ── */
  for (let i = 0; i < 3; i++) {
    const old = pick(CL.filter(c => c.f < 0), 3);
    const rest = pick(CL.filter(c => c.f >= 1000), 7);
    if (old.length < 3 || rest.length < 7) break;
    out.push({ t: 'Selecione os estados que já existiam antes de Cristo',
               a: old.map(c => c.id), fixed: old.concat(rest).map(c => c.id), _cat: GC.hist, d: 2 });
  }
  for (let i = 0; i < 3; i++) {
    const gone = pick(CL.filter(c => c.e !== 0), 3);
    const live = pick(CL.filter(c => c.e === 0), 7);
    if (gone.length < 3 || live.length < 7) break;
    out.push({ t: 'Selecione os estados que deixaram de existir',
               a: gone.map(c => c.id), fixed: gone.concat(live).map(c => c.id), _cat: GC.hist, d: 2 });
  }

  /* ── 5. Who else is tied to this state? ── */
  const polFigs = {};
  PL.forEach(p => (p.clubs || []).forEach(c => (polFigs[c] = polFigs[c] || []).push(p)));
  pick(Object.keys(polFigs).filter(c => polFigs[c].length >= 2), 7).forEach(c => {
    const yes = pick(polFigs[c], 2);
    const no  = PL.filter(p => !(p.clubs || []).includes(c));
    if (no.length < 8) return;
    out.push({
      t: `Selecione os 2 personagens ligados ${toClub(c)}`,
      a: yes.map(p => p.id), type: 'player',
      pool: no.map(p => p.id), crest: c, _cat: GC.squad, d: 3,
    });
  });
  pick(Object.keys(polFigs).filter(c => polFigs[c].length >= 3), 6).forEach(c => {
    const yes = rndOf(polFigs[c]);
    out.push({
      t: `Qual destes personagens está ligado ${toClub(c)}?`,
      a: [yes.id], type: 'player',
      pool: PL.filter(p => !(p.clubs || []).includes(c)).map(p => p.id), _cat: GC.squad,
      d: polFigs[c].length >= 6 ? 2 : 3,
    });
  });

  /* ── 6. Century of birth ── */
  pick(PL, 16).forEach(p => {
    const others = PL.filter(x => cent(x) !== cent(p));
    if (others.length < 9) return;
    out.push({
      t: `Qual destes personagens nasceu no ${cent(p)}?`,
      a: [p.id], type: 'player',
      pool: others.map(x => x.id), _cat: GC.era, d: 3,
    });
  });
  pick(PL, 12).forEach(p => {
    const mine = cent(p), key = centNum(born(p)) * (born(p) < 0 ? -1 : 1);
    const pool = [];
    for (let k = -8; k <= 21; k++) { if (k === 0) continue; const y = k < 0 ? (k + 1) * 100 - 50 : k * 100 - 50; pool.push(centTxt(y)); }
    const near = [...new Set(pool)].filter(c => c !== mine);
    const opts = pick(near.sort((a, b) => Math.abs(near.indexOf(a) - near.indexOf(mine)) - Math.abs(near.indexOf(b) - near.indexOf(mine)) + (rnd() - .5) * 4).slice(0, 9), 5);
    out.push({
      t: `Em que século nasceu ${p.n}?`, type: 'txt',
      choices: shuf([mine].concat(opts)), a: [mine], face: p.img, _cat: GC.count, d: 3,
    });
  });

  /* ── 7. The path: which figure is tied to all of these states? ── */
  pick(PL.filter(p => (p.clubs || []).length >= 2), 8).forEach(p => {
    const path = p.clubs.slice(0, 3);
    out.push({
      t: `Que personagem esteve ligado a todos estes estados?\n${path.map(clubName).join('  ·  ')}`,
      a: [p.id], type: 'player',
      path, textTiles: true,
      pool: PL.filter(x => x.id !== p.id && !path.every(c => (x.clubs || []).includes(c))).map(x => x.id),
      _cat: GC.path, d: 3,
    });
  });

  /* ── 8. Monuments ── */
  const STIDS = Object.keys(STAD);
  pick(STIDS.filter(k => STAD[k].p), 6).forEach(k => {
    const owner = STAD[k].p;
    out.push({
      t: `Qual destes estados está ligado ao monumento ${STAD[k].name} (${STAD[k].city})?`,
      a: [owner], pool: CL.filter(c => c.id !== owner).map(c => c.id), stad: k, _cat: GC.place, d: 3,
    });
  });
  pick(STIDS, 8).forEach(k => {
    const mine = STAD[k].city;
    const others = [...new Set(STIDS.map(x => STAD[x].city))].filter(c => c !== mine);
    if (others.length < 5) return;
    out.push({
      t: 'Onde fica este monumento?', type: 'txt',
      choices: shuf([mine].concat(pick(others, 5))), a: [mine], stad: k, _cat: GC.place, d: 2,
    });
  });

  /* ── 9. Region of a state ── */
  const REG_EM = { EU:'na Europa', AS:'na Ásia', AF:'na África', AM:'nas Américas' };
  pick(CL, 10).forEach(c => {
    out.push({
      t: `Qual destes estados surgiu ${REG_EM[c.s]}?`,
      a: [c.id], pool: CL.filter(x => x.s !== c.s).map(x => x.id), _noClub: true, _cat: GC.pol, d: 1,
    });
  });

  /* ── 10. Head-to-head: who lived longer, who was born first ── */
  for (let i = 0; i < 4; i++) {
    const two = pick(PL, 2);
    const span = p => p.era[1] - p.era[0];
    if (span(two[0]) === span(two[1]) || Math.abs(span(two[0]) - span(two[1])) < 8) continue;
    const longer = span(two[0]) > span(two[1]) ? two[0] : two[1];
    out.push({ t: 'Quem viveu mais tempo?', a: [longer.id], type: 'player',
               fixed: two.map(p => p.id), _cat: GC.era, d: 2 });
  }
  for (let i = 0; i < 5; i++) {
    const set = pick(PL, 10);
    const first = set.reduce((a, b) => (born(a) <= born(b) ? a : b));
    if (set.filter(p => born(p) === born(first)).length > 1) continue;
    out.push({ t: 'Qual destes personagens nasceu primeiro?',
               a: [first.id], type: 'player', fixed: set.map(p => p.id), _cat: GC.era, d: 3 });
  }
  for (let i = 0; i < 4; i++) {
    const set = pick(PL, 10);
    const last = set.reduce((a, b) => (born(a) >= born(b) ? a : b));
    if (set.filter(p => born(p) === born(last)).length > 1) continue;
    out.push({ t: 'Qual destes personagens nasceu por último?',
               a: [last.id], type: 'player', fixed: set.map(p => p.id), _cat: GC.era, d: 3 });
  }

  /* ── 11. The intruder from another age ── */
  for (let i = 0; i < 5; i++) {
    const c = rndOf(PL);
    const same = PL.filter(p => cent(p) === cent(c));
    const odd = PL.filter(p => Math.abs(born(p) - born(c)) > 250);
    if (same.length < 9 || !odd.length) continue;
    const o = rndOf(odd);
    out.push({
      t: `Nove destes personagens nasceram no ${cent(c)}. Qual é o intruso?`,
      a: [o.id], type: 'player',
      fixed: pick(same, 9).map(p => p.id).concat(o.id), _cat: GC.era, d: 3,
    });
  }

  /* ── 12. Contemporaries ── */
  pick(PL, 6).forEach(p => {
    const overlaps = x => x.id !== p.id &&
      Math.min(x.era[1], p.era[1]) - Math.max(x.era[0], p.era[0]) >= 25;
    const mates = PL.filter(overlaps);
    const strangers = PL.filter(x => x.id !== p.id && !overlaps(x) && Math.abs(x.era[0] - p.era[0]) > 120);
    if (!mates.length || strangers.length < 9) return;
    const mate = rndOf(mates);
    out.push({
      t: `Quem foi contemporâneo de ${p.n}?`,
      a: [mate.id], type: 'player',
      fixed: pick(strangers, 9).map(x => x.id).concat(mate.id),
      face: p.img, _cat: GC.era, d: 3,
    });
  });

  /* ── 13. Great events: who lived through them ── */
  const evIds = Object.keys(EVENTS);
  pick(evIds, 12).forEach(ev => {
    const E_ = EVENTS[ev];
    const yes = PL.filter(p => p.ev.includes(ev) && overlap(p, E_));
    const no  = PL.filter(p => !overlap(p, E_) && Math.min(Math.abs(p.era[1] - E_.y[0]), Math.abs(p.era[0] - E_.y[1])) > 60);
    if (!yes.length || no.length < 9) return;
    out.push({
      t: `Qual destes personagens viveu durante ${theEvent(ev)} (${yearTxt(E_.y[0])}–${yearTxt(E_.y[1])})?`,
      a: [rndOf(yes).id], type: 'player',
      pool: no.map(p => p.id), _cat: GC.event, d: 3,
    });
  });
  pick(evIds.filter(ev => PL.filter(p => p.ev.includes(ev) && overlap(p, EVENTS[ev])).length >= 2), 5).forEach(ev => {
    const E_ = EVENTS[ev];
    const yes = pick(PL.filter(p => p.ev.includes(ev) && overlap(p, E_)), 2);
    const no  = pick(PL.filter(p => !overlap(p, E_) && Math.abs(p.era[0] - E_.y[0]) < 220), 8);
    if (no.length < 8) return;
    out.push({
      t: `Selecione os 2 personagens que viveram durante ${theEvent(ev)}`,
      a: yes.map(p => p.id), type: 'player',
      fixed: yes.concat(no).map(p => p.id), _cat: GC.event, d: 3,
    });
  });

  /* ── 14. The Nobel Prize ── */
  for (let i = 0; i < 4; i++) {
    const yes = PL.filter(p => p.nb > 0);
    const no  = PL.filter(p => !p.nb && p.era[1] >= 1901);
    if (yes.length < 3 || no.length < 8) break;
    const two = pick(yes, 2);
    out.push({
      t: 'Selecione os 2 personagens que ganharam o Prêmio Nobel',
      a: two.map(p => p.id), type: 'player',
      fixed: two.concat(pick(no, 8)).map(p => p.id), _cat: GC.nobel, d: 3,
    });
  }
  pick(PL.filter(p => p.nb > 0), 5).forEach(p => {
    out.push({
      t: 'Qual destes personagens ganhou o Prêmio Nobel?',
      a: [p.id], type: 'player',
      pool: PL.filter(x => !x.nb && x.era[1] >= 1901).map(x => x.id), _cat: GC.nobel, d: 2,
    });
  });
  { const set = PL.filter(p => p.nb > 0);
    const two = set.filter(p => p.nb === 2);
    if (two.length) out.push({
      t: 'Qual destes personagens ganhou DOIS prêmios Nobel?',
      a: [two[0].id], type: 'player',
      fixed: [two[0]].concat(pick(set.filter(p => p.nb === 1), 9)).map(p => p.id), _cat: GC.nobel, d: 3,
    });
  }

  /* ── 15. Epithets, both ways round ── */
  const nickOk = p => {
    if (!p.nick) return false;
    const nk = _fold(p.nick), nm = _fold(p.n);
    const words = s => s.split(/[^a-z0-9]+/).filter(w => w.length >= 4 && !/^(autor|pintor|pai|primeiro|ultimo|imperador|rainha|lider|rei)$/.test(w));
    if (words(nm).some(w => nk.includes(w))) return false;
    return !PL.some(x => x.id !== p.id && x.nick && _fold(x.nick) === nk);
  };
  pick(PL.filter(nickOk), 12).forEach(p => {
    out.push({
      t: `Quem é conhecido como "${p.nick}"?`,
      a: [p.id], type: 'player',
      pool: PL.filter(x => x.id !== p.id).map(x => x.id), _cat: GC.nick,
      d: FAMOUS.has(p.id) ? 1 : 3,
    });
  });
  pick(PL.filter(nickOk), 8).forEach(p => {
    const others = pick(PL.filter(x => x.nick && x.id !== p.id && x.pos === p.pos && nickOk(x)), 5);
    if (others.length < 5) return;
    out.push({
      t: `Qual epíteto acompanha ${p.n}?`, type: 'txt',
      choices: shuf([p.nick].concat(others.map(x => x.nick))), a: [p.nick], face: p.img, _cat: GC.nick, d: 3,
    });
  });

  /* ── 16. Birthplace, the other way round: a country per figure ── */
  pick(PL.filter(natOk), 12).forEach(p => {
    const all = Object.keys(CTRY_NAME).filter(c => c !== p.ctry && FLAGS[c]);
    out.push({
      t: `Em que país nasceu ${p.n}?`, type: 'txt',
      choices: shuf([CTRY_NAME[p.ctry]].concat(pick(all, 5).map(c => CTRY_NAME[c]))), a: [CTRY_NAME[p.ctry]],
      face: p.img, _cat: GC.nat, d: 2,
    });
  });

  /* ── 17. Flags: whose is this? ── */
  pick(Object.keys(CTRY_NAME).filter(c => FLAGS[c]), 14).forEach(c => {
    const all = Object.keys(CTRY_NAME).filter(x => x !== c && FLAGS[x]);
    out.push({
      t: 'De que país é esta bandeira?', type: 'txt',
      choices: shuf([CTRY_NAME[c]].concat(pick(all, 5).map(x => CTRY_NAME[x]))), a: [CTRY_NAME[c]],
      flag: c, _flagIsQ: true, _cat: GC.flag, d: ['BRA', 'USA', 'FRA', 'ITA', 'GER', 'JPN', 'ESP', 'POR'].includes(c) ? 1 : 3,
    });
  });

  /* ── 18. Years: when did they die? (only where the date is not in dispute) ── */
  pick(PL.filter(p => born(p) >= 1400), 10).forEach(p => {
    const y = p.era[1];
    const opts = new Set();
    while (opts.size < 5) { const o = y + Math.round((rnd() - .5) * 2 * 22); if (o !== y && o > born(p) + 12) opts.add(o); }
    out.push({
      t: `Em que ano morreu ${p.n}?`, type: 'txt',
      choices: shuf([String(y)].concat([...opts].map(String))), a: [String(y)], face: p.img, _cat: GC.count, d: 4,
    });
  });
  pick(PL.filter(p => born(p) >= 1400), 8).forEach(p => {
    const y = born(p);
    const opts = new Set();
    while (opts.size < 5) { const o = y + Math.round((rnd() - .5) * 2 * 20); if (o !== y) opts.add(o); }
    out.push({
      t: `Em que ano nasceu ${p.n}?`, type: 'txt',
      choices: shuf([String(y)].concat([...opts].map(String))), a: [String(y)], face: p.img, _cat: GC.count, d: 4,
    });
  });

  /* ── 19. Duelo: two cards only ──
     Dates before the year 1000 are often approximate in the album, so an
     ancient pair needs a century between them; a modern pair, a decade.
     The closer the two, the harder the duel. */
  const sure = (a, b) => Math.abs(a - b) >= (Math.min(a, b) < 1000 ? 100 : 10);
  const duelD = gap => gap < 40 ? 3 : gap < 150 ? 2 : 1;
  for (let i = 0, made = 0; i < 60 && made < 12; i++) {
    const [p1, p2] = pick(PL.filter(p => p.era), 2);
    if (!p1 || !p2 || !sure(born(p1), born(p2))) continue;
    const first = born(p1) < born(p2) ? p1 : p2;
    out.push({ t: 'Duelo: quem nasceu primeiro?', type: 'player', a: [first.id], fixed: [p1.id, p2.id], duel: true,
               icon: 'hourglass', _cat: GC.duel, d: duelD(Math.abs(born(p1) - born(p2))) });
    made++;
  }
  for (let i = 0, made = 0; i < 40 && made < 6; i++) {
    const [c1, c2] = pick(CL, 2);
    if (!c1 || !c2 || !sure(c1.f, c2.f)) continue;
    const first = c1.f < c2.f ? c1 : c2;
    out.push({ t: 'Duelo: qual destes estados surgiu primeiro?', a: [first.id], fixed: [c1.id, c2.id], duel: true,
               icon: 'hourglass', _cat: GC.duel, d: duelD(Math.abs(c1.f - c2.f)) });
    made++;
  }
  /* who lived longer: only figures born after 1400, whose dates are certain,
     and a lifespan apart by at least eight years */
  for (let i = 0, made = 0; i < 60 && made < 6; i++) {
    const [p1, p2] = pick(PL.filter(p => p.era && born(p) >= 1400 && p.era[1] < 2026), 2);
    if (!p1 || !p2) continue;
    const l1 = p1.era[1] - p1.era[0], l2 = p2.era[1] - p2.era[0];
    if (Math.abs(l1 - l2) < 8) continue;
    out.push({ t: 'Duelo: quem viveu mais anos?', type: 'player', a: [l1 > l2 ? p1.id : p2.id], fixed: [p1.id, p2.id], duel: true,
               icon: 'hourglass', _cat: GC.duel, d: Math.abs(l1 - l2) < 20 ? 3 : 2 });
    made++;
  }

  // Safety net: a generator bug must never put an unanswerable question in front
  // of a player, so drop anything whose answers don't resolve.
  return out.filter(q =>
    !q._skip &&
    q.a && q.a.length &&
    (q.type === 'txt'
      ? Array.isArray(q.choices) && q.choices.length >= 4 &&
        new Set(q.choices).size === q.choices.length &&
        q.a.every(a => q.choices.includes(a))
      : q.a.every(id => (q.type === 'player' ? PL : CL).some(x => x.id === id))));
}

/* ═══════════════════════════════════════════════════
   GAME STATE
═══════════════════════════════════════════════════ */
let sc       = 'home';
let cat      = null;
let qi       = 0;
let numQs    = 10;
let diffKey  = 'facil';
let sel      = new Set();
let pts      = 0;
let prevPts  = 0;   // to detect score change for animation
let streak   = 0;
let disp     = [];
let tLeft    = 30;
let tMax     = 30;
let tmr      = null;
let lastMsg  = '';
/* ═══════════════════════════════════════════════════
   COMBO SCORING + PERSISTENCE
═══════════════════════════════════════════════════ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('fqbr_' + k);
                    return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fqbr_' + k, JSON.stringify(v)); } catch (e) {} },
};
let scores     = LS.get('scores', {});      // best points per difficulty
/* ── The album proper ───────────────────────────────────────
   Answer a player correctly and his figurinha is stuck into your album
   for good. This is the one piece of progress that survives every run
   and never goes down, so it is stored as a plain list of ids. */
let album      = new Set(LS.get('album', []));
function collect(ids) {
  const fresh = ids.filter(id => !album.has(id) && ALL_SET.has(id));
  fresh.forEach(id => album.add(id));
  if (fresh.length) LS.set('album', [...album]);
  return fresh;
}
const albumPct = () => Math.round(album.size / Math.max(1, ALL_STICKERS.length) * 100);
/* Medals were written against the player count and must keep meaning that —
   nobody should lose a medal because the album grew a badge sheet. */
const albPlayers = () => PL.reduce((n, p) => n + (album.has(p.id) ? 1 : 0), 0);

/* What a right answer earns, beyond the points.
     · a player question sticks the player, as it always has
     · a club question sticks that club's escudo
     · and once you have the escudo, getting the same club right again turns
       up the mascote — which is why the mascots are the rare sheet: you have
       to come back to a club you have already answered
     · a question that carries a country's flag sticks that seleção
   Every one of these is something the game already asks; nothing new had to
   be invented to hand them out. */
/* How many of a club's or a country's players you must hold before its badge
   is printed for you. Answering the club itself is the other way in. */
const ESC_NEED = 2, SEL_NEED = 3;

function earned(q) {
  const out = [];
  if (q.type === 'player') out.push(...q.a);
  else if (!q.type) {
    q.a.forEach(id => {
      if (!ALL_SET.has(SK.esc(id))) return;
      out.push(SK.esc(id));
      /* the escudo comes first and the mascote only on the way back: you have
         to answer a club you have already answered once */
      if (album.has(SK.esc(id))) { const mk = nextMonument(id); if (mk) out.push(SK.msc(mk)); }
    });
  }
  if (q.flag && ALL_SET.has(SK.sel(q.flag))) out.push(SK.sel(q.flag));
  if (q.stad && MASCOTS[q.stad] && !MASCOTS[q.stad].p) out.push(SK.msc(q.stad));

  /* ── The badges the questions alone would never hand out ──
     Only nine of the thirty-nine nations have a question carrying their flag,
     and the fifteen foreign clubs are never the answer to a club question —
     they are only ever somebody's employer. Left at that, thirty seleções and
     fifteen escudos were in the album and impossible to collect, and two of
     the new medals could not be earned at all.

     So a badge also comes from knowing the shirt: hold enough of a club's or
     a country's players and you have earned it. The count includes what this
     answer just won, which is why it runs on `got` and not on `album`. */
  const got = new Set([...album, ...out]);
  const nOf = ids => ids.reduce((n, id) => n + (got.has(id) ? 1 : 0), 0);
  const touched = new Set();
  out.forEach(sid => {
    const pl = PL.find(x => x.id === sid);
    if (!pl) return;
    (pl.clubs || []).forEach(c => touched.add('e:' + c));
    if (pl.ctry) touched.add('s:' + pl.ctry);
  });
  touched.forEach(sid => {
    if (got.has(sid) || !ALL_SET.has(sid)) return;
    const kind = sid.slice(0, 2), key = sid.slice(2);
    if (kind === 'e:') {
      const men = PL.filter(x => (x.clubs || []).includes(key)).map(x => x.id);
      if (nOf(men) >= Math.min(ESC_NEED, men.length)) out.push(sid);
    } else {
      const men = PL.filter(x => x.ctry === key).map(x => x.id);
      if (nOf(men) >= Math.min(SEL_NEED, men.length)) out.push(sid);
    }
  });
  return out;
}
let stats      = LS.get('stats', { games:0, correct:0, answered:0, bestStreak:0 });
let nCorrect   = 0;   // perfect answers this run
let nPartial   = 0;
let bestStreak = 0;
let lastGain   = 0;
let runLog     = [];  // per-question 3/1/0, for the share card
let runNew     = 0;   // figurinhas collected this run
let runNewIds  = [];  // and which ones, so the end screen can show them

/* points for one answer, with speed + combo + difficulty multipliers */
function scoreAnswer(base) {
  if (base <= 0) return { gained:0, mult:1, speed:0 };
  const frac  = tMax ? tLeft / tMax : 0;
  const speed = base === 3 ? (frac > 0.6 ? 2 : frac > 0.3 ? 1 : 0) : 0;
  const mult  = streak >= 6 ? 3 : streak >= 3 ? 2 : 1;
  return { gained: Math.round((base + speed) * mult * DCFG().pmul), mult, speed };
}


/* ═══════════════════════════════════════════════════
   DAILY CHALLENGE
   One identical 10-question run per day for everybody,
   plus a Wordle-style card that is easy to paste in WhatsApp.
═══════════════════════════════════════════════════ */
let isDaily = false;

function dailyDone() { return LS.get('dailyDay', -1) === dayIndex(); }
function dailyInfo() { return LS.get('dailyRes', null); }

function dailyStreakNow() {
  const last = LS.get('dailyDay', -1);
  const st   = LS.get('dailyStreak', 0);
  const today = dayIndex();
  if (last === today || last === today - 1) return st;
  return 0;                       // streak broken
}

function saveDaily() {
  const today = dayIndex(), last = LS.get('dailyDay', -1);
  let st = LS.get('dailyStreak', 0);
  st = (last === today - 1) ? st + 1 : (last === today ? st : 1);
  LS.set('dailyDay', today);
  LS.set('dailyStreak', st);
  LS.set('dailyRes', { pts, nCorrect, total: cat.qs.length, log: runLog, streak: st });
}

function shareText() {
  const link = 'https://tdosreis.github.io/history-quiz/';

  /* The ladder gets its own card: the climb reads better as a column of
     rungs than as a row of squares, and the number is the whole story. */
  if (isMil) {
    const climb   = LADDER.map((s, i) => i < rung ? '🟨' : '⬛').join('');
    const verdict = banked >= LADDER[LADDER.length - 1].v ? 'LEVEI O MILHÃO!'
                  : cashed ? 'parei e levei' : 'caí e levei';
    const albM = runNew
      ? `\n📔 ${runNew} ${runNew === 1 ? 'figurinha nova' : 'figurinhas novas'} · ${album.size}/${ALL_STICKERS.length} no álbum`
      : '';
    return `Rumo ao Milhão 📜 History Quiz\n${climb}\n`
         + `${verdict} ${money(banked)} · degrau ${rung}/${LADDER.length}${albM}\n${link}`;
  }

  const grid = runLog.map(p => p === 3 ? '🟩' : p === 1 ? '🟨' : p === -1 ? '⬜' : '⬛').join('');
  const head = isDaily ? `History Quiz 📜 Desafio #${dayIndex()}`
                       : `History Quiz 📜 ${DCFG().label}`;
  const strk = bestStreak >= 3 ? `  🔥${bestStreak}` : '';
  /* The album is the thing that makes this app not just another quiz, and the
     share card never mentioned it. One line, and only when the run actually
     stuck something in — a score alone says nothing about why to come back.
     It sits before the link, so the grid stays on the second line where the
     tests (and anyone skim-reading a WhatsApp message) expect it. */
  const alb = runNew
    ? `\n📔 ${runNew} ${runNew === 1 ? 'figurinha nova' : 'figurinhas novas'} · ${album.size}/${ALL_STICKERS.length} no álbum`
    : '';
  return `${head}\n${grid}\n${nCorrect}/${cat.qs.length} acertos · ${pts} pts${strk}${alb}\n${link}`;
}

function doShare() {
  const txt = shareText();
  if (navigator.share) {
    navigator.share({ text: txt }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => {
      const b = document.getElementById('bshare');
      if (b) { b.textContent = 'COPIADO!'; setTimeout(() => { b.textContent = 'COMPARTILHAR'; }, 1600); }
    }).catch(() => {});
  }
}

function startDaily() {
  isDaily = true; isSurv = false; isMil = false;

/* ═══════════════════════════════════════════════════
   AJUDAS (LIFELINES)
   The show's five cards, each usable once per run. They cost
   nothing but the speed bonus, so using one is a real trade-off.
     cortar   — burns half the wrong tiles
     placar   — the audience votes
     expert   — a pundit gives an opinion (and can be wrong)
     congelar — stops the clock for this question
     pular    — next question, same rung
   `parar` (cash out) lives with the ladder, not here: it ends the run.
═══════════════════════════════════════════════════ */
let lifes  = { half: 1, poll: 1, expert: 1, freeze: 1, skip: 1 };
let hidden = new Set();   // tiles burned by "cortar"
let frozen = false;       // clock paused for this question
let poll   = null;        // {id: percent} audience vote, drawn over the tiles
let expert = null;        // { id, line } the pundit's call

function resetLifes() {
  lifes  = { half: 1, poll: 1, expert: 1, freeze: 1, skip: 1 };
  hidden = new Set();
  frozen = false;
  poll   = null;
  expert = null;
  ladderOpen = false;
}

/* cleared between questions; the cards themselves stay spent */
function clearHelpers() {
  hidden = new Set();
  frozen = false;
  poll   = null;
  expert = null;
  ladderOpen = false;
}

/* How many tiles Cortar would actually burn right now. Some questions are
   two-way comparisons ("who had the longer career?"), where halving one
   wrong option rounds to nothing — the card must not be spent on those. */
function cutCount() {
  if (!cat || !cat.qs || !cat.qs[qi]) return 0;
  const q = cat.qs[qi];
  const wrong = disp.filter(o => !q.a.includes(o.id) && !hidden.has(o.id));
  return Math.floor(wrong.length / 2);
}

function useHalf() {
  if (!lifes.half || sc !== 'quiz' || cutCount() < 1) return;
  const q = cat.qs[qi];
  const wrong = disp.filter(o => !q.a.includes(o.id) && !hidden.has(o.id)).map(o => o.id);
  // remove half of the wrong options, keeping the board readable
  const drop = shuf(wrong).slice(0, cutCount());
  drop.forEach(id => { hidden.add(id); sel.delete(id); });
  lifes.half = 0;
  snd.cut();
  justCut = true;   // one render only: the pockets open, then stay open
  firedAid = 'bhalf';
  go();
}

/* ── PLACAR: the audience votes ──────────────────────────────
   The crowd is well informed but not infallible, and it gets shakier
   as the money climbs: the right answer takes the biggest share only
   about as often as the rung is easy. */
/* Three of the five ajudas answer the question "which of these is right?",
   and on a Linha do tempo card every tile is right — the question is the
   order, not the tiles. Pointing at one of four correct cards is not a
   clue, it is noise dressed as one, so those three are simply not on the
   table there. Congelar and Pular still are: time and escape work on any
   shape of question. */
const narrows = () => !(cat && cat.qs[qi] && cat.qs[qi].order);

function usePoll() {
  if (!lifes.poll || sc !== 'quiz' || !narrows()) return;
  const q    = cat.qs[qi];
  const live = disp.filter(o => !hidden.has(o.id));
  if (!live.length) return;

  /* How often the crowd's biggest bar is actually the right answer. Decided
     up front rather than emerging from weights, because this number is the
     whole balance of the card: too high and Placar is a free answer that
     makes the other four pointless, too low and nobody would spend it.
     ~88% on the first rung, ~22% on the last. */
  const acc     = isMil ? Math.max(0.22, 0.88 - rung * 0.045) : 0.75;
  const rightOf = live.filter(o => q.a.includes(o.id));
  const wrongOf = live.filter(o => !q.a.includes(o.id));
  const lands   = rnd() < acc && rightOf.length > 0;
  const pool    = lands ? rightOf : (wrongOf.length ? wrongOf : live);
  const winner  = pool[Math.floor(rnd() * pool.length)];

  /* The leading bar, then the remainder scattered over everyone else. Every
     other share is capped below the lead and whatever is left over from the
     rounding goes back to the winner, so the biggest bar is always the one
     the crowd actually picked — otherwise the card would lie about itself. */
  const lead   = Math.round(24 + rnd() * 22);      // 24–46%
  const others = live.filter(o => o.id !== winner.id);
  const noise  = others.map(o => ({ id: o.id, w: 0.25 + rnd() * rnd() * 3 }));
  const sum    = noise.reduce((s, x) => s + x.w, 0) || 1;
  const cap    = Math.max(1, Math.round(lead * .7));   // the lead reads as a lead, not a tie

  poll = {};
  let spent = 0;
  noise.forEach(x => {
    const share = Math.max(0, Math.min(cap, Math.round(x.w / sum * (100 - lead))));
    poll[x.id] = share;
    spent += share;
  });
  poll[winner.id] = 100 - spent;                   // ≥ lead, so always the tallest

  lifes.poll = 0;
  snd.crowd();
  firedAid = 'bpoll';
  go();
}

/* ── ESPECIALISTA: a commentator calls it ────────────────────
   Right most of the time early on, distinctly shaky near the million —
   and the phrasing tells you how much to trust him. */
const EXPERT_SURE  = ['Sem sombra de dúvida:', 'Pode marcar tranquilo:', 'Essa eu sei de cor:',
                      'Cravo aqui, sem medo:', 'Acompanhei isso de perto:'];
const EXPERT_UNSURE = ['Acho que é', 'Se a memória não falha,', 'Chutaria em',
                       'Na dúvida eu iria de', 'Vou no palpite:'];

function useExpert() {
  if (!lifes.expert || sc !== 'quiz' || !narrows()) return;
  const q    = cat.qs[qi];
  const live = disp.filter(o => !hidden.has(o.id));
  const acc  = isMil ? Math.max(0.4, 0.95 - rung * 0.038) : 0.8;
  const sure = rnd() < acc;

  const rightOnes = live.filter(o => q.a.includes(o.id));
  const wrongOnes = live.filter(o => !q.a.includes(o.id));
  const pickFrom  = sure && rightOnes.length ? rightOnes : (wrongOnes.length ? wrongOnes : live);
  const choice    = pickFrom[Math.floor(rnd() * pickFrom.length)];

  const lines = sure ? EXPERT_SURE : EXPERT_UNSURE;
  expert = {
    id: choice ? choice.id : null,
    sure,
    line: lines[Math.floor(rnd() * lines.length)],
    name: choice ? choice.n : '—',
  };
  lifes.expert = 0;
  snd.select();
  firedAid = 'bexpert';
  go();
}

function useFreeze() {
  if (!lifes.freeze || sc !== 'quiz') return;
  lifes.freeze = 0;
  frozen = true;
  snd.freeze();
  firedAid = 'bfreeze';
  go();
}

function useSkip() {
  if (!lifes.skip || sc !== 'quiz') return;
  lifes.skip = 0;
  clearInterval(tmr);
  snd.swipe();
  runLog.push(-1);                 // neither right nor wrong
  qi++;
  sel.clear(); clearHelpers(); lastMsg = '';
  if (qi >= cat.qs.length) { finishRun(); }
  else {
    sc = 'quiz'; tMax = qTime(); tLeft = tMax;
    disp = dealDisp(qi);
    startTmr();
  }
  firedAid = 'bskip';
  go();
}


/* ═══════════════════════════════════════════════════
   THE BACK OF THE STICKER

   A Panini figurinha has the player's details printed on the reverse.
   So does this one: when the answer is revealed, the card turns over
   and says who he was. Built from the data we already hold, so it is
   right by construction and there is no prose to keep in sync.
═══════════════════════════════════════════════════ */
/*@@facts@@*/
function playerFacts(p) {
  const out = [];
  out.push(`${POS_NAME[p.pos]} · ${CTRY_NAME[p.ctry] || p.ctry}`);
  if (p.era) out.push(eraTxt(p.era));
  const honours = [];
  if (p.nb) honours.push(p.nb === 1 ? 'Prêmio Nobel' : `${p.nb} Prêmios Nobel`);
  if (p.ev && p.ev.length) honours.push(p.ev.slice(0, 2).map(e => EVENTS[e].n).join(' · '));
  /* "Napoleão Bonaparte" already says Bonaparte — only print the epithet
     when it is not sitting in the name already. */
  const nick = p.nick && !p.n.toLowerCase().includes(p.nick.toLowerCase()) ? p.nick : null;
  return { line: out.join(' · '), honours,
           clubs: (p.clubs || []).slice(0, 4).map(clubName).join(' · '), nick };
}

function clubFacts(c) {
  return { line: `${yearTxt(c.f)} – ${c.e ? yearTxt(c.e) : 'hoje'} · ${REGION[c.s]}`, honours: [], clubs: '', nick: c.a };
}
/*@@/facts@@*/
/* The reverse of an album card, shaped like the front so it can sit in the
   same pocket and turn over into it. A real figurinha printed the player's
   details on the back and that is the whole reason you peeled it off the
   sheet and read it — the album had this data all along and never showed it.
   Only collected stickers turn: an empty pocket has no back. */
function figurinhaBack(p, num) {
  const f = playerFacts(p);
  const yrs = p.era ? eraTxt(p.era) : '';
  /* a real sticker back carries the club's crest printed faint behind the
     text — the ink the printer had left over */
  const wm = p.clubs && p.clubs[0] && LOGOS[p.clubs[0]];
  const c = copyOf(p.id);
  return `
    <span class="figback${c ? ' has-cert fin-' + c.f : ''}">
      ${backPaper(p.id, c)}
      ${wm ? `<img class="figback-wm" src="${wm}" alt="" aria-hidden="true" />` : ''}
      <span class="figback-h">
        <span class="figback-n">Nº ${String(num).padStart(3, '0')}</span>
        ${p.ctry ? flagSVG(p.ctry, 8) : ''}
      </span>
      <span class="figback-nm">${p.n}</span>
      ${f.nick ? `<span class="figback-nick">“${f.nick}”</span>` : ''}
      <span class="figback-rule"></span>
      <span class="figback-l"><b>${POS_NAME[p.pos]}</b> · ${CTRY_NAME[p.ctry] || p.ctry}</span>
      ${yrs ? `<span class="figback-l">${yrs}</span>` : ''}
      ${f.clubs ? `<span class="figback-l figback-clubs">${f.clubs}</span>` : ''}
      ${f.honours.length ? `<span class="figback-h2">${f.honours.join(' · ')}</span>` : ''}
      ${certBack(p.id, c)}
    </span>`;
}

/* The card, turned over. `isNew` puts the brass edge on a figurinha the
   player has just collected — the small reward for getting it right. */
function stickerBack(item, isPlayer, isNew) {
  const f = isPlayer ? playerFacts(item) : clubFacts(item);
  return `
  <div class="ficha${isNew ? ' ficha-new' : ''}">
    ${isPlayer
      ? `<div class="ficha-art print"><img src="${item.img}" alt="" aria-hidden="true" /></div>`
      : `<div class="ficha-art ficha-crest">${clubArt(item.id, '', false)}</div>`}
    <div class="ficha-txt">
      <div class="ficha-n">${item.n}${f.nick ? ` <em>“${f.nick}”</em>` : ''}</div>
      <div class="ficha-l">${f.line}</div>
      ${f.clubs ? `<div class="ficha-l">${f.clubs}</div>` : ''}
      ${f.honours.length ? `<div class="ficha-h">${f.honours.join(' · ')}</div>` : ''}
    </div>
    ${isNew ? `<span class="ficha-tag">${ICON.check('currentColor', 10)} nova</span>` : ''}
  </div>`;
}

/* ═══════════════════════════════════════════════════
   MEDALS — long-run progression
═══════════════════════════════════════════════════ */
/* The album's milestones, as a share of however many players it holds. */
/*@@monuments@@*/
/* ═══════════════════════════════════════════════════
   MONUMENTOS — the rarest sheet in the album

   A state's monument turns up only when you answer that state a second time:
   the first time earns its brasão, coming back to it earns the stone it left
   behind. Monuments with no state of their own — Petra, Stonehenge — are
   stuck by the question that shows their photograph.
   Every picture is a photograph from Wikimedia Commons, printed in a round
   window; the credits screen lists each one.
═══════════════════════════════════════════════════ */
let _mpN = 0;
const monDisc = (k, c1, c2, id = 'mp' + (++_mpN)) => `<svg viewBox="0 0 80 80" width="100%" aria-hidden="true"
  style="display:block;width:100%;height:100%;"><defs><clipPath id="${id}"><circle cx="40" cy="40" r="33"/></clipPath></defs>
  <rect width="80" height="80" fill="var(--retro-card)"/>
  <circle cx="40" cy="40" r="35.5" fill="${c2 || '#E9DDC1'}"/>
  <image href="${STAD_IMGS[k] || ''}" x="7" y="7" width="66" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id})"/>
  <circle cx="40" cy="40" r="33" fill="none" stroke="${c1 || '#7B1E3A'}" stroke-width="2.5"/>
</svg>`;
const MASC_ART = {};
const MASCOTS = {};
Object.keys(STAD).forEach(k => {
  MASCOTS[k] = { n: STAD[k].name, art: k, p: STAD[k].p || '', city: STAD[k].city };
  MASC_ART[k] = (c1, c2) => monDisc(k, c1, c2);
});
/* the first monument of a state the album does not hold yet */
const nextMonument = id => Object.keys(MASCOTS).find(k => MASCOTS[k].p === id && !album.has(SK.msc(k)));
/*@@/monuments@@*/
/* ═══════════════════════════════════════════════════
   THE OTHER STICKERS — escudos, seleções, mascotes

   A Panini album is not only faces. It opens with the badges, it has a page
   for the national teams, and somewhere in the middle is the sheet everyone
   wanted and nobody finished: the mascots.

   A player's sticker id has always been his own id, and a saved album is a
   plain list of those ids, so that cannot change — an album filled last month
   has to keep working. Everything added since is namespaced instead:
   `e:` escudo, `s:` seleção, `m:` mascote. An id with no prefix is a player,
   for ever.
═══════════════════════════════════════════════════ */
const SK = { esc: id => 'e:' + id, sel: c => 's:' + c, msc: id => 'm:' + id };

/* #RRGGBB -> rgba(). color-mix() would be the modern way and needs Chrome 111,
   which is not what every phone's WebView is. */
function hexA(hex, a) {
  const h = String(hex || '').replace('#', '');
  const f = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const n = parseInt(f, 16);
  if (!/^[0-9a-f]{6}$/i.test(f) || isNaN(n)) return `rgba(0,0,0,${a})`;
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* Brazil first, then abroad — the order a Brazilian album would print them. */
const ESCUDOS = CL.map(c => c.id)
  .concat(Object.keys(CLUB_NAMES).filter(id => LOGOS[id]).sort(
    (a, b) => clubName(a).localeCompare(clubName(b), 'pt')));

/* Only nations the album actually has players for — a flag with nothing
   behind it is not a sticker, it is a gap. */
const SELECOES = [...new Set(PL.map(p => p.ctry))].filter(c => c && FLAGS[c])
  .sort((a, b) => (CTRY_NAME[a] || a).localeCompare(CTRY_NAME[b] || b, 'pt'));

const MASCOTES = Object.keys(MASCOTS);

/* One descriptor for any sticker, whatever kind it is, so the album and the
   end screen never have to branch on the prefix themselves. */
function stk(sid) {
  const k = sid.slice(0, 2);
  if (k === 'e:') { const id = sid.slice(2);
    return { kind:'escudo',  id, n: clubName(id), sub:'Brasão' }; }
  if (k === 's:') { const c = sid.slice(2);
    return { kind:'selecao', id: c, n: CTRY_NAME[c] || c, sub:'Nação' }; }
  if (k === 'm:') { const id = sid.slice(2); const m = MASCOTS[id] || {};
    return { kind:'mascote', id, n: m.n || '', sub: m.city || '' }; }
  const p = PL.find(x => x.id === sid);
  return p ? { kind:'player', id: sid, n: p.n, p } : null;
}

/* Every sticker id in the album, players included. */
const ALL_STICKERS = PL.map(p => p.id)
  .concat(ESCUDOS.map(SK.esc), SELECOES.map(SK.sel), MASCOTES.map(SK.msc));
const ALL_SET = new Set(ALL_STICKERS);

/* ── A seleção, printed as a badge ──
   A flag stretched to the picture window read as a paint swatch. The badge
   is the flag cut to a shield, the cloth folded so it catches the light, a
   gold edge round it, and a star over it for every World Cup the country
   has won — the way the shirts carry them. */
let _selN = 0;
const WC_STARS = (() => {
  const byName = {};
  Object.keys(CTRY_NAME).forEach(c => { byName[CTRY_NAME[c]] = c; });
  const n = {};
  Object.values(typeof WC_ED !== 'undefined' ? WC_ED : {}).forEach(([, w]) => {
    const c = byName[w] || (w === 'Alemanha' ? 'GER' : null);
    if (c) n[c] = (n[c] || 0) + 1;
  });
  return n;
});
let _wcStars = null;
function selecaoArt(code) {
  const id = 'sh' + (++_selN);
  const art = FLAGS[code] || `<rect width="9" height="6" fill="#3a4a5a"/>`;
  const stars = (_wcStars = _wcStars || WC_STARS())[code] || 0;
  const shield = 'M50 4C63 11 79 12 94 9V60C94 88 72 104 50 114C28 104 6 88 6 60V9C21 12 37 11 50 4Z';
  const star = (cx, cy, R) => {
    let d = '';
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? R * .45 : R;
      d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(2) + ' ' + (cy + Math.sin(a) * rr).toFixed(2);
    }
    return d + 'Z';
  };
  const sw = 9.5, x0 = 50 - (stars - 1) * sw / 2;
  const starRow = Array.from({ length: stars }, (_, i) => star(x0 + i * sw, 0, 4.2)).join('');
  return `<span class="sel-art">
    <svg viewBox="0 -12 100 128" aria-hidden="true">
      <defs>
        <clipPath id="${id}c"><path d="${shield}"/></clipPath>
        <linearGradient id="${id}f" x1="0" x2="1" y1="0" y2=".25">
          <stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".16" stop-color="#fff" stop-opacity=".2"/>
          <stop offset=".34" stop-color="#000" stop-opacity=".14"/><stop offset=".52" stop-color="#fff" stop-opacity=".24"/>
          <stop offset=".72" stop-color="#000" stop-opacity=".16"/><stop offset=".88" stop-color="#fff" stop-opacity=".14"/>
          <stop offset="1" stop-color="#000" stop-opacity=".24"/></linearGradient>
        <linearGradient id="${id}g" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#FFF4C9"/><stop offset=".3" stop-color="#D9B25A"/>
          <stop offset=".55" stop-color="#8A6116"/><stop offset=".8" stop-color="#F1D27C"/><stop offset="1" stop-color="#9C7021"/></linearGradient>
        <radialGradient id="${id}s" cx=".3" cy=".15" r=".7">
          <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      ${stars ? `<path d="${starRow}" fill="url(#${id}g)" stroke="#5a3c08" stroke-width=".5"/>` : ''}
      <path d="${shield}" transform="translate(0 2.5)" fill="rgba(0,0,0,.35)"/>
      <g clip-path="url(#${id}c)">
        <svg x="-40" y="4" width="180" height="110" viewBox="0 0 9 6" preserveAspectRatio="xMidYMid slice">${art}</svg>
        <rect x="0" y="0" width="100" height="116" fill="url(#${id}f)"/>
        <rect x="0" y="0" width="100" height="116" fill="url(#${id}s)"/>
      </g>
      <path d="${shield}" fill="none" stroke="url(#${id}g)" stroke-width="4.5"/>
      <path d="${shield}" fill="none" stroke="rgba(40,25,5,.55)" stroke-width=".8" transform="translate(50 59) scale(.915) translate(-50 -59)"/>
    </svg>
    <span class="sel-code">${code}</span>
  </span>`;
}

/* An escudo, a flag or a mascot printed as a figurinha — same band / picture /
   caption skeleton as `figurinha`, so a row of them lines up with a row of
   players and the pocket numbers sit in the same place. */
function figExtra(sid, size, opts) {
  opts = opts || {};
  const st = stk(sid);
  if (!st) return '';
  /* A club name eats more of the caption than a player's does — "Internacional"
     is thirteen characters and broke across two lines at the player's
     threshold, hyphenless, as "INTERNACIONA / L". */
  const nmCls = 'fig-nm' + (st.n.length > 11 ? ' fig-nm-long' : '');
  let band = '', art = '', tint = '';

  if (st.kind === 'escudo') {
    const br = CL.find(c => c.id === st.id);
    band = br ? REGION[br.s].toUpperCase() : '';
    art  = `<span class="fig-crest">${clubArt(st.id, '', false)}</span>`;
  } else if (st.kind === 'selecao') {
    band = 'NAÇÃO';
    art  = selecaoArt(st.id);
    tint = ` style="--c1:${ctryColors(st.id)[0]};--c2:${ctryColors(st.id)[1]}"`;
  } else {
/*@@fx-msc@@*/
    band = 'MONUMENTO';
    const m  = MASCOTS[st.id] || {};
    const br = CL.find(c => c.id === m.p);
    tint = br ? ` style="background:${hexA(br.c1, .16)}"` : '';
    art  = `<span class="fig-msc">${(MASC_ART[m.art] || (() => ''))(br && br.c1, br && br.c2)}</span>`;
  }
/*@@/fx-msc@@*/
  const c = opts.copy || null;
  return `<span class="fig fig-retro fig-extra fig-x-${st.kind} fig-${size}${copyCls(sid, c)}">
    <span class="fig-band">${band}</span>
    <span class="fig-art"${tint}>${art}${artLayers(c, '')}</span>
    <span class="fig-cap"><span class="${nmCls}">${st.n}</span>
    <span class="fig-sub">${st.sub}</span></span>
    ${foilLayers(sid, c)}
  </span>`;
}

const ALB_HALF = Math.round(PL.length * 0.50);
const ALB_3Q   = Math.round(PL.length * 0.75);

const MEDALS = [
  { id:'first',  ic:'scroll', n:'Estreia',        d:'Jogue sua primeira partida',
    t: st => st.games >= 1 },
  { id:'ten',    ic:'column', n:'Rodada',         d:'Jogue 10 partidas',
    t: st => st.games >= 10, p: st => [st.games || 0, 10] },
  { id:'perfect',ic:'target', n:'Perfeição',      d:'Acerte 100% de uma partida',
    t: st => (st.perfect || 0) >= 1 },
  { id:'streak5',ic:'flame', n:'Pegando fogo',   d:'Sequência de 5 acertos',
    t: st => (st.bestStreak || 0) >= 5, p: st => [st.bestStreak || 0, 5] },
  { id:'streak10',ic:'rocket', n:'Imparável',     d:'Sequência de 10 acertos',
    t: st => (st.bestStreak || 0) >= 10, p: st => [st.bestStreak || 0, 10] },
  { id:'hard',   ic:'skull', n:'Cara de pau',    d:'80% ou mais no Difícil',
    t: st => (st.hard80 || 0) >= 1 },
  { id:'c100',   ic:'medal', n:'Centenário',     d:'100 acertos no total',
    t: st => (st.correct || 0) >= 100, p: st => [st.correct || 0, 100] },
  { id:'c500',   ic:'book', n:'Enciclopédia',   d:'500 acertos no total',
    t: st => (st.correct || 0) >= 500, p: st => [st.correct || 0, 500] },
  /* ── the album ──
     Written as fractions of the album, not fixed counts. "Meio álbum" was 60
     stickers, which was half of a 125-player album and 28% of a 215-player
     one; the name stayed true only until the album grew. The description
     prints the real number so the target is never a mystery. */
  { id:'alb25',  ic:'column', n:'Começou a colar', d:'Colecione 25 figurinhas',
    t: () => album.size >= 25, p: () => [album.size, 25] },
  /* Keeps its old threshold on purpose. These are computed live from the
     album's size, never stored, so moving 60 up to the new half would have
     taken the medal back off everyone sitting between the two. It only loses
     the name "Meio álbum", which stopped being true when the album grew. */
  { id:'alb60',  ic:'scroll',  n:'Sessenta coladas', d:'Colecione 60 figurinhas',
    t: () => album.size >= 60, p: () => [album.size, 60] },
  /* These two are half and three quarters of the PLAYERS, which is what the
     whole album was when they were written. The thresholds stay where they are
     — moving them up would take the medal back off anyone sitting between the
     old mark and the new one — but "Meio álbum" is no longer true of 149 out
     of 474, so they are named for what they are instead of for a fraction that
     goes stale every time the album grows. */
  { id:'albHalf',ic:'book',  n:'Colecionador',    d:`Colecione ${ALB_HALF} figurinhas`,
    t: () => album.size >= ALB_HALF, p: () => [album.size, ALB_HALF] },
  { id:'alb3q',  ic:'medal', n:'Arquivista',      d:`Colecione ${ALB_3Q} figurinhas`,
    t: () => album.size >= ALB_3Q, p: () => [album.size, ALB_3Q] },
  /* This one used to read `album.size >= PL.length`, which was the whole album
     when the whole album was players. Now that there are badge, national-team
     and mascot sheets behind them it has to count players specifically, or it
     would call the book finished with three empty sections in it. Anyone who
     has it today has all the players, so nobody loses it. */
  { id:'albAll', ic:'crown', n:'Todos os personagens', d:'Colecione todas as figuras da História',
    t: () => albPlayers() >= PL.length, p: () => [albPlayers(), PL.length] },

    t: () => SELECOES.every(c => album.has(SK.sel(c))),
    p: () => [SELECOES.filter(c => album.has(SK.sel(c))).length, SELECOES.length] },
  /* The monuments only turn up on a state you have already answered once, so this
     is the one that asks you to go back through the book. */
  { id:'albMsc', ic:'column',   n:'Folha dos monumentos', d:`Colecione os ${MASCOTES.length} monumentos`,
    t: () => MASCOTES.every(id => album.has(SK.msc(id))),

  { id:'safe1',  ic:'money', n:'Primeiro degrau', d:'Garanta R$ 5.000 no Milhão',
    t: st => (st.milBest || 0) >= 5000 },

function earnedMedals() { return MEDALS.filter(m => { try { return m.t(stats); } catch (e) { return false; } }); }

/* returns medals unlocked by the run that just finished */
function newMedals() {
  const had = new Set(LS.get('medals', []));
  const now = earnedMedals().map(m => m.id);
  LS.set('medals', now);
  const fresh = MEDALS.filter(m => now.includes(m.id) && !had.has(m.id));
  /* The day each one was won, printed on its card. Only from here on: the
     ones earned before this was kept show no date rather than a made-up one. */
  if (fresh.length) {
    const at = LS.get('medalAt', {});
    const d = new Date();
    const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    fresh.forEach(m => { if (!at[m.id]) at[m.id] = today; });
    LS.set('medalAt', at);
  }
  return fresh;
}

/* ── How the figurinhas especiais are printed ──
   Four sets, sectioned like the album. The shape of the emblem is the set;
   the ink is the tier. */
const MEDAL_SETS = [
  { id:'campo',  n:'Em campo',       tag:'Campo',  shape:'seal',
    ids:['first','ten','perfect','streak5','streak10','hard','c100','c500'] },
  { id:'album',  n:'O álbum',        tag:'Álbum',  shape:'shield',
    ids:['alb25','alb60','albHalf','alb3q','albAll','albEsc','albSel','albMsc','albBook'] },
  { id:'rotina', n:'Rotina',         tag:'Rotina', shape:'hex',
    ids:['daily3','daily7','surv10'] },
  { id:'milhao', n:'Rumo ao Milhão', tag:'Milhão', shape:'coin',
    ids:['safe1','safe2','quit','million'] },
];
/* How hard each one is to get, not how many people hold it — there is no
   server to count that, and a made-up percentage would be a lie. */
const MEDAL_TIER = {
  first:1, ten:1, streak5:1, alb25:1, daily3:1, safe1:1,
  perfect:2, streak10:2, c100:2, alb60:2, albHalf:2, daily7:2, safe2:2,
  hard:3, c500:3, alb3q:3, albEsc:3, albSel:3, albMsc:3, surv10:3, quit:3,
  albAll:4, albBook:4, million:4,
};
const TIER_NAME = ['', 'Comum', 'Rara', 'Épica', 'Lendária'];
const medalSet = m => MEDAL_SETS.find(s => s.ids.includes(m.id)) || MEDAL_SETS[0];

const INS_SHAPE = (() => {
  const seal = [];
  for (let i = 0; i < 40; i++) {
    const a = i / 40 * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 27.6 : 30.8;
    seal.push(`${(32 + r * Math.cos(a)).toFixed(1)},${(32 + r * Math.sin(a)).toFixed(1)}`);
  }
  return {
    seal:   `<polygon points="${seal.join(' ')}"/>`,
    shield: '<path d="M32 3 57 10.5V30c0 16.5-10.5 26.5-25 31C17.5 56.5 7 46.5 7 30V10.5Z"/>',
    hex:    '<path d="M32 2.5 57.5 17.2v29.6L32 61.5 6.5 46.8V17.2Z"/>',
    coin:   '<circle cx="32" cy="32" r="30"/>',
  };
})();

function medalProgress(m) {
  if (!m.p) return null;
  try {
    const [have, need] = m.p(stats);
    return { have: Math.min(have, need), need,
             pct: Math.max(0, Math.min(100, Math.round(have / need * 100))) };
  } catch (e) { return null; }
}
const fmtDay = iso => iso ? iso.split('-').reverse().join('/') : '';

/* One figurinha especial, as printed on its own screen. */
/* The back of a figurinha especial, seen only when it is held up and turned. */
function medalBack(m, on) {
  const set = medalSet(m), tier = MEDAL_TIER[m.id] || 1;
  const pr = on ? null : medalProgress(m);
  const at = on ? LS.get('medalAt', {})[m.id] : null;
  return `<div class="ins ins-r${tier} ${on ? 'is-on' : 'is-off'} ins-back">
    <span class="ins-band"><span>${set.tag}</span><span>Nº ${String(MEDALS.indexOf(m) + 1).padStart(2, '0')}</span></span>
    <span class="insb-set">${set.n}</span>
    <span class="insb-nm">${m.n}</span>
    <span class="insb-rule"></span>
    <span class="insb-d">${m.d}</span>
    <span class="insb-st">${on ? (at ? `Conquistada em ${fmtDay(at)}` : 'Conquistada') : 'Ainda não conquistada'}</span>
    ${pr ? `<span class="insb-pr"><b>${pr.have}</b> de ${pr.need}</span>
      <span class="ins-prog"><i style="width:${pr.pct}%"></i></span>` : ''}
    <span class="ins-rar"><span class="ins-pips">${
      [1, 2, 3, 4].map(k => `<i${k <= tier ? ' class="on"' : ''}></i>`).join('')}</span>${TIER_NAME[tier]}</span>
  </div>`;
}

/* ── Held up to the light ─────────────────────────────────────
   A tap lifts the card off the page and brings it to the middle of the
   screen, big enough to read; the next tap turns it over, the one after
   turns it back. Tapping outside, the close button or Escape puts it back
   where it came from. The card is scaled rather than re-laid-out, so it is
   the same card, just closer. */
let _zoom = null;
function openZoom(src, front, back, lookFrom, opts) {
  opts = opts || {};
  if (_zoom || !src) return;
  const r = src.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const k = Math.max(1, Math.min(Math.min(vw * 0.8, 340) / r.width, (vh * 0.68) / r.height));
  /* A card built at its final size (`opts.w`) is laid out and drawn there,
     crisp; only its flight out of the pocket is scaled. Blowing the pocket
     up four times instead left Android drawing a 75px card stretched to
     340 — soft lettering, a fuzzy guilloché, a slow turn. */
  const native = !!opts.w;
  const cw = native ? opts.w : r.width, ch = native ? opts.h : r.height;
  const z = document.createElement('div');
  z.className = 'zoom';
  z.setAttribute('role', 'dialog');
  z.setAttribute('aria-modal', 'true');
  z.setAttribute('aria-label', 'Figurinha ampliada');
  z.innerHTML = `<div class="zoom-scrim"></div>
    <div class="zoom-card" tabindex="0" role="button" aria-label="Virar a figurinha"
      style="width:${cw}px;height:${ch}px">
      <div class="zoom-in">
        <div class="zoom-face zoom-front">${front}</div>
        <div class="zoom-face zoom-back">${back}</div>
      </div>
      <span class="zoom-scanline" aria-hidden="true"></span>
    </div>
    <button class="zoom-x" type="button" aria-label="Fechar">${ICON.close ? ICON.close('currentColor', 16) : '×'}</button>
    ${opts.sid ? zoomLabel(opts.sid) : ''}
    <div class="zoom-hint">Toque na figurinha para virar${opts.sid && anyCopy(opts.sid) && anyCopy(opts.sid).f > 0 ? ' · incline para ver o brilho' : ''}</div>
    ${opts.sid ? zoomActs(opts.sid) : ''}`;
  document.body.appendChild(z);
  const card = z.querySelector('.zoom-card');
  if (opts.sid) { z.classList.add('has-acts'); wireZoomActs(z, opts.sid);
    const zc = anyCopy(opts.sid); if (zc) z.dataset.f = zc.v ? 'v' : zc.f; }
  Tilt.ask();
  /* ── the light follows the finger ──
     Over a zoomed card the pointer is the lamp: the card leans towards it and
     the foil slides with it. Let go and it settles back to the phone's tilt. */
  let tiltT = 0;
  z.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' && !e.isPrimary) return;
    const rc = card.getBoundingClientRect();
    const w = rc.width / 2 || 1, h = rc.height / 2 || 1;
    const gx = Math.max(-1, Math.min(1, (e.clientX - (rc.left + rc.width / 2)) / Math.max(w, 120)));
    const gy = Math.max(-1, Math.min(1, (e.clientY - (rc.top + rc.height / 2)) / Math.max(h, 160)));
    card.style.setProperty('--gx', gx.toFixed(3));
    card.style.setProperty('--gy', gy.toFixed(3));
    z.classList.add('is-tilting');
    clearTimeout(tiltT);
    tiltT = setTimeout(() => z.classList.remove('is-tilting'), 160);
  });
  z.addEventListener('pointerleave', () => { card.style.removeProperty('--gx'); card.style.removeProperty('--gy'); Tilt.lx = 9; });
  /* the album shrinks its lettering on small pockets with container queries;
     the copy is outside that container, so it takes the sizes it had */
  if (lookFrom && !native) {
    const dst = z.querySelector('.zoom-front');
    ['.fig-band', '.fig-nm', '.fig-sub', '.fig-cap'].forEach(sel => {
      const a = lookFrom.querySelectorAll(sel), b = dst.querySelectorAll(sel);
      a.forEach((el, i) => {
        if (!b[i]) return;
        const cs = getComputedStyle(el);
        ['fontSize', 'letterSpacing', 'paddingLeft', 'paddingRight', 'display', 'height', 'lineHeight']
          .forEach(p => { b[i].style[p] = cs[p]; });
      });
    });
  }
  /* the zoom is the pocket scaled up k times, so its lettering is laid out
     at pocket size: what matters is how big it reads once scaled — 7px on the
     glass, still plain on a card this size — not how far it shrank from the
     pocket's own size */
  if (!native) try { fitFigText(z.querySelector('.zoom-front'), 7 / k, 0); } catch (e) {}
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cx = vw / 2, cy = vh / 2;
  const at = rect => `translate(calc(-50% + ${rect.left + rect.width / 2 - cx}px), calc(-50% + ${rect.top + rect.height / 2 - cy}px)) scale(${native ? (rect.width / cw).toFixed(4) : 1})`;
  const big = native ? 'translate(-50%, -50%)' : `translate(-50%, -50%) scale(${k})`;
  card.style.transform = big;
  if (!still && card.animate) card.animate([{ transform: at(r) }, { transform: big }],
    { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)' });
  src.style.visibility = 'hidden';
  const turnOver = () => { z.classList.remove('is-tilting'); z.classList.toggle('is-turned'); snd.swipe(); };
  const onKey = e => {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === card) { e.preventDefault(); turnOver(); }
  };
  const close = () => {
    if (!_zoom) return;
    _zoom = null;
    document.removeEventListener('keydown', onKey);
    const done = () => { z.remove(); src.style.visibility = '';
      if (z.dataset.dirty && sc === 'vitrine') go(); };
    z.classList.add('is-closing');
    z.classList.remove('is-turned');
    const home = src.isConnected ? src.getBoundingClientRect() : r;
    if (!still && card.animate) {
      const a = card.animate([{ transform: big }, { transform: at(home) }],
        { duration: 300, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
      a.onfinish = done;
      setTimeout(done, 600);
    } else done();
  };
  card.addEventListener('click', turnOver);
  z.querySelector('.zoom-scrim').addEventListener('click', close);
  z.querySelector('.zoom-x').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  _zoom = { close };
  snd.swipe();
  try { card.focus({ preventScroll: true }); } catch (e) {}
}
